    };

    const r=await db.from('workouts').insert(payload).select().single();
    if(r.error)throw r.error;

    // Notes belong to the user's routine and persist across weeks/devices.
    // Never use the weekly workout row as the only source of truth.
    const noteWrites=(activeWorkout.exercises||[]).map(async e=>{
      const note=String(activeWorkout.sets[e.id]?.note??'');
      const exerciseKey=simpleNormalizeNoteKey(e.name);
      if(!exerciseKey)return;
      const assignedRoutineIds=(assignments||[])
        .filter(a=>String(a.client_id||user?.id)===String(user?.id))
        .flatMap(a=>[a.trainer_routine_id,a.client_routine_id])
        .filter(Boolean)
        .map(String);
      const noteRoutineIds=[...new Set([
        String(workoutRoutine?.id||''),
        String(workoutRoutine?.trainer_routine_id||''),
        String(workoutRoutine?.source_routine_id||''),
        ...assignedRoutineIds
      ].filter(Boolean))];
      const nq=await Promise.all(noteRoutineIds.map(rid=>db.from('routine_user_notes').upsert({
        user_id:user.id,routine_id:rid,exercise_key:exerciseKey,note,updated_at:new Date().toISOString()
      },{onConflict:'user_id,routine_id,exercise_key'})));
      const bad=nq.find(x=>x.error);
      if(bad?.error)console.warn('No se pudo persistir la nota del ejercicio:',e.name,bad.error);
    });
    await Promise.all(noteWrites);

    // Trainer notes remain part of the shared routine template. A client note
    // is never written into routine_exercises and can therefore not overwrite
    // the trainer's note.
    if(profile?.role==='trainer'){
      const globalWrites=(activeWorkout.exercises||[]).map(async e=>{
        const note=String(activeWorkout.sets[e.id]?.note??'');
        const nq=await db.from('routine_exercises').update({notes:note||null})
          .eq('id',e.id).eq('day_id',activeWorkout.day.id);
        if(nq.error)console.warn('No se pudo actualizar la nota compartida:',e.name,nq.error);
      });
      await Promise.all(globalWrites);
    }

    window.__lastSavedWorkoutKey=currentKey;
    // La sesión acaba de terminar: cualquier borrador anterior de este
    // mismo día queda invalidado y la próxima apertura empieza limpia.
    markWorkoutCompleted();
    clearWorkoutDraft();
    activeWorkout.locked=true;
    activeWorkout.lockedSession=r.data||null;

    toast('Sesión guardada correctamente');
    // Actualiza la barra visible inmediatamente, sin recargar la página.
    try{
      if(profile?.role==='trainer'){
        const mineBox=document.getElementById('mine');
        if(mineBox && getComputedStyle(mineBox).display!=='none') await renderMine();
        const sharedBox=document.getElementById('shared');
        if(sharedBox && getComputedStyle(sharedBox).display!=='none') await renderShared();
      }else{
        const sharedBox=document.getElementById('shared');
        if(sharedBox && getComputedStyle(sharedBox).display!=='none') await renderShared();
      }
    }catch(e){console.warn('weekly progress refresh:',e)}
    // La sesión ya está guardada: cerramos el entrenamiento y volvemos
    // automáticamente al menú principal correspondiente. Al marcarla como
    // bloqueada antes de cerrar evitamos que closeM() cree un borrador.
    try{
      await loadHistory(workoutRoutine?.id);
    }catch(refreshErr){
      console.warn('Sesión guardada, pero no se pudo refrescar el historial:',refreshErr);
    }
    activeWorkout.locked=true;
    activeWorkout=null;
    closeM('trainModal');
    if(profile?.role==='trainer'){
      await renderMine();
      view('mine');
    }else{
      await renderShared();
      view('shared');
    }
  }catch(e){
    console.error('saveWorkoutSession:',e);

    if(e?.code==='23505'){
      window.__lastSavedWorkoutKey=currentKey;

      if(activeWorkout){
        activeWorkout.locked=true;
        activeWorkout.lockedSession=null;
        renderWorkoutDay();
      }

      return toast('Este entrenamiento ya está guardado hoy.');
    }

    toast('No se pudo guardar la sesión: '+(e.message||'revisa la tabla workouts'));
  }finally{
    window.__savingWorkout=false;
  }
}

async function createShareCode(routineId){
  if(window.__shareBusy) return;
  window.__shareBusy = true;
  const btns=document.querySelectorAll('#shareModal button');
  btns.forEach(b=>b.disabled=true);
  try{
    if(!user?.id) return toast('Debes iniciar sesión.');
    if(!routineId) return toast('No se ha seleccionado una rutina.');

    const uses=Number($('shareUses')?.value ?? 1);
    const days=Number($('shareExpiry')?.value ?? 0);
    const expires=days ? new Date(Date.now()+days*86400000).toISOString() : null;

    if(!Number.isInteger(uses) || uses < 0)
      return toast('El límite de usos no es válido.');

    const r=await db.rpc('create_routine_share_code',{
      p_routine_id:routineId,
      p_max_uses:uses,
      p_expires_at:expires
    });

    if(r.error){
      console.error('create share code:',r.error);
      return toast(r.error.message || 'No se pudo generar el código.');
    }

    const row=Array.isArray(r.data) ? r.data[0] : r.data;
    const value=row?.code ?? row;
    if(!value) return toast('Supabase no devolvió ningún código.');

    const result=$('shareResult');
    if(result) result.innerHTML=`
      <div class="card" style="text-align:center">
        <div class="muted">Código de acceso</div>
        <div style="font-size:30px;font-weight:800;letter-spacing:4px;margin:8px 0">${esc(value)}</div>
        <div class="muted">Comparte este código con tu cliente.</div>
      </div>`;
  }catch(e){
    console.error('createShareCode unexpected error:',e);
    toast(e?.message || 'No se pudo generar el código.');
  }finally{
    window.__shareBusy=false;
    btns.forEach(b=>b.disabled=false);
  }
}


async function removeSharedRoutine(assignmentId, routineName){
  if(window.__removeSharedBusy)return;
  const ok=confirm(`¿Quieres mover "${routineName||'esta rutina'}" a la papelera?\n\nPodrás restaurarla después.`);
  if(!ok)return;
  window.__removeSharedBusy=true;
  try{
    const a0=(assignments||[]).find(x=>String(x.id)===String(assignmentId) && String(x.client_id)===String(user.id));
    if(!a0?.id||!a0?.trainer_routine_id){
      throw new Error('No se encontró la asignación. No se ha borrado nada.');
    }

    const stamp=new Date().toISOString();
    let sourceRoutine=null;
    try{
      const sr=await db.from('routines')
        .select('id,name,description').eq('id',a0.trainer_routine_id).maybeSingle();
      if(sr.error)throw sr.error;
      sourceRoutine=sr.data||null;
    }catch(err){
      console.warn('No se pudo leer la rutina compartida antes de ocultarla:',err);
    }

    const key='simple_client_trash_'+user.id;
    let cached=[];try{cached=JSON.parse(localStorage.getItem(key)||'[]')}catch(_){}
    if(!Array.isArray(cached))cached=[];
    let meta={};
    try{
      const mk='simple_shared_routine_meta_'+user.id;
      meta=JSON.parse(localStorage.getItem(mk)||'{}')?.[String(a0.trainer_routine_id)]||{};
    }catch(_){}
    // routineName comes directly from the visible routine card, so it is the
    // authoritative fallback when trainer-owned routine SELECT is hidden by RLS.
    const r=await db.from('routine_assignments')
      .update({client_deleted_at:stamp})
      .eq('id',a0.id)
      .eq('client_id',user.id)
      .is('client_deleted_at',null)
      .select('id,client_deleted_at')
      .maybeSingle();
    if(r.error)throw r.error;
    if(!r.data?.client_deleted_at)throw new Error('No se pudo mover la rutina a la papelera.');

    const realName=sourceRoutine?.name||routineName||meta.name||'Rutina';
    const realDescription=sourceRoutine?.description||meta.description||'';
    const trashRow={
      id:a0.id,
      trainer_routine_id:a0.trainer_routine_id,
      created_at:a0.created_at||stamp,
      client_deleted_at:stamp,
      routine_name:realName,
      routine_description:realDescription
    };
    localStorage.setItem(key,JSON.stringify([
      trashRow,
      ...cached.filter(x=>String(x.id)!==String(trashRow.id))
    ]));

    await reload();
    renderShared();
    await renderClientTrash();
    toast('Rutina movida a la papelera');
  }catch(e){
    console.error('remove shared routine:',e);
    toast(e?.message||'No se pudo mover la rutina a la papelera.');
  }finally{window.__removeSharedBusy=false}
}




function simpleWeekStartDate(){
  const d=new Date();
  d.setHours(0,0,0,0);
  const day=d.getDay();
  d.setDate(d.getDate()+(day===0?-6:1-day));
  return simpleLocalDateKey(d);
}
function simpleSessionTimestamp(row){
  const data=row?.data||{};
  const instant=data.completed_at||row?.created_at||data.created_at||data.date;
  if(instant){
    const t=Date.parse(instant);
    if(Number.isFinite(t))return t;
  }
  // `workout_date` is a PostgreSQL DATE, not a UTC timestamp. Parse it as a
  // local calendar date so progress/history cannot shift one day by timezone.
  const dateKey=data.workout_date||row?.workout_date;
  const dateObj=simpleDateFromKey(dateKey);
  if(dateObj)return dateObj.getTime();
  return 0;
}
function simpleDailyProgressFromSessions(sessions,total,aliases={},routineIds=[]){
  const maxDays=Math.max(0,Number(total)||0);
  if(!maxDays)return 0;

  const primaryIds=new Set((routineIds||[]).filter(Boolean).map(String));
  const aliasToPrimary=new Map();
  for(const rid of primaryIds)aliasToPrimary.set(rid,rid);
  for(const [primary,alias] of Object.entries(aliases||{})){
    if(alias)aliasToPrimary.set(String(alias),String(primary));
  }

  const resolveRoutineDayKey=row=>{
    const d=row?.data||{};
    const rid=String(d.routine_id||d.routineId||'');
    const sourceRid=String(d.source_routine_id||'');
    if(primaryIds.size){
      const mappedRid=aliasToPrimary.get(rid)||aliasToPrimary.get(sourceRid);
      if(!mappedRid && rid && !primaryIds.has(rid))return '';
    }
    const dayId=String(d.routine_day_id||'');
    const dayName=String(d.day_name??row?.variant??row?.day??'').trim().toLowerCase();
    return dayId||dayName;
  };

  const normalized=(sessions||[])
    .map(row=>{
      const raw=row?.workout_date ?? row?.data?.workout_date ?? '';
      const dateKey=/^\d{4}-\d{2}-\d{2}$/.test(String(raw).trim())
        ? String(raw).trim()
        : simpleLocalDateKey(simpleDateFromKey(raw)||new Date(simpleSessionTimestamp(row)));
      const ts=simpleSessionTimestamp(row);
      return {row,dateKey,ts};
    })
    .filter(x=>x.dateKey && Number.isFinite(x.ts))
    .sort((a,b)=>a.ts-b.ts);

  if(!normalized.length)return 0;

  // The progress is a rolling routine cycle, NOT a calendar week.
  // Important: when the cycle is completed today, keep it at 100% (X/X)
  // for the rest of today. It starts at 0/X on the following calendar day.
  let seen=new Set();
  let cycleCompletedToday=false;
  const todayKey=simpleLocalDateKey(new Date());

  for(let i=0;i<normalized.length;i++){
    const key=resolveRoutineDayKey(normalized[i].row);
    if(key)seen.add(key);
    if(seen.size>=maxDays){
      if(normalized[i].dateKey===todayKey){
        cycleCompletedToday=true;
        break;
      }
      seen=new Set();
    }
  }

  if(cycleCompletedToday)return maxDays;
  return Math.min(maxDays,seen.size);
}

// Backwards-compatible name used by older callers.
function simpleWeeklyProgressFromSessions(sessions,total,weekStart,aliases,routineIds){
  return simpleDailyProgressFromSessions(sessions,total,aliases,routineIds);
}

async function getWeeklyRoutineProgressForUser(userId,routineIds,workoutRoutineAliases={},routineNames={}){
  const primaryIds=[...new Set((routineIds||[]).filter(Boolean).map(String))];
  const result=new Map(primaryIds.map(id=>[id,{total:0,done:0}]));
  if(!primaryIds.length||!userId)return result;

  const aliasToPrimary=new Map(primaryIds.map(id=>[id,id]));
  for(const [primary,alias] of Object.entries(workoutRoutineAliases||{})){
    if(alias)aliasToPrimary.set(String(alias),String(primary));
  }

  // Client viewed by trainer: use one authorized server-side calculation.
  // This is the source of truth for the current routine cycle.
  if(String(userId)!==String(user?.id)){
    await Promise.all(primaryIds.map(async rid=>{
      const x=result.get(rid);
      try{
        const rpc=await db.rpc('get_client_routine_cycle_progress',{
          p_client_id:String(userId),
          p_routine_id:String(rid)
        });
        if(rpc.error)throw rpc.error;
        const row=(rpc.data||[])[0]||{};
        x.total=Number(row.total_days)||0;
        x.done=Math.min(x.total,Math.max(0,Number(row.completed_days)||0));
      }catch(e){
        console.error('getWeeklyRoutineProgressForUser client:',e);
        x.total=0;
        x.done=0;
      }
    }));
    return result;
  }

  // Own user: read all workout history and resolve each session to its routine.
  try{
    const allIds=[...new Set([
      ...primaryIds,
      ...Object.values(workoutRoutineAliases||{}).filter(Boolean).map(String)
    ])];

    const dayRows=await db.from('routine_days')
      .select('id,routine_id,name')
      .in('routine_id',allIds);
    if(dayRows.error)throw dayRows.error;

    const dayToPrimary=new Map();
    for(const d of (dayRows.data||[])){
      const rid=String(d.routine_id);
      const primary=aliasToPrimary.get(rid)||rid;
      if(!result.has(primary))continue;
      result.get(primary).total++;
      dayToPrimary.set(String(d.id),primary);
    }

    const w=await db.from('workouts')
      .select('id,workout_date,data,variant,day')
      .eq('user_id',userId)
      .order('workout_date',{ascending:true});
    if(w.error)throw w.error;

    const sessionsByRoutine=new Map(primaryIds.map(id=>[id,[]]));

    for(const row of (w.data||[])){
      const d=row.data||{};
      const rid=String(d.routine_id||d.routineId||'');
      const sourceRid=String(d.source_routine_id||'');
      const dayId=String(d.routine_day_id||'');
      const savedName=String(d.routine_name||'').trim().toLowerCase();

      let primary=dayToPrimary.get(dayId)
        ||aliasToPrimary.get(rid)
        ||aliasToPrimary.get(sourceRid);

      if(!primary && savedName){
        for(const [id,name] of Object.entries(routineNames||{})){
          if(String(name||'').trim().toLowerCase()===savedName){
            primary=String(id);
            break;
          }
        }
      }

      if(!primary || !result.has(primary))continue;
      sessionsByRoutine.get(primary).push(row);
    }

    for(const rid of primaryIds){
      const x=result.get(rid);
      x.done=simpleDailyProgressFromSessions(
        sessionsByRoutine.get(rid)||[],
        x.total,
        workoutRoutineAliases,
        primaryIds
      );
    }
  }catch(e){
    console.error('getWeeklyRoutineProgressForUser:',e);
  }
  return result;
}

function renderWeeklyRoutineProgress(totalDays,completedDays){
  const total=Math.max(0,Number(totalDays)||0);
  const done=Math.min(total,Math.max(0,Number(completedDays)||0));
  const pct=total?Math.round(done/total*100):0;
  if(!total)return '';
  const isComplete=done>=total;
  const celebration=isComplete?`
    <div class="weekly-progress-celebration" aria-label="Rutina completada hoy">
      <img class="weekly-progress-gif" src="https://media.tenor.com/uYAHiDSVAn4AAAA1/baldi-dance.webp" alt="Baile de celebración" loading="lazy" referrerpolicy="no-referrer">
      <div class="weekly-progress-celebration-copy">
        <b>¡Rutina completada hoy! 🔥</b>
      </div>
    </div>`:'';
  return `<div class="weekly-routine-progress">
    <div class="weekly-routine-progress-head"><span>Progreso de hoy</span><b>${done}/${total} · ${pct}%</b></div>
    <div class="weekly-progress-complete-row">
      <div class="weekly-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}">
        ${Array.from({length:total},(_,i)=>`<span class="weekly-progress-segment ${i<done?'is-done':''}"></span>`).join('')}
      </div>
      ${celebration}
    </div>
  </div>`;
}
async function renderShared(){
  let h=`<div class="card">
    <h2 style="margin:0 0 4px">Mis rutinas</h2>
    <div class="muted">Rutinas que un entrenador te ha asignado.</div>
  </div>`;
  const mk='simple_shared_routine_meta_'+user.id;
  let mm={};try{mm=JSON.parse(localStorage.getItem(mk)||'{}')}catch(_){}

  const rows=assignments||[];
  const trainerRoutineIds=[...new Set(rows.map(a=>String(a.trainer_routine_id)).filter(Boolean))];
  const routineById=new Map();
  const routineIds=[...new Set(rows.map(a=>String(a.client_routine_id||a.trainer_routine_id)).filter(Boolean))];
  // Metadata and weekly progress are independent, so don't make the UI wait
  // for one network round-trip before starting the other.
  const weeklyRoutineIds=[...new Set([...routineIds,...trainerRoutineIds])];
  const weeklyAliases={};
  for(const a of rows){
    if(a.trainer_routine_id&&a.client_routine_id) weeklyAliases[String(a.trainer_routine_id)]=String(a.client_routine_id);
  }
  const [routineResult,weeklyAll]=await Promise.all([
    trainerRoutineIds.length
      ? db.from('routines').select('id,name,description').in('id',trainerRoutineIds)
      : Promise.resolve({data:[],error:null}),
    getWeeklyRoutineProgressForUser(user.id,weeklyRoutineIds,weeklyAliases)
  ]);
  if(!routineResult.error){
    for(const routine of (routineResult.data||[])){
      routineById.set(String(routine.id),routine);
      mm[String(routine.id)]={name:routine.name||'Rutina',description:routine.description||''};
    }
  }

  for(const a of rows){
    const trainerRoutineId=String(a.trainer_routine_id||'');
    const routine=routineById.get(trainerRoutineId)||null;
    const cached=mm[trainerRoutineId]||{};
    const name=routine?.name||cached.name||'Rutina asignada';
    const description=routine?.description||cached.description||'';
    const routineId=String(a.client_routine_id||a.trainer_routine_id);
    const weekly=weeklyAll.get(routineId)||weeklyAll.get(trainerRoutineId)||{total:0,done:0};

    h+=`<div class="card routine">
      <div>
        <h3>${esc(name)}</h3>
        <div class="muted">${esc(description)}</div>
        ${renderWeeklyRoutineProgress(weekly.total,weekly.done)}
      </div>
      <div class="buttons">
        <button class="btn primary" onclick="openSharedRoutine('${trainerRoutineId}')">Abrir</button>
        <button class="btn danger" onclick="removeSharedRoutine(${esc(JSON.stringify(a.id))},${esc(JSON.stringify(name))})">Eliminar</button>
      </div>
    </div>`;
  }
  try{localStorage.setItem(mk,JSON.stringify(mm))}catch(_){ }
  $('shared').innerHTML=h;
}
async function openSharedRoutine(id){
  let routineId=String(id);
  let assignment=null;

  try{
    assignment=(assignments||[]).find(a=>String(a.trainer_routine_id)===routineId && String(a.client_id||user.id)===String(user.id));
    if(assignment?.client_routine_id) routineId=String(assignment.client_routine_id);
  }catch(_){}

  let r=await db.from('routines')
    .select('id,name,description,share_code,source_routine_id,owner_id,created_at')
    .eq('id',routineId).maybeSingle();

  // If the assignment has a client copy but it is unavailable, fall back to
  // the trainer routine. This is the normal path for existing assignments.
  if((r.error||!r.data) && routineId!==String(id)){
    routineId=String(id);
    r=await db.from('routines')
      .select('id,name,description,share_code,source_routine_id,owner_id,created_at')
      .eq('id',routineId).maybeSingle();
  }

  if(r.error||!r.data)return toast('No se pudo abrir la rutina restaurada. La asignación sí se ha conservado.');
  const original=r.data;
  // Keep the trainer routine id available even when the client is using a
  // private client copy. Personal notes are stored against the trainer
  // routine so they survive weekly sessions and routine copies.
  workoutRoutine=Object.assign({},original,{
    trainer_routine_id: assignment?.trainer_routine_id ? String(assignment.trainer_routine_id) : String(id),
    source_routine_id: original?.source_routine_id ? String(original.source_routine_id) : null
  });
  try{
    const d=await days(routineId);
    $('trainTitle').textContent=original.name;
    $('trainSubtitle').textContent='Rutina compartida por tu entrenador.';
    $('trainBody').innerHTML=d.length?`
      <div class="card">
        <h3 style="margin-top:0">Días de entrenamiento</h3>
        ${d.map(x=>`<button class="btn" style="width:100%;margin:6px 0;text-align:left" onclick="startWorkoutDay('${x.id}')">
          <b>${esc(x.name)}</b><span class="muted" style="float:right">${x.exercises.length} ejercicios</span>
        </button>`).join('')}
      </div>`:'<div class="empty">Esta rutina todavía no tiene días.</div>';
    openM('trainModal');
  }catch(e){console.error('openSharedRoutine:',e);toast('La rutina existe, pero no se pudieron cargar sus sesiones.');}
}

(async()=>{

  // start a second app instance after the main bootstrap has completed.

      return;
    }

    if(s.data?.session){
      // Tras confirmar el correo, Supabase vuelve a esta URL con una sesión.
      // En ese momento creamos el perfil si todavía no existe y usamos el
      // rol guardado en user_metadata.
      const u=await db.auth.getUser();
      if(u.data?.user){
        user=u.data.user;
        try{
          profile=await finishConfirmedSignup();
          // `start()` marks the app as started only after a successful bootstrap.
          // Do not set the flag before it, otherwise a transient failure can
          // permanently suppress later startup retries.
          await start(null);
        }catch(e){
          console.error('Post-confirmation setup:',e);
          msg(e?.message || 'La cuenta está confirmada, pero no se pudo completar el perfil.');
        }
      }
    }
  }catch(e){
    console.error('Init error:',e);
    msg(e?.message || 'No se pudo conectar con Supabase.');
  }
})();

// Si llegamos a SIMPLE con parámetros de confirmación pero sin sesión,
// no mostramos una página en blanco: damos una instrucción clara.
if(/[?&](code|token_hash)=/.test(window.location.search) && !window.location.hash){
  setTimeout(()=>{
    if($('auth') && $('app').style.display==='none'){
      msg('La confirmación está procesándose. Si no entras automáticamente, vuelve a abrir SIMPLE e inicia sesión.');
    }
  },1200);
}

<script id="simple-nav-smart-hide-runtime-v43">
(function(){
  let lastY=window.scrollY||0;
  let touchStartY=null;
  let ticking=false;
  const THRESHOLD=6;
  const TOP=10;

  function tabs(){return document.getElementById('tabs')}

  function show(){
    const el=tabs();
    if(el)el.classList.remove('nav-hidden-on-scroll');
  }
  function hide(){
    const el=tabs();
    if(el)el.classList.add('nav-hidden-on-scroll');
  }

  function apply(y){
    const el=tabs();
    if(!el)return;
    const delta=y-lastY;
    if(y<=TOP){show();lastY=y;return;}
    if(Math.abs(delta)>=THRESHOLD){
      if(delta>0)hide();
      else show();
      lastY=y;
    }
  }

  /* Normal browser/window scrolling. */
  window.addEventListener('scroll',function(){
    if(ticking)return;
    ticking=true;
    requestAnimationFrame(function(){
      ticking=false;
      apply(window.scrollY||document.documentElement.scrollTop||0);
    });
  },{passive:true,capture:true});

  /*
   * Mobile Safari/Chrome can scroll an inner page container without giving
   * window.scrollY the useful delta. Detect the finger direction directly,
   * so the nav follows the user's gesture regardless of which element owns
   * the scroll.
   */
  document.addEventListener('touchstart',function(e){
    if(e.touches&&e.touches.length)touchStartY=e.touches[0].clientY;
  },{passive:true,capture:true});

  document.addEventListener('touchmove',function(e){
    if(touchStartY==null||!e.touches||!e.touches.length)return;
    const y=e.touches[0].clientY;
    const delta=touchStartY-y;
    if(Math.abs(delta)>=THRESHOLD){
      if(delta>0){
        /* Finger moving up = content scrolling down. */
        hide();
      }else{
        /* Finger moving down = content scrolling up. */
        show();
      }
      touchStartY=y;
    }
  },{passive:true,capture:true});

  document.addEventListener('touchend',function(){touchStartY=null},{passive:true,capture:true});
  document.addEventListener('touchcancel',function(){touchStartY=null},{passive:true,capture:true});

  window.showSimpleTopNav=function(){
    show();
    lastY=window.scrollY||document.documentElement.scrollTop||0;
  };

  document.addEventListener('click',function(e){
    if(e.target.closest('#tabs button')){
      requestAnimationFrame(function(){
        show();
        lastY=window.scrollY||document.documentElement.scrollTop||0;
      });
    }
  },true);
})();
</script>
