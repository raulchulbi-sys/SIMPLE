          <button class="btn danger" type="button" onclick="removeClientEditorExercise(${di},${ei})">Eliminar ejercicio</button>
        </div>
      </div>`;
  });

  h+=`<button class="btn" type="button" onclick="addClientEditorExercise(${di})">+ Añadir ejercicio</button>`;
  box.innerHTML=h;
}

function toggleClientExerciseReorder(di){
  const state=window.__clientRoutineEdit||{};
  state.exerciseReorder=!state.exerciseReorder;
  state.dayIndex=di;
  window.__clientRoutineEdit=state;
  if(!state.exerciseReorder)dragEndItem();
  renderClientRoutineDayEditor(di);
}

function addClientEditorExercise(di){
  editDays[di].exercises.push({
    id:null,name:'Nuevo ejercicio',sets:2,target:'2x10-15',
    rir:'2',rest_seconds:120,notes:''
  });
  renderClientRoutineDayEditor(di);
}

function removeClientEditorExercise(di,ei){
  if(!editDays[di]?.exercises[ei])return;
  if(!confirm(`¿Eliminar "${editDays[di].exercises[ei].name}"?`))return;
  editDays[di].exercises.splice(ei,1);
  renderClientRoutineDayEditor(di);
}

function backToClientRoutineSessions(){
  const state=window.__clientRoutineEdit||{};
  state.dayIndex=null; state.exerciseReorder=false; state.reorder=false;
  window.__clientRoutineEdit=state;
  dragEndItem();
  renderClientRoutineSessions();
}

async function saveClientRoutineEditor(){
  if(!window.__clientRoutineEdit?.routineId)return;
  // saveEditor() is the single persistence path, so both trainer-owned
  // routines and client-assigned routines use identical database semantics.
  await saveEditor(window.__clientRoutineEdit.routineId);
  window.__clientRoutineEdit.dayIndex=null;
  window.__clientRoutineEdit.reorder=false;
  window.__clientRoutineEdit.exerciseReorder=false;
}

async function openClientRoutineProgress(clientId,routineId,routineName){
  if(!user?.id)return toast('Debes iniciar sesión.');
  const title=$('clientProgressTitle'), subtitle=$('clientProgressSubtitle'), body=$('clientProgressBody');
  if(!title||!body)return;

  title.textContent=routineName||'Progreso';
  title.dataset.routineId=String(routineId);
  subtitle.textContent='Cargando historial del cliente...';
  body.innerHTML='<div class="muted">Cargando sesiones...</div>';
  closeM('clientModal');
  openM('clientProgressModal');

  try{
    const r=await db.rpc('get_client_routine_history',{
      p_client_id:String(clientId),
      p_routine_id:String(routineId)
    });
    if(r.error)throw r.error;

    // El RPC debe devolver solo la rutina solicitada, pero hacemos una segunda
    // comprobación en el cliente para impedir que una rutina pueda mostrar
    // sesiones de otra aunque el RPC devuelva más filas.
    const requestedRoutineId=String(routineId);
    // Si el usuario cambió rápidamente de rutina mientras cargaba la anterior,
    // no permitimos que la respuesta antigua pinte datos sobre la nueva.
    if(String(title.dataset.routineId)!==requestedRoutineId)return;

    const sessions=(r.data||[]).filter(session=>{
      const data=session?.data||{};
      const sessionRoutineId=data.routine_id ?? data.routineId ?? null;
      return sessionRoutineId!=null && String(sessionRoutineId)===requestedRoutineId;
    });

    // Exercise notes are stored separately from workout sessions so they persist
    // across devices. Trainers must read them through the authorized RPC.
    let clientRoutineNotes=[];
    try{
      const nq=await db.rpc('get_client_routine_notes',{
        p_client_id:String(clientId),
        p_routine_id:requestedRoutineId
      });
      if(!nq.error)clientRoutineNotes=nq.data||[];
    }catch(e){console.warn('No se pudieron cargar las notas del cliente:',e)}
    const notesByExercise=new Map();
    for(const n of clientRoutineNotes){
      const k=simpleNormalizeNoteKey(n.exercise_key);
      const v=String(n.note??'').trim();
      if(k&&v&&!notesByExercise.has(k))notesByExercise.set(k,v);
    }

    subtitle.textContent=`${sessions.length} sesión${sessions.length===1?'':'es'} registrada${sessions.length===1?'':'s'}`;
    let orderedRoutineDays=[];
    try{ orderedRoutineDays=await days(routineId); }
    catch(e){ console.warn('No se pudo cargar el orden de los días:',e); }

    if(!sessions.length){
      body.innerHTML='<div class="empty">El cliente todavía no tiene sesiones registradas de esta rutina.</div>';
      return;
    }

    body.innerHTML=`
      <div class="card" style="margin:0 0 12px">
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
          <div><div class="muted">Sesiones</div><b style="font-size:20px">${sessions.length}</b></div>
          <div><div class="muted">Última sesión</div><b>${simpleFormatDateKey(sessions[0].workout_date)}</b></div>
        </div>
      </div>

      <div class="card client-progress-chart">
        <div style="margin-bottom:10px">
          <b style="font-size:18px">Evolución del ejercicio</b>
          <div class="muted">Selecciona un ejercicio para ver cómo progresa a lo largo de las sesiones.</div>
        </div>
        <div class="progress-chart-controls"><div>
            <label for="clientProgressPeriod">Periodo</label>
            <select id="clientProgressPeriod" class="input">
              <option value="month" selected>Mes</option>
              <option value="quarter">Trimestre</option>
              <option value="year">Año</option>
              <option value="all">Todo</option>
            </select>
          </div>
          <div>
            <label for="clientProgressDay">Día / sesión</label>
            <select id="clientProgressDay" class="input"></select>
          </div>
          
          <div>
            <label for="clientProgressExercise">Ejercicio</label>
            <select id="clientProgressExercise" class="input"></select>
          </div>
          <div>
            <label for="clientProgressMetric">Métrica</label>
            <select id="clientProgressMetric" class="input">
              <option value="weight">Peso máximo</option>
              <option value="reps">Repeticiones máximas</option>
              <option value="1rm">1RM estimado</option>
            </select>
          </div>
        </div>
        <div id="clientProgressChart"></div>
        <div id="clientProgressPointDetail" class="progress-chart-stat progress-point-detail"></div>
        <div id="clientProgressChartSummary" class="progress-chart-summary"></div>
      </div>

      ${sessions.map((s,idx)=>{
        const d=s.data||{};
        const date=simpleDateFromKey(s.workout_date);
        const dateLabel=date?date.toLocaleDateString('es-ES'):'Fecha no disponible';
        const exercises=Array.isArray(d.exercises)?d.exercises:[];
        return `<details class="history-session card" ${idx===0?'open':''}>
          <summary class="history-summary">
            <div>
              <b class="history-title">${esc(d.day_name||s.day||'Entrenamiento')}</b>
              <div class="muted">${esc(dateLabel)}</div>
            </div>
            <span class="history-chevron">⌄</span>
          </summary>
          <div class="history-content">
            ${exercises.length?exercises.map(e=>{
              const sets=Array.isArray(e.sets)?e.sets:[];
              return `<div class="history-exercise">
                <div class="history-exercise-head">
                  <div>
                    <b>${esc(e.name||'Ejercicio')}</b>
                    <div class="history-objective">
                      Objetivo: ${esc(e.target||'—')} · ${e.planned_sets||sets.length||1} series
                    </div>
                  </div>
                </div>
                <div class="history-table">
                  <div class="history-row history-label">
                    <span>Serie</span><span>KG</span><span>REPS</span><span>RIR</span>
                  </div>
                  ${sets.map(set=>`
                    <div class="history-row">
                      <span>${esc(String(set.set??''))}</span>
                      <span>${esc(String(set.kg!==''&&set.kg!=null?set.kg:'—'))}</span>
                      <span>${esc(String(set.reps!==''&&set.reps!=null?set.reps:'—'))}</span>
                      <span>${esc(String(set.rir!==''&&set.rir!=null?set.rir:'—'))}</span>
                    </div>`).join('')}
                </div>
                ${(String(e.notes??'').trim() || notesByExercise.get(simpleNormalizeNoteKey(e.name)) || '')?`<div class="history-notes"><span>Notas:</span> ${esc(String(e.notes??'').trim() || notesByExercise.get(simpleNormalizeNoteKey(e.name)) || '')}</div>`:''}
              </div>`;
            }).join(''):'<div class="muted">Sin ejercicios registrados.</div>'}
          </div>
        </details>`;
      }).join('')}`;
    clientProgressChartState.orderedRoutineDays=orderedRoutineDays;
    setupClientProgressChart(sessions);
  }catch(e){
    console.error('openClientRoutineProgress:',e);
    const msg=String(e?.message||'');
    body.innerHTML=msg.includes('get_client_routine_history')
      ? '<div class="error">Falta configurar el acceso seguro al historial del cliente. Ejecuta primero el SQL de V48 en Supabase.</div>'
      : '<div class="error">No se pudo cargar el progreso del cliente.</div>';
  }
}

async function openClientProfile(clientId){
  if(!user?.id)return toast('Debes iniciar sesión.');
  const cid=String(clientId);

  // Always refresh this client's assignments directly from Supabase.
  const aq=await db.from('routine_assignments')
    .select('id,client_id,trainer_id,trainer_routine_id,client_routine_id,created_at,client_deleted_at')
    .eq('trainer_id',user.id)
    .eq('client_id',cid)
    .order('created_at',{ascending:false});

  if(aq.error){
    console.error('openClientProfile assignments:',aq.error);
    return toast('No se pudieron cargar las rutinas del cliente.');
  }

  const clientAssignments=aq.data||[];
  if(!clientAssignments.length)return toast('Este cliente ya no tiene rutinas asignadas.');

  const title=$('clientModalTitle'), subtitle=$('clientModalSubtitle'), body=$('clientModalBody');
  if(!title||!body)return;

  title.textContent='Cliente';
  subtitle.textContent='Cargando...';
  body.innerHTML='<div class="muted">Cargando información...</div>';
  openM('clientModal');
  setNestedView(true);

  try{
    // The profile name and assigned routines are independent reads. Fetch them
    // together so opening a client profile does not wait on avoidable serial
    // network round-trips. A failure in either auxiliary read remains non-fatal.
    const routineIds=[...new Set(clientAssignments.map(a=>a.trainer_routine_id).filter(Boolean).map(String))];
    const [nameResult,routineResult]=await Promise.all([
      (async()=>{
        let name='Cliente';
        try{
          const rpc=await db.rpc('get_public_profile_names',{p_user_ids:[cid]});
          const row=(rpc.data||[]).find(x=>String(x.id)===cid);
          if(row?.name)name=String(row.name).trim()||name;
        }catch(_){}
        if(name==='Cliente'){
          try{
            const pr=await db.from('profiles').select('id,name').eq('id',cid).maybeSingle();
            if(!pr.error && pr.data?.name)name=String(pr.data.name).trim()||name;
          }catch(_){}
        }
        return name;
      })(),
      routineIds.length
        ? db.from('routines')
            .select('id,name,description,share_code,source_routine_id,created_at,deleted_at')
            .in('id',routineIds)
        : Promise.resolve({data:[],error:null})
    ]);

    const name=nameResult||'Cliente';
    title.textContent=name;
    subtitle.textContent=`${clientAssignments.length} rutina${clientAssignments.length===1?'':'s'} asignada${clientAssignments.length===1?'':'s'}`;

    // Fetch the exact assigned trainer routines. Do not rely on the global
    // routine list, which may be filtered/ordered independently.
    const routineMap=new Map();
    if(!routineResult.error){
      for(const r of (routineResult.data||[]))routineMap.set(String(r.id),r);
    }else{
      console.warn('openClientProfile routines:',routineResult.error);
    }

    // Never discard an assignment merely because the routine-name query was
    // restricted by RLS. The assignment itself proves which routine was sent.
    const items=clientAssignments.map(a=>({
      assignment:a,
      routine:routineMap.get(String(a.trainer_routine_id)) || {
        id:a.trainer_routine_id,
        name:'Rutina asignada',
        description:''
      }
    }));
    const profileRoutineIds=[...new Set(items.map(x=>x.routine.id).filter(Boolean).map(String))];
    const profileAliases={};
    for(const x of items){
      if(x.assignment?.trainer_routine_id && x.assignment?.client_routine_id){
        profileAliases[String(x.assignment.trainer_routine_id)]=String(x.assignment.client_routine_id);
      }
    }
    const profileNames={};
    for(const x of items){
      if(x.routine?.id && x.routine?.name)profileNames[String(x.routine.id)]=x.routine.name;
    }
    const profileWeekly=await getWeeklyRoutineProgressForUser(cid,profileRoutineIds,profileAliases,profileNames);

    body.innerHTML=`
      <div class="card" style="margin:0 0 12px">
        <div class="muted">Rutinas asignadas</div>
      </div>
      ${items.map(x=>`
        <div class="card" style="margin:8px 0">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
            <div>
              <b>${esc(x.routine.name||'Rutina asignada')}</b>
              <div class="muted">Asignada ${new Date(x.assignment.created_at).toLocaleDateString('es-ES')}</div>
              ${renderWeeklyRoutineProgress(profileWeekly.get(String(x.routine.id))?.total||0,profileWeekly.get(String(x.routine.id))?.done||0)}
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
              <button class="btn" onclick="openClientRoutineProgress(${esc(JSON.stringify(cid))},${esc(JSON.stringify(x.routine.id))},${esc(JSON.stringify(x.routine.name||'Rutina'))})">Ver progreso</button>
              <button class="btn primary" onclick="editClientAssignedRoutine(${esc(JSON.stringify(cid))},${esc(JSON.stringify(x.routine.id))},${esc(JSON.stringify(x.routine.name||'Rutina'))})">Editar rutina</button>
              <button class="btn danger" onclick="revokeFromClientProfile('${x.assignment.id}')">Revocar</button>
            </div>
          </div>
        </div>`).join('')}`;
  }catch(e){
    console.error('openClientProfile:',e);
    body.innerHTML='<div class="error">No se pudo cargar el perfil del cliente.</div>';
  }
}

async function revokeFromClientProfile(assignmentId){
  await revokeClientRoutine(assignmentId);
  if(!window.__revokingAssignment){
    const a=(assignments||[]).find(x=>String(x.id)===String(assignmentId));
    if(!a) closeM('clientModal');
    else await openClientProfile(a.client_id);
  }
}

async function renderClients(){
  const box=$('clients');
  if(!box)return;
  box.innerHTML=`<div class="card"><h2 style="margin:0 0 4px">Mis clientes</h2><div class="muted">Cargando...</div></div>`;

  try{
    // IMPORTANT: do not depend on `routines` being loaded correctly.
    // The assignment table itself contains the trainer_id and client_id,
    // so this is the authoritative source for the trainer's client list.
    const q=await db.from('routine_assignments')
      .select('id,client_id,trainer_id,trainer_routine_id,client_routine_id,created_at,client_deleted_at')
      .eq('trainer_id',user.id)
      .order('created_at',{ascending:false});

    if(q.error)throw q.error;

    const activeAssignments=q.data||[];
    assignments=activeAssignments;

    const ids=[...new Set(
      activeAssignments.map(a=>a.client_id).filter(Boolean).map(String)
    )];

    if(!ids.length){
      box.innerHTML=`
        <div class="card">
          <h2 style="margin:0 0 4px">Mis clientes</h2>
          <div class="empty" style="margin-top:14px">Todavía no tienes clientes con rutinas asignadas.</div>
        </div>`;
      return;
    }

    // Get routine names independently from the global routines array.
    const routineIds=[...new Set(
      activeAssignments.map(a=>a.trainer_routine_id).filter(Boolean).map(String)
    )];

    const names=new Map();
    const [routineQuery,nameRpc]=await Promise.all([
      routineIds.length
        ? db.from('routines').select('id,name,description,deleted_at').in('id',routineIds)
        : Promise.resolve({data:[],error:null}),
      ids.length
        ? db.rpc('get_public_profile_names',{p_user_ids:ids})
        : Promise.resolve({data:[],error:null})
    ]);

    const routineMap=new Map();
    if(!routineQuery.error){
      for(const r of (routineQuery.data||[]))routineMap.set(String(r.id),r);
    }else{
      console.warn('No se pudieron leer nombres de rutinas:',routineQuery.error);
    }

    // Names: try public RPC first, then profiles. Neither failure hides clients.
    if(!nameRpc.error){
      for(const row of (nameRpc.data||[])){
        if(row?.id)names.set(String(row.id),row.name||'');
      }
    }else{
      console.warn('RPC nombres:',nameRpc.error);
    }

    const missing=ids.filter(id=>!String(names.get(id)||'').trim());
    if(missing.length){
      try{
        const prof=await db.from('profiles').select('id,name').in('id',missing);
        if(!prof.error){
          for(const row of (prof.data||[])){
            if(row?.id)names.set(String(row.id),row.name||'');
          }
        }
      }catch(err){
        console.warn('profiles:',err);
      }
    }

    const clientWeeklyByUser=new Map();
    const assignmentsByClient=new Map();
    for(const a of activeAssignments){
      const key=String(a.client_id||'');
      if(!assignmentsByClient.has(key))assignmentsByClient.set(key,[]);
      assignmentsByClient.get(key).push(a);
    }
    await Promise.all(ids.map(async cid=>{
      const clientAssignmentsForUser=assignmentsByClient.get(String(cid))||[];
      const clientRoutineIds=[...new Set(clientAssignmentsForUser.map(a=>a.trainer_routine_id).filter(Boolean).map(String))];
      const aliases={};
      for(const a of clientAssignmentsForUser){
        if(a.trainer_routine_id&&a.client_routine_id)
          aliases[String(a.trainer_routine_id)]=String(a.client_routine_id);
      }
      const namesForClient={};
      for(const a of clientAssignmentsForUser){
        if(a.trainer_routine_id){
          const rr=routineMap.get(String(a.trainer_routine_id));
          if(rr?.name)namesForClient[String(a.trainer_routine_id)]=rr.name;
        }
      }
      const weekly=await getWeeklyRoutineProgressForUser(cid,clientRoutineIds,aliases,namesForClient);
      clientWeeklyByUser.set(cid,weekly);
    }));

    const grouped=new Map();
    for(const a of activeAssignments){
      const cid=String(a.client_id);
      if(!grouped.has(cid))grouped.set(cid,[]);

      const routine=routineMap.get(String(a.trainer_routine_id)) ||
        (routines||[]).find(r=>String(r.id)===String(a.trainer_routine_id)) || {
          id:a.trainer_routine_id,
          name:'Rutina asignada',
          description:''
        };

      grouped.get(cid).push({assignment:a,routine});
    }

    box.innerHTML=`
      <div class="card">
        <h2 style="margin:0 0 4px">Mis clientes</h2>
        <div class="muted">${grouped.size} cliente${grouped.size===1?'':'s'} con rutinas asignadas.</div>
      </div>
      ${[...grouped.entries()].map(([cid,items])=>`
        <div class="card">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">

let __routinePointerDrag=null;

function routineDragCleanup(){
  const d=__routinePointerDrag;
  if(!d)return;
  d.placeholder?.remove();
  d.card?.classList.remove('routine-dragging');
  document.body.classList.remove('routine-pointer-dragging');
  if(d.handle&&d.pointerId!=null){try{d.handle.releasePointerCapture(d.pointerId)}catch(_){}}
  document.removeEventListener('pointermove',routinePointerMove);
  document.removeEventListener('pointerup',routinePointerUp);
  document.removeEventListener('pointercancel',routinePointerCancel);
  __routinePointerDrag=null;
}

function startRoutinePointerDrag(e,index){
  if(profile?.role!=='trainer'||__routinePointerDrag)return;
  // Use Pointer Events for mouse, touch and pen. This keeps desktop dragging
  // consistent with touch/pen dragging and avoids browser-specific HTML5 drag behaviour.
  e.preventDefault();e.stopPropagation();

  const handle=e.currentTarget;
  const card=handle.closest('.routine-sortable');
  if(!card)return;

  const placeholder=document.createElement('div');
  placeholder.className='routine-drag-placeholder';
  placeholder.style.height=Math.max(64,card.getBoundingClientRect().height)+'px';
  card.parentNode.insertBefore(placeholder,card);

  __routinePointerDrag={
    index:Number(index),
    handle,card,placeholder,pointerId:e.pointerId,
    startX:e.clientX,startY:e.clientY,active:false
  };

  try{handle.setPointerCapture(e.pointerId)}catch(_){}
  document.addEventListener('pointermove',routinePointerMove,{passive:false});
  document.addEventListener('pointerup',routinePointerUp,{passive:false});
  document.addEventListener('pointercancel',routinePointerCancel,{passive:false});
}

function routinePointerMove(e){
  const d=__routinePointerDrag;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();

  if(!d.active){
    if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)<7)return;
    d.active=true;
    d.card.classList.add('routine-dragging');
    document.body.classList.add('routine-pointer-dragging');
  }

  const cards=[...document.querySelectorAll('#mine .routine-sortable')].filter(x=>x!==d.card);
  let before=null;

  for(const card of cards){
    const r=card.getBoundingClientRect();
    if(e.clientY < r.top + r.height/2){
      before=card;
      break;
    }
  }

  if(before){
    before.parentNode.insertBefore(d.placeholder,before);
  }else{
    const last=cards[cards.length-1];
    if(last)last.parentNode.insertBefore(d.placeholder,last.nextSibling);
  }
}

async function routinePointerUp(e){
  const d=__routinePointerDrag;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();

  if(!d.active){
    routineDragCleanup();
    return;
  }

  // Read the actual visual DOM order at drop time. This is the key fix:
  // no original-index arithmetic, so repeated mobile moves remain reliable.
  const nodes=[...document.querySelectorAll('#mine .routine-sortable')];
  const ids=nodes.map(n=>String(n.dataset.routineId||'')).filter(Boolean);
  const draggedId=String(d.card.dataset.routineId||'');
  const remaining=ids.filter(id=>id!==draggedId);

  let insertion=remaining.length;
  const next=d.placeholder.nextElementSibling;
  if(next?.classList?.contains('routine-sortable')){
    insertion=remaining.indexOf(String(next.dataset.routineId));
    if(insertion<0)insertion=remaining.length;
  }

  const desired=remaining.slice();
  desired.splice(insertion,0,draggedId);

  const current=routines.map(r=>String(r.id));
  routineDragCleanup();

  if(desired.join('|')===current.join('|'))return;
  const byId=new Map(routines.map(r=>[String(r.id),r]));
  const reordered=desired.map(id=>byId.get(id)).filter(Boolean);
  if(reordered.length!==routines.length)return;

  const from=current.indexOf(draggedId);
  const to=desired.indexOf(draggedId);
  routines=reordered.map((r,i)=>({...r,routine_order:i}));
  renderMine();

  try{
    const ids=routines.map(r=>String(r.id));
    const saved=await db.rpc('reorder_my_routines_atomic',{p_routine_ids:ids});
    if(saved.error)throw saved.error;
    const verify=await db.from('routines').select('id,routine_order')
      .eq('owner_id',user.id).is('deleted_at',null).order('routine_order',{ascending:true});
    if(verify.error)throw verify.error;
    const actual=(verify.data||[]).map(r=>String(r.id));
    if(actual.join('|')!==ids.join('|'))throw new Error('El orden guardado no coincide con el orden mostrado.');
    toast('Orden guardado');
  }catch(err){
    console.error('reorderRoutine mobile:',err);
    routines=byId.size ? current.map(id=>byId.get(id)).filter(Boolean).map((r,i)=>({...r,routine_order:i})) : routines;
    renderMine();
    toast('No se pudo guardar el orden');
  }
}

async function days(id){

  const rows=d.data||[];

  const e=await db.from('routine_exercises')
    .select('id,day_id,name,sets,target,rir,rest_seconds,exercise_order,notes')
    .in('day_id',dayIds)
    .order('exercise_order');
  if(e.error)throw e.error;
  const byDay=new Map(dayIds.map(dayId=>[String(dayId),[]]));
  for(const exercise of (e.data||[])){
    const bucket=byDay.get(String(exercise.day_id));
    if(bucket)bucket.push(exercise);
  }
  for(const day of rows)day.exercises=byDay.get(String(day.id))||[];

function dragDayStart(e,i){
  e.stopPropagation();

  e.currentTarget.classList.add('dragging');
}
function clearDropIndicators(){
  document.querySelectorAll('.drag-over,.drop-active').forEach(x=>x.classList.remove('drag-over','drop-active'));
}
function dragOverDropZone(e){
  e.preventDefault(); e.stopPropagation();
  e.dataTransfer.dropEffect='move';

  e.currentTarget.classList.add('drop-active');
}
function dragOverExercise(e){

function dragOverDayZone(e){

function dropExerciseAt(e,targetDay,targetIndex){
  e.preventDefault(); e.stopPropagation();
  if(!__dragItem || __dragItem.type!=='exercise')return;

  const fromDay=__dragItem.di, fromIndex=__dragItem.ei;
  const source=editDays[fromDay]?.exercises;
  const target=editDays[targetDay]?.exercises;
  if(!source || !target)return;

  const [item]=source.splice(fromIndex,1);
  let at=targetIndex;
  if(fromDay===targetDay && fromIndex<at)at--;
  at=Math.max(0,Math.min(at,target.length));
  target.splice(at,0,item);

  editDays.forEach(d=>d.exercises.forEach((ex,i)=>ex.exercise_order=i));
  __dragItem=null;
  clearDropIndicators();
  if(window.__clientRoutineEdit?.dayIndex!=null){
    const affectedFrom=fromDay, affectedTo=targetDay;
    persistClientExerciseOrder(affectedFrom,affectedTo).catch(err=>{
      console.error('persistClientExerciseOrder:',err);
      toast('No se pudo guardar el orden de los ejercicios');
    });
    renderClientRoutineDayEditor(window.__clientRoutineEdit.dayIndex);
  }else if(window.__clientRoutineEdit) renderClientRoutineSessions();
  else renderEditor();
}
function dropExercise(e,targetDay,targetIndex){
  dropExerciseAt(e,targetDay,targetIndex);
}
function dropDayAt(e,targetIndex){
  if(!__dayDrag)return;
  e.preventDefault();e.stopPropagation();
  const from=Number(__dayDrag.index),to=Number(targetIndex);
  if(from===to||from+1===to){
    __dayDrag=null;
    if(window.__clientRoutineEdit?.reorder)renderClientRoutineSessions();
    else dragEndItem();
    return;
  }
  const next=editDays.slice();
  const [item]=next.splice(from,1);
  const at=from<to?to-1:to;
  next.splice(Math.max(0,Math.min(at,next.length)),0,item);
  editDays=next.map((d,i)=>({...d,day_order:i}));
  // Clear only the client-session drag state; preserve reorder mode.
  __dayDrag=null;
  document.querySelectorAll('#clientSessionList .routine-editor-day')
    .forEach(x=>x.classList.remove('dragging'));
  document.querySelectorAll('#clientSessionList .day-order-gap')
    .forEach(x=>x.classList.remove('active'));
  if(window.__clientRoutineEdit){
    renderClientRoutineSessions();
    persistClientSessionOrder();
  }else{
    dragEndItem();
    renderEditor();
  }
}
async function persistClientSessionOrder(){
  const state=window.__clientRoutineEdit;

  try{
    const ids=editDays.filter(d=>d.id).map(d=>String(d.id));

async function reorderRoutine(from,targetIndex){
  if(from<0 || from>=routines.length)return;

  const previous=routines.slice();
  const copy=routines.slice();
  const [item]=copy.splice(from,1);
  let at=targetIndex;
  if(from<at)at--;
  at=Math.max(0,Math.min(at,copy.length));

  if(at===from){renderMine();return;}

  copy.splice(at,0,item);
  routines=copy.map((r,i)=>({...r,routine_order:i}));
  renderMine();

  try{
    const ids=routines.map(r=>String(r.id));
    const saved=await db.rpc('reorder_my_routines_atomic',{p_routine_ids:ids});
    if(saved.error)throw saved.error;
    const verify=await db.from('routines').select('id,routine_order')
      .eq('owner_id',user.id).is('deleted_at',null).order('routine_order',{ascending:true});
    if(verify.error)throw verify.error;
    const actual=(verify.data||[]).map(r=>String(r.id));
    if(actual.join('|')!==ids.join('|'))throw new Error('El orden de rutinas no coincide con la base de datos.');
    toast('Orden guardado');
  }catch(err){
    console.error('reorderRoutine:',err);
    routines=previous;
    renderMine();
    toast('No se pudo guardar el orden');
  }
}

async function delRoutine(id){
  if(window.__routineDeleting)return;
  if(!user?.id)return toast('Debes iniciar sesión.');
  if(!confirm('¿Mover esta rutina a la papelera?'))return;
  window.__routineDeleting=true;
  try{
    const stamp=new Date().toISOString();

    // Client: only soft-delete this client's assignment. Never touch routines.
    if(profile?.role==='client'){
      const a0=(assignments||[]).find(x=>String(x.trainer_routine_id)===String(id) && String(x.client_id)===String(user.id));
      if(!a0?.id){
        throw new Error('No se encontró la asignación de esta rutina. No se ha borrado nada.');
      }

      // Resolve metadata before changing the assignment. If this read fails,
      // nothing is hidden, avoiding a half-completed client-side delete.
      const key='simple_client_trash_'+user.id;
      let cached=[];try{cached=JSON.parse(localStorage.getItem(key)||'[]')}catch(_){}
      if(!Array.isArray(cached))cached=[];
      let meta={};
      try{
        const mk='simple_shared_routine_meta_'+user.id;
        meta=JSON.parse(localStorage.getItem(mk)||'{}')?.[String(a0.trainer_routine_id)]||{};
      }catch(_){}
      const sourceRoutine=await db.from('routines')
        .select('id,name,description')
        .eq('id',a0.trainer_routine_id)
        .maybeSingle();
      if(sourceRoutine.error)throw sourceRoutine.error;

      const a=await db.from('routine_assignments')
        .update({client_deleted_at:stamp})
        .eq('id',a0.id)
        .eq('client_id',user.id)
        .is('client_deleted_at',null)
        .select('id,client_deleted_at')
        .maybeSingle();
      if(a.error)throw a.error;
      if(!a.data?.client_deleted_at)throw new Error('La rutina no quedó marcada como eliminada.');

      const trashRow={
        id:a0.id,
        trainer_routine_id:a0.trainer_routine_id,
        created_at:a0.created_at||stamp,
        client_deleted_at:stamp,
        routine_name:sourceRoutine.data?.name||meta.name||'Rutina',
        routine_description:sourceRoutine.data?.description||meta.description||''
      };
      localStorage.setItem(key,JSON.stringify([
        trashRow,
        ...cached.filter(x=>String(x.id)!==String(trashRow.id))
      ]));

      await reload();
      renderShared();
      await renderClientTrash();
      toast('Rutina movida a la papelera');
      return;
    }

    // Trainer-owned routine: soft-delete the routine itself.
    const r=await db.from('routines').update({deleted_at:stamp})
      .eq('id',id).eq('owner_id',user.id).is('deleted_at',null)
      .select('id,deleted_at').single();
    if(r.error)throw r.error;
    if(!r.data?.deleted_at)throw new Error('La rutina no quedó marcada como eliminada.');
    await reload();
    renderMine();
    await renderTrash();
    toast('Rutina movida a la papelera');
  }catch(e){
    console.error('delRoutine:',e);
    toast('No se pudo mover la rutina a la papelera: '+(e.message||'revisa los permisos'));
  }finally{
    window.__routineDeleting=false;
  }
}

let __openDayDrag=null;

function dragOpenDayStart(e,index){

function startOpenDayPointerDrag(e,index){
  if(profile?.role!=='trainer'||__openDayDragLock)return;
  e.preventDefault();
  e.stopPropagation();
  const h=e.currentTarget,row=h.closest('.open-day-row');
  if(!row)return;
  __openDayDragLock=true;
  __openDayDrag={
    index:Number(index),
    startX:e.clientX,startY:e.clientY,active:false,
    row,h,pointerId:e.pointerId,
    routineId:String(window.__openRoutineId||'')
  };
  try{h.setPointerCapture(e.pointerId)}catch(_){}
  document.addEventListener('pointermove',openDayPointerMove,{passive:false});
  document.addEventListener('pointerup',openDayPointerUp,{passive:false});
  document.addEventListener('pointercancel',openDayPointerCancel,{passive:false});
}
function openDayPointerMove(e){
  const d=__openDayDrag;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();

  if(!d.active){
    if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)<5)return;
    d.active=true;
    d.row.classList.add('dragging');
    document.body.classList.add('open-day-pointer-dragging');
  }

  const zones=[...document.querySelectorAll('#trainModal .open-day-order-zone')];
  zones.forEach(z=>z.classList.remove('open-day-order-zone-active'));

  const rows=[...document.querySelectorAll('#trainModal .open-day-row')];
  let target=rows.length;
  for(let i=0;i<rows.length;i++){
    if(rows[i]===d.row)continue;
    const r=rows[i].getBoundingClientRect();
    const mid=r.top+r.height/2;
    if(e.clientY<mid){target=i;break;}
  }

  const zone=zones[target];
  if(zone)zone.classList.add('open-day-order-zone-active');
}
function openDayPointerUp(e){
  const d=__openDayDrag;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();

  if(!d.active){
    finishOpenDayPointerDrag();
    return;
  }

  const rows=[...document.querySelectorAll('#trainModal .open-day-row')];
  const from=d.index;
  let to=rows.length;

  for(let i=0;i<rows.length;i++){
    if(rows[i]===d.row)continue;
    const r=rows[i].getBoundingClientRect();
    if(e.clientY<r.top+r.height/2){to=i;break;}
  }

  const rid=d.routineId;
  finishOpenDayPointerDrag();

  if(rid&&Number.isInteger(from)&&Number.isInteger(to)&&from!==to&&from+1!==to){
    reorderOpenDay(rid,from,to);
  }
}
function openDayPointerCancel(){finishOpenDayPointerDrag()}
function finishOpenDayPointerDrag(){
  document.querySelectorAll('#trainModal .open-day-row')
    .forEach(r=>r.classList.remove('dragging','open-day-drag-over'));
  document.querySelectorAll('#trainModal .open-day-order-zone')
    .forEach(z=>z.classList.remove('open-day-order-zone-active'));
  document.body.classList.remove('open-day-pointer-dragging');

  const d=__openDayDrag;
  if(d?.h&&d.pointerId!=null){
    try{d.h.releasePointerCapture(d.pointerId)}catch(_){}
  }
  document.removeEventListener('pointermove',openDayPointerMove);
  document.removeEventListener('pointerup',openDayPointerUp);
  document.removeEventListener('pointercancel',openDayPointerCancel);
  __openDayDrag=null;
  __openDayDragLock=false;
}
async function renameOpenDay(dayId){
  if(profile?.role!=='trainer'||!workoutRoutine?.id)return;
  try{
    const current=await db.from('routine_days').select('name')
      .eq('id',dayId).eq('routine_id',workoutRoutine.id).single();
    if(current.error)throw current.error;
    const next=prompt('Nombre de la sesión:',String(current.data?.name||''));
    if(next===null)return;
    const name=next.trim();
    if(!name)return toast('El nombre no puede estar vacío');
    if(name.length>80)return toast('El nombre es demasiado largo');
    const q=await db.from('routine_days').update({name})
      .eq('id',dayId).eq('routine_id',workoutRoutine.id);
    if(q.error)throw q.error;
    await openRoutine(workoutRoutine.id);
    toast('Sesión renombrada');
  }catch(e){console.error('renameOpenDay:',e);toast('No se pudo cambiar el nombre');}
}
async function reorderOpenDay(routineId,from,targetIndex){
  if(window.__openDayReordering)return;
  window.__openDayReordering=true;
  try{
    const current=await days(routineId);
    if(!Array.isArray(current)||from<0||from>=current.length)throw new Error('Índice inválido');
    const copy=current.slice(),[item]=copy.splice(from,1);
    let at=Math.max(0,Math.min(Number(targetIndex)||0,copy.length));
    if(from<at)at--;
    if(at===from)return;
    copy.splice(at,0,item);
    const saved=await db.rpc('reorder_my_routine_days_atomic',{p_routine_id:String(routineId),p_day_ids:copy.map(d=>String(d.id))});
    if(saved.error)throw saved.error;
    const verify=await days(routineId);
    if((verify||[]).map(x=>String(x.id)).join('|')!==copy.map(x=>String(x.id)).join('|'))
      throw new Error('Orden de sesiones no verificado');
    await openRoutine(routineId);
    toast('Orden de sesiones guardado');
  }catch(e){console.error('reorderOpenDay:',e);toast('No se pudo guardar el orden');}
  finally{window.__openDayReordering=false;}
}


let __editorPointerDrag=null;
let __editorDragRaf=0;
let __editorLastY=0;

function editorDragCleanup(){
  if(__editorDragRaf){cancelAnimationFrame(__editorDragRaf);__editorDragRaf=0;}
  const d=__editorPointerDrag;
  if(!d)return;
  d.placeholder?.remove();
  d.row?.classList.remove('dragging');
  document.body.classList.remove('editor-pointer-dragging');
  if(d.h&&d.pointerId!=null){try{d.h.releasePointerCapture(d.pointerId)}catch(_){}}
  document.removeEventListener('pointermove',editorPointerMove);
  document.removeEventListener('pointerup',editorPointerUp);
  document.removeEventListener('pointercancel',editorPointerCancel);
  __editorPointerDrag=null;
}

function editorMakePlaceholder(type,height){
  const p=document.createElement('div');
  p.className='editor-drag-placeholder';
  p.dataset.type=type;
  p.style.height=Math.max(46,height||46)+'px';
  return p;
}

function startEditorPointerDrag(e,type,di,ei){
  if(profile?.role!=='trainer'||__editorPointerDrag)return;
  // Use Pointer Events for mouse, touch and pen. This keeps desktop dragging
  // consistent with touch/pen dragging and avoids browser-specific HTML5 drag behaviour.
  e.preventDefault();e.stopPropagation();

  const h=e.currentTarget;
  const row=h.closest('.routine-editor-day,.routine-editor-exercise');
  if(!row)return;

  const p=document.createElement('div');
  p.className=type==='day'?'day-order-gap active':'exercise-drop-gap active';
  p.setAttribute('aria-hidden','true');
  row.parentNode.insertBefore(p,row);

  __editorPointerDrag={
    type,di:Number(di),ei:ei==null?null:Number(ei),
    h,row,placeholder:p,pointerId:e.pointerId,
    startX:e.clientX,startY:e.clientY,lastY:e.clientY,
    active:false,target:null
  };

  try{h.setPointerCapture(e.pointerId)}catch(_){}
  document.addEventListener('pointermove',editorPointerMove,{passive:false});
  document.addEventListener('pointerup',editorPointerUp,{passive:false});
  document.addEventListener('pointercancel',editorPointerCancel,{passive:false});
}

function updateEditorPointerTarget(d, y){
  if(!d)return;
  __editorLastY=y;

  if(d.type==='day'){
    const dayContainer = window.__clientRoutineEdit?.dayIndex==null
      ? document.querySelector('#clientSessionList')
      : document.querySelector('#daysEditor');
    const cards=[...(dayContainer?.querySelectorAll('.routine-editor-day')||[])].filter(x=>x!==d.row);
    let before=null,best=Infinity;
    for(const card of cards){
      const r=card.getBoundingClientRect();
      const dist=Math.abs(y-(r.top+r.height/2));
      if(dist<best){best=dist;before=card}
    }
    d.placeholder.className='day-order-gap active';
    if(before)before.parentNode.insertBefore(d.placeholder,before);
    else if(cards.length)cards[cards.length-1].parentNode.insertBefore(d.placeholder,cards[cards.length-1].nextSibling);
    d.target=before?Number(before.dataset.dayIndex):editDays.length;
  }else{
    const rows=[...document.querySelectorAll('#daysEditor .routine-editor-exercise')].filter(x=>x!==d.row);
    let target=null,best=Infinity;
    for(const row of rows){
      const r=row.getBoundingClientRect();
      if(y<r.top-12||y>r.bottom+12)continue;
      const dist=Math.abs(y-(r.top+r.height/2));
      if(dist<best){best=dist;target=row}
    }
    if(target){
      const r=target.getBoundingClientRect();
      const before=y<r.top+r.height/2;
      if(before)target.parentNode.insertBefore(d.placeholder,target);
      else target.parentNode.insertBefore(d.placeholder,target.nextSibling);
      d.target={day:Number(target.dataset.dayIndex),index:Number(target.dataset.exerciseIndex),before};
    }
  }
}

function editorPointerMove(e){
  const d=__editorPointerDrag;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();
  d.lastY=e.clientY;
  __editorLastY=e.clientY;

  if(!d.active){
    if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)<6)return;
    d.active=true;
    d.row.classList.add('dragging');
    document.body.classList.add('editor-pointer-dragging');
  }

  if(__editorDragRaf)return;
  __editorDragRaf=requestAnimationFrame(()=>{
    __editorDragRaf=0;
    const current=__editorPointerDrag;
    if(!current)return;
    updateEditorPointerTarget(current,current.lastY);
  });
}

function editorPointerUp(e){
  const d=__editorPointerDrag;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();

  if(__editorDragRaf){
    cancelAnimationFrame(__editorDragRaf);
    __editorDragRaf=0;
  }

  if(d.active){
    // IMPORTANT: calculate the final drop position synchronously.
    // The old code scheduled an RAF and immediately cancelled it, so the
    // last target could remain null on mobile.
    updateEditorPointerTarget(d,e.clientY);
  }

  const result={
    active:d.active,
    type:d.type,
    di:d.di,
    ei:d.ei,
    target:d.target
  };

  editorDragCleanup();

  if(!result.active)return;

  if(result.type==='day'){
    moveEditorDay(result.di,result.target==null?editDays.length:result.target);
  }else if(result.target){
    moveEditorExercise(
      result.di,result.ei,result.target.day,
      result.target.index+(result.target.before?0:1)
    );
  }
}

function editorPointerCancel(){editorDragCleanup()}

function moveEditorDay(from,to){
  if(from<0||from>=editDays.length)return;
  to=Math.max(0,Math.min(to,editDays.length));
  if(to===from||to===from+1)return;
  const [item]=editDays.splice(from,1);
  if(from<to)to--;
  editDays.splice(to,0,item);
  editDays.forEach((d,i)=>d.day_order=i);
  if(window.__clientRoutineEdit){
    renderClientRoutineSessions();
    persistClientSessionOrder();
  }else renderEditor();
}

function moveEditorExercise(fd,fi,td,ti){
  const source=editDays[fd]?.exercises;
  const target=editDays[td]?.exercises;
  if(!source||!target||fi<0||fi>=source.length)return;

  const [item]=source.splice(fi,1);
  let at=ti;
  if(fd===td&&fi<at)at--;
  at=Math.max(0,Math.min(at,target.length));
  target.splice(at,0,item);

  editDays.forEach(d=>d.exercises.forEach((x,i)=>x.exercise_order=i));

  if(window.__clientRoutineEdit?.routineId){
    persistClientExerciseOrder(fd,td).catch(err=>{
      console.error('persistClientExerciseOrder:',err);
      toast('No se pudo guardar el orden de los ejercicios');
    });
    renderClientRoutineDayEditor(window.__clientRoutineEdit.dayIndex);
  }else{
    renderEditor();
  }
}

async function persistClientExerciseOrder(fd,td){
  const state=window.__clientRoutineEdit;
  if(!state?.routineId||profile?.role!=='trainer')return false;
  const dayIndexes=[...new Set([Number(fd),Number(td)])];
  try{
    for(const di of dayIndexes){
      const d=editDays[di];
      if(!d?.id)continue;
      const ids=d.exercises.filter(e=>e.id).map(e=>String(e.id));
      if(!ids.length)continue;
      const saved=await db.rpc('reorder_my_routine_exercises_atomic',{p_day_id:String(d.id),p_exercise_ids:ids});
      if(saved.error)throw saved.error;
      const verify=await db.from('routine_exercises').select('id').eq('day_id',d.id).order('exercise_order',{ascending:true});
      if(verify.error)throw verify.error;
      const actual=(verify.data||[]).map(e=>String(e.id));
      if(actual.join('|')!==ids.join('|'))throw new Error('Orden de ejercicios no verificado');
    }
    toast('Orden de ejercicios guardado automáticamente');
    return true;
  }catch(err){
    console.error('persistClientExerciseOrder:',err);
    toast('No se pudo guardar el orden de los ejercicios');
    return false;
  }
}

let activeWorkout={day:null,exercises:[],sets:{}};

async function loadHistory(routineId=null){
  let query=db.from('workouts')
    .select('id,user_id,variant,day,workout_date,data')
    .eq('user_id',user.id)
    .order('workout_date',{ascending:false});

  // El historial siempre pertenece a la rutina que está abierta.
  // Esto evita mezclar sesiones de dos rutinas distintas del mismo cliente.
  if(routineId){
    query=query.eq('data->>routine_id',String(routineId));
  }

  const r=await query;
  if(r.error){
    // No ocultamos errores de red/RLS como si el historial estuviera vacío.
    // Los llamadores que necesiten tolerancia ya gestionan el fallo y pueden
    // continuar con la rutina sin historial.
    console.error('history:',r.error);
    throw r.error;
  }
  window.workoutHistory=r.data||[];
}
let selectedWorkoutIds = new Set();

function updateHistorySelectionUI(){
  document.querySelectorAll('.history-session').forEach(el=>{
    const id=el.dataset.workoutId;
    el.classList.toggle('history-selected', selectedWorkoutIds.has(String(id)));
    const cb=el.querySelector('.history-check');
    if(cb) cb.checked=selectedWorkoutIds.has(String(id));
  });
  const count=selectedWorkoutIds.size;
  const countEl=$('historySelectedCount');
  if(countEl) countEl.textContent=count?`${count} seleccionada${count===1?'':'s'}`:'Ninguna seleccionada';
  const del=$('deleteSelectedHistory');
  if(del) del.disabled=!count;
}

function toggleWorkoutSelection(id, checked){
  id=String(id);
  if(checked) selectedWorkoutIds.add(id);
  else selectedWorkoutIds.delete(id);
  updateHistorySelectionUI();
}

function toggleAllHistory(){
  const h=window.workoutHistory||[];
  if(!h.length) return;
  const allSelected=h.every(x=>selectedWorkoutIds.has(String(x.id)));
  if(allSelected) selectedWorkoutIds.clear();
  else h.forEach(x=>selectedWorkoutIds.add(String(x.id)));
  updateHistorySelectionUI();
}

function clearHistorySelection(){
  selectedWorkoutIds.clear();
  updateHistorySelectionUI();
}

async function deleteSelectedHistory(){
  const ids=[...selectedWorkoutIds];
  if(!ids.length) return toast('Selecciona al menos una sesión.');

  if(!confirm(`¿Eliminar ${ids.length} sesión${ids.length===1?'':'es'} del historial?`)) return;

  const del=$('deleteSelectedHistory');
  if(del){ del.disabled=true; del.textContent='Borrando...'; }

  try{
    // Las eliminaciones son independientes y el RPC ya limita cada fila a
    // su propietario. Ejecutarlas en paralelo reduce mucho el tiempo cuando
    // se seleccionan muchas sesiones, sin perder la protección del backend.
    const results=await Promise.all(ids.map(async id=>{
      try{
        const r=await db.rpc('delete_my_workout',{p_workout_id:id});
        if(r.error){
          console.error('delete_my_workout:',id,r.error);
          return {id,ok:false};
        }
        return {id,ok:true};
      }catch(e){
        console.error('delete_my_workout:',id,e);
        return {id,ok:false};
      }
    }));
    const failed=results.filter(x=>!x.ok).length;

    await loadHistory();

    const remaining=new Set((window.workoutHistory||[]).map(x=>String(x.id)));
    selectedWorkoutIds=new Set(ids.filter(id=>remaining.has(String(id))));
    showHistory();

    if(failed===0 && selectedWorkoutIds.size===0){
      toast(`${ids.length} sesión${ids.length===1?'':'es'} eliminada${ids.length===1?'':'s'}`);
    }else if(selectedWorkoutIds.size){
      toast('Algunas sesiones no se pudieron borrar.');
    }else{
      toast('Sesiones eliminadas');
    }
  }catch(e){
    console.error(e);
    toast('No se pudieron borrar las sesiones.');
  }finally{
    const b=$('deleteSelectedHistory');
    if(b){ b.textContent='Eliminar seleccionadas'; }
    updateHistorySelectionUI();
  }
}

async function saveEditedWorkout(id){
  if(window.__savingEditedWorkout)return;
  const session=(window.workoutHistory||[]).find(x=>String(x.id)===String(id));
  if(!session)return toast('Sesión no encontrada.');

  window.__savingEditedWorkout=true;
  try{
    const data=JSON.parse(JSON.stringify(session.data||{}));
    const exercises=Array.isArray(data.exercises)?data.exercises:[];

    document.querySelectorAll('.history-edit-input').forEach(input=>{
      const ei=Number(input.dataset.editEx);
      const si=Number(input.dataset.editSet);
      const field=input.dataset.editField;
      if(!exercises[ei]||!Array.isArray(exercises[ei].sets)||!exercises[ei].sets[si])return;
      exercises[ei].sets[si][field]=input.value;
    });

    document.querySelectorAll('.history-edit-note').forEach(input=>{
      const ei=Number(input.dataset.editEx);
      if(exercises[ei])exercises[ei].notes=String(input.value??'');
    });

    data.exercises=exercises;

    // Update only the current user's own workout row.
    const r=await db.from('workouts')
      .update({data})
      .eq('id',id)
      .eq('user_id',user.id)
      .select('id,user_id,variant,day,workout_date,data')
      .single();

    if(r.error)throw r.error;

    window.__editingWorkout=null;
    await loadHistory(workoutRoutine?.id);
    showHistory();
    const el=document.querySelector(`[data-workout-id="${CSS.escape(String(id))}"]`);
    if(el)el.open=true;
    toast('Cambios guardados correctamente');
  }catch(e){
    console.error('saveEditedWorkout:',e);
    toast('No se pudieron guardar los cambios: '+(e.message||'error'));
  }finally{
    window.__savingEditedWorkout=false;
  }
}

        </div>
      </details>`;
    }).join(''):'<div class="empty">Todavía no tienes sesiones guardadas.</div>'}`;

  updateHistorySelectionUI();
}

async function deleteWorkout(id){
  if(window.__deletingWorkout)return;
  const session=(window.workoutHistory||[]).find(x=>String(x.id)===String(id));
  if(!session)return toast('Sesión no encontrada.');

  const data=session.data||{};
  const name=data.routine_name||'esta sesión';
  const day=data.day_name||session.day||'';
  const date=session.workout_date?simpleFormatDateKey(session.workout_date):'';
  if(!confirm(`¿Eliminar ${name}${day?' · '+day:''}${date?' · '+date:''} del historial?`))return;

  window.__deletingWorkout=true;
  try{
    const r=await db.rpc('delete_my_workout',{p_workout_id:id});
    if(r.error)throw r.error;

    await loadHistory();
    if((window.workoutHistory||[]).some(x=>String(x.id)===String(id))){
      throw new Error('La sesión sigue en el historial después de borrarla.');
    }

    selectedWorkoutIds.delete(String(id));
    showHistory();
    toast('Sesión eliminada');
  }catch(e){
    console.error('deleteWorkout:',e);
    toast('No se pudo borrar la sesión: '+(e.message||'error'));
  }finally{
    window.__deletingWorkout=false;
  }
}


function getPreviousExerciseSession(exerciseId){
  const history=window.workoutHistory||[];
  const routineId=workoutRoutine?.id||null;
  const routineName=workoutRoutine?.name||'';

  const candidates=history.filter(s=>{
    const d=s.data||{};
    const sameRoutine=routineId
      ? String(d.routine_id||'')===String(routineId)
      : String(d.routine_name||'')===String(routineName);
    if(!sameRoutine)return false;
    return Array.isArray(d.exercises) &&
      d.exercises.some(e=>String(e.exercise_id||'')===String(exerciseId));
  }).sort((a,b)=>String(b.workout_date||b.data?.workout_date||'').localeCompare(String(a.workout_date||a.data?.workout_date||'')));

  const todayKey=simpleLocalDateKey();
  for(const session of candidates){
    const d=session.data||{};
    const sessionKey=String(session.workout_date||d.workout_date||'');
    // If this is today's current workout record for the same routine/day,
    // skip it. Comparing calendar keys avoids UTC/local-time boundary bugs.
    if(workoutRoutine?.id && String(d.routine_id||'')===String(workoutRoutine.id) &&
       activeWorkout?.day?.id && String(d.routine_day_id||'')===String(activeWorkout.day.id) &&
       sessionKey===todayKey){
      continue;
    }
    const exercise=(d.exercises||[]).find(e=>String(e.exercise_id||'')===String(exerciseId));
    if(exercise)return {exercise,date:simpleDateFromKey(sessionKey)};
  }
  return null;
}

function renderPreviousSession(exerciseId){
  const prev=getPreviousExerciseSession(exerciseId);
  if(!prev)return `<div class="previous-session">
    <div class="previous-session-head"><span class="previous-session-title">Última sesión</span></div>
    <div class="previous-empty">Todavía no hay un registro anterior de este ejercicio.</div>
  </div>`;

  const sets=Array.isArray(prev.exercise.sets)?prev.exercise.sets:[];
  const date=prev.date instanceof Date&&!isNaN(prev.date)?prev.date.toLocaleDateString('es-ES'):'';
  return `<div class="previous-session">
    <div class="previous-session-head">
      <span class="previous-session-title">Última sesión</span>
      <span class="previous-session-date">${esc(date)}</span>

      }).join(''):'<span class="previous-empty">Sin series registradas.</span>'}
    </div>
  </div>`;
}


function simpleNormalizeNoteKey(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');}
function workoutNotesKey(){
  return user?.id && workoutRoutine?.id && activeWorkout?.day?.id
    ? `simple_routine_notes_v3:${user.id}:${workoutRoutine.id}:${activeWorkout.day.id}`
    : null;
}

async function startWorkoutDay(dayId){
  try{
    // El día y sus ejercicios son lecturas independientes: cargarlos en
    // paralelo reduce el tiempo de apertura del entrenamiento sin cambiar
    // permisos ni la fuente de verdad.
    const [d,x]=await Promise.all([
      db.from('routine_days')
        .select('id,name,day_order')
        .eq('id',dayId)
        .single(),
      db.from('routine_exercises')
        .select('id,name,sets,target,rir,rest_seconds,exercise_order,notes')
        .eq('day_id',dayId)
        .order('exercise_order')
    ]);
    if(d.error)throw d.error;
    if(x.error)throw x.error;

    activeWorkout={
      day:d.data,
      exercises:x.data||[],
      sets:{},
      locked:false,
      lockedSession:null,
      editing:false,
      reordering:false
    };

    // Notas personales persistentes. Nunca dejamos que una fila vacía pise una nota real.
    const notesKey=workoutNotesKey();
    let localNotes={};
    try{localNotes=JSON.parse(localStorage.getItem(notesKey)||'{}')||{};}catch(_){}
    let persistentNotes=[];
    try{
      const routineIds=[...new Set([workoutRoutine?.id,workoutRoutine?.source_routine_id,workoutRoutine?.trainer_routine_id].filter(Boolean).map(String))];
      const q=await db.from('routine_user_notes')
        .select('routine_id,exercise_key,note,updated_at')
        .eq('user_id',String(user.id));
      if(q.error)throw q.error;
      // No filtramos la consulta por workoutRoutine.id: al abrir una rutina
      // compartida ese objeto puede terminar de hidratarse después de abrir
      // el día. Traemos todas las notas del usuario y luego priorizamos la
      // familia de la rutina actual. Así PC y móvil leen la misma fuente.
      persistentNotes=(q.data||[]).filter(r=>String(r.note??'').trim());
    }catch(e){console.warn('No se pudieron cargar las notas persistentes:',e)}
    const familyIds=new Set([String(workoutRoutine?.id||''),String(workoutRoutine?.source_routine_id||''),String(workoutRoutine?.trainer_routine_id||'')].filter(Boolean));
    persistentNotes.sort((a,b)=>{
      const pa=familyIds.has(String(a.routine_id))?1:0,pb=familyIds.has(String(b.routine_id))?1:0;
      return pa!==pb?pb-pa:String(b.updated_at||'').localeCompare(String(a.updated_at||''));
    });
    const persistentByKey=new Map();
    for(const row of persistentNotes){
      const k=simpleNormalizeNoteKey(row.exercise_key);
      if(k&&!persistentByKey.has(k))persistentByKey.set(k,String(row.note));
    }
    for(const e of activeWorkout.exercises){
      const base=Array.from({length:e.sets||1},()=>({kg:'',reps:'',rir:'',done:false}));
      const nk=simpleNormalizeNoteKey(e.name);
      const persistentNote=persistentByKey.get(nk)||'';
      const localNote=localNotes[e.id]!==undefined?String(localNotes[e.id]??''):'';
      const localByName=Object.keys(localNotes).find(k=>simpleNormalizeNoteKey(k)===nk);
      const localNameNote=localByName!==undefined?String(localNotes[localByName]??''):'';
      const legacyNote=String(e.notes??'');
      base.note=persistentNote.trim()?persistentNote:(legacyNote.trim()?legacyNote:(localNote.trim()?localNote:localNameNote));
      activeWorkout.sets[e.id]=base;
    }

    // El historial es auxiliar: si falla, la rutina sigue pudiendo abrirse.
    try{
      await loadHistory(workoutRoutine?.id);
    }catch(e){
      console.warn('Historial no disponible:',e);
      window.workoutHistory=[];
    }

    // Recuperación de respaldo de TODAS las notas antiguas del usuario:
    // rutina actual, copia del cliente, rutina del entrenador y sesiones históricas.
    try{
      const history=Array.isArray(window.workoutHistory)?window.workoutHistory:[];
      const currentRoutineIds=new Set([
        String(workoutRoutine?.id||''),
        String(workoutRoutine?.trainer_routine_id||''),
        String(workoutRoutine?.source_routine_id||'')
      ].filter(Boolean));

      const historicalNotes=new Map();
      const orderedHistory=history
        .filter(s=>{
          const d=s?.data||{};
          const rid=String(d.routine_id||d.routineId||'');
          const srid=String(d.source_routine_id||'');
          return currentRoutineIds.has(rid)||currentRoutineIds.has(srid);
        })
        .sort((a,b)=>String(b.workout_date||'').localeCompare(String(a.workout_date||'')));

      for(const session of orderedHistory){
        for(const old of (Array.isArray(session.data?.exercises)?session.data.exercises:[])){
          const k=simpleNormalizeNoteKey(old?.name);
          const n=String(old?.notes??'').trim();
          if(k&&n&&!historicalNotes.has(k))historicalNotes.set(k,n);
        }
      }

      for(const e of activeWorkout.exercises){
        const current=String(activeWorkout.sets[e.id]?.note??'');
        if(current.trim())continue;
        const oldNote=historicalNotes.get(simpleNormalizeNoteKey(e.name));
        if(oldNote){
          activeWorkout.sets[e.id].note=oldNote;
          e.notes=oldNote;
        }
      }
    }catch(noteRecoveryErr){
      console.warn('No se pudieron recuperar notas antiguas:',noteRecoveryErr);
    }

    const today=simpleLocalDateKey();
    const todaySession=(window.workoutHistory||[]).find(session=>{
      const data=session.data||{};
      return String(data.routine_id||'')===String(workoutRoutine.id) &&
        String(data.routine_day_id||'')===String(dayId) &&
        String(session.workout_date||'')===today;
    });

    // Si existe sesión hoy, cargarla y bloquearla.
    if(todaySession){
      activeWorkout.locked=true;
      activeWorkout.lockedSession=todaySession;

      const savedExercises=Array.isArray(todaySession.data?.exercises)
        ? todaySession.data.exercises : [];

      for(const e of activeWorkout.exercises){
        const saved=savedExercises.find(se=>String(se.exercise_id||'')===String(e.id))
          || savedExercises.find(se=>
            String(se.name||'').trim().toLowerCase()===String(e.name||'').trim().toLowerCase()
          );
        if(!saved)continue;

        const base=Array.from({length:e.sets||1},(_,i)=>({
          kg:'',reps:'',rir:'',done:false,
          ...(saved.sets?.[i]||{})
        }));
        base.note=String(saved.notes ?? activeWorkout.sets[e.id]?.note ?? '');
        activeWorkout.sets[e.id]=base;
      }
    }

    // Solo recuperar borrador si todavía no está guardada la sesión.
    const recovered=!activeWorkout.locked && loadWorkoutDraft();

    $('trainTitle').textContent=d.data.name;
    $('trainSubtitle').textContent=activeWorkout.locked
      ? 'Sesión ya guardada hoy. Puedes consultarla, pero no volver a modificarla.'
      : recovered
        ? 'Sesión recuperada automáticamente. Tus datos se guardan mientras entrenas.'
        : 'Completa tus series y guarda tus datos.';

    renderWorkoutDay();

    if(activeWorkout.locked)toast('Esta sesión ya está guardada hoy');
    else if(recovered)toast('Sesión recuperada');
  }catch(e){
    console.error('startWorkoutDay:',e);
    toast('No se pudo cargar el entrenamiento');
  }
}

function workoutDraftKey(){
  return user?.id && workoutRoutine?.id && activeWorkout?.day?.id
    ? `simple_workout_draft_v2:${user.id}:${workoutRoutine.id}:${activeWorkout.day.id}`
    : null;
}

// Marca cuándo se completó por última vez este día de rutina.
// Sirve para impedir que un borrador viejo vuelva a rellenar KG/REPS/RIR
// cuando empieza el siguiente ciclo de entrenamiento.
function workoutCompletionKey(){
  return user?.id && workoutRoutine?.id && activeWorkout?.day?.id
    ? `simple_workout_completed_v1:${user.id}:${workoutRoutine.id}:${activeWorkout.day.id}`
    : null;
}
function markWorkoutCompleted(){
  const key=workoutCompletionKey();
  if(!key)return;
  try{
    localStorage.setItem(key,String(Date.now()));
  }catch(_){ }
}

function saveWorkoutDraft(){
  const key=workoutDraftKey();
  if(!key)return;
  try{
    localStorage.setItem(key,JSON.stringify({
      savedAt:Date.now(),
      routineId:workoutRoutine.id,
      dayId:activeWorkout.day.id,
      sets:Object.fromEntries(
        Object.entries(activeWorkout.sets||{}).map(([id,arr])=>[
          id,
          {
            rows:Array.isArray(arr)?arr.map(x=>({...x})):[],
            note:String(arr?.note??'')
          }
        ])
      )
    }));
  }catch(e){console.warn('No se pudo guardar el borrador:',e);}
}
function loadWorkoutDraft(){
  const key=workoutDraftKey();
  if(!key)return false;
  try{
    const raw=localStorage.getItem(key);
    if(!raw)return false;
    const draft=JSON.parse(raw);
    if(!draft?.sets)return false;

    // Un borrador solo puede recuperar una sesión que siga pendiente.
    // Si ya se completó ese día después de crear el borrador, se descarta.
    const completedKey=workoutCompletionKey();
    const completedAt=completedKey ? Number(localStorage.getItem(completedKey)||0) : 0;
    const draftSavedAt=Number(draft.savedAt||0);
    if(completedAt && (!draftSavedAt || draftSavedAt <= completedAt)){
      localStorage.removeItem(key);
      return false;
    }
    for(const e of activeWorkout.exercises){
      const base=Array.from({length:e.sets||1},()=>({kg:'',reps:'',rir:'',done:false}));
      const rawSaved=draft.sets?.[e.id];
      const savedRows=Array.isArray(rawSaved)
        ? rawSaved
        : (Array.isArray(rawSaved?.rows)?rawSaved.rows:null);
      activeWorkout.sets[e.id]=savedRows
        ? base.map((s,i)=>({...s,...(savedRows[i]||{})}))
        : base;

      const savedNote=Array.isArray(rawSaved)
        ? (Object.prototype.hasOwnProperty.call(rawSaved,'note') ? rawSaved.note : undefined)
        : rawSaved?.note;

      if(savedNote!==undefined){
        activeWorkout.sets[e.id].note=String(savedNote??'');
      }else{
        const noteKey=workoutNotesKey();
        try{
          const notes=noteKey ? JSON.parse(localStorage.getItem(noteKey)||'{}')||{} : {};
          if(Object.prototype.hasOwnProperty.call(notes,e.id)){
            activeWorkout.sets[e.id].note=String(notes[e.id]??'');
          }
        }catch(_){}
      }
    }
    return true;
  }catch(e){console.warn('No se pudo recuperar el borrador:',e);return false;}
}
function clearWorkoutDraft(){
  // KG, REPS y RIR pertenecen a la sesión actual.
  // El borrador solo existe mientras una sesión está sin guardar.
  const key=workoutDraftKey();
  if(key)try{localStorage.removeItem(key);}catch(_){}
}

function formatStipulatedRest(e){
  const preset=routinePresetForExercise(e?.name);
  if(preset?.restLabel)return preset.restLabel;
  const sec=Number(e?.rest_seconds)||0;
  if(!sec)return '-';
  const min=Math.floor(sec/60), rem=sec%60;
  return rem?`${min}:${String(rem).padStart(2,'0')}`:`${min}'`;
}

          <input type="number" min="0" step="0.5" inputmode="decimal" value="${Number(e.rest_seconds||0)/60}" onchange="editWorkoutExerciseField('${key}','rest_seconds',this.value)">
        </div>
        <button class="btn" type="button" onclick="addWorkoutSet('${key}')">+ Añadir serie</button>
      </div>`:''}
      <div style="margin-top:12px"><label>Notas del ejercicio</label>
        <textarea placeholder="Escribe aquí..."${dis} oninput="updateExerciseNote('${key}',this.value)">${esc(state.note||'')}</textarea></div>
      ${locked?'<div class="muted" style="margin-top:12px">Sesión guardada hoy · solo lectura</div>':`
        <div class="rest-buttons"><span class="muted">Descanso</span>${[1,2,3,4,5].map(m=>`<button class="btn" onclick="startRestTimer(${m*60})">${m}'</button>`).join('')}</div>`}
    </div>`;
  }).join('');

  const reorder=reordering?`
    <div class="workout-reorder-list">
      <div class="workout-reorder-zone" ondragover="workoutReorderOver(event)" ondrop="workoutReorderDrop(event,0)"></div>
      ${exs.map((e,i)=>`<div class="card workout-reorder-bar">
        <span class="workout-reorder-handle"
          onpointerdown="workoutReorderStart(event,${i})">☷</span>
        <b>${esc(e.name)}</b><span class="muted">${e.sets||1} series</span>
      </div>
      <div class="workout-reorder-zone" ondragover="workoutReorderOver(event)" ondrop="workoutReorderDrop(event,${i+1})"></div>`).join('')}
    </div>`:normal;

  $('trainBody').innerHTML=`${sessionBack}${controls}${reorder}<div id="restBox" class="rest-floating" style="display:none"></div>
    ${locked||activeWorkout.reordering?'':`<div class="buttons" style="justify-content:flex-end"><button class="btn primary" onclick="saveWorkoutSession()">Guardar sesión</button></div>`}`;
  // Guard: cada ejercicio debe mostrar un único campo de descanso en el editor.
  if(editing){
    document.querySelectorAll('#trainBody .card').forEach(card=>{
      const restFields=card.querySelectorAll('.workout-edit-field.workout-rest-field');
      restFields.forEach((field,index)=>{if(index>0)field.remove();});
    });
  }
  if(reordering){
    workoutReorderRows=[...document.querySelectorAll('#trainModal .workout-reorder-bar')];
    workoutReorderZones=[...document.querySelectorAll('#trainModal .workout-reorder-zone')];
  }else{
    workoutReorderRows=[];workoutReorderZones=[];
  }

}

async function saveWorkoutRoutineEdits(){
  if(profile?.role!=='trainer'||!activeWorkout?.day?.id||window.__savingRoutineEdits)return;
  window.__savingRoutineEdits=true;
  try{
    // Save the whole exercise list atomically. This prevents a connection
    // failure halfway through the edit from leaving the routine partially
    // updated. Existing IDs are preserved; new temporary IDs are mapped to
    // the UUIDs returned by the database so their in-progress sets survive.
    const exercisesPayload=(activeWorkout.exercises||[]).map((e,i)=>({
      id:String(e.id).startsWith('new-')?null:e.id,
      client_id:String(e.id).startsWith('new-')?String(e.id):null,
      name:String(e.name||'').trim(),
      sets:Math.max(1,Number(e.sets)||1),
      target:e.target||'',
      rir:e.rir===''||e.rir==null?null:Number(e.rir),
      rest_seconds:Math.max(0,Number(e.rest_seconds)||0),
      notes:e.notes||null,
      exercise_order:i
    }));
    if(exercisesPayload.some(e=>!e.name))throw new Error('exercise_name_required');

    const q=await db.rpc('save_workout_day_exercises_atomic',{
      p_day_id:activeWorkout.day.id,
      p_exercises:exercisesPayload
    });
    if(q.error)throw q.error;

    const saved=Array.isArray(q.data)?q.data:[];
    const idMap=new Map();
    for(const row of saved){
      if(row?.old_id)idMap.set(String(row.old_id),String(row.id));
    }
    for(const e of activeWorkout.exercises||[]){
      const oldId=String(e.id);
      const newId=idMap.get(oldId);
      if(!newId||newId===oldId)continue;
      const pendingSets=activeWorkout.sets[oldId]||[];
      e.id=newId;
      delete activeWorkout.sets[oldId];
      activeWorkout.sets[newId]=pendingSets;
    }

    activeWorkout.editing=false;
    toast('Cambios guardados');
    await startWorkoutDay(activeWorkout.day.id);
  }catch(e){
    console.error('saveWorkoutRoutineEdits:',e);
    toast('No se pudieron guardar los cambios');
  }finally{window.__savingRoutineEdits=false;}
}

let workoutReorderRows=[];
let workoutReorderZones=[];
let __workoutReorderDrag=null;
function workoutReorderStart(e,index){
  if(!activeWorkout?.reordering)return;
  e.preventDefault();e.stopPropagation();
  const handle=e.currentTarget;
  const row=handle.closest('.workout-reorder-bar');
  if(!row)return;
  __workoutReorderDrag={
    index:Number(index),handle,row,startX:e.clientX,startY:e.clientY,
    active:false,pointerId:e.pointerId,zone:null,raf:0
  };
  try{handle.setPointerCapture(e.pointerId)}catch(_){}
  document.addEventListener('pointermove',workoutReorderPointerMove,{passive:false});
  document.addEventListener('pointerup',workoutReorderPointerUp,{passive:false});
  document.addEventListener('pointercancel',workoutReorderPointerCancel,{passive:false});
}
function workoutReorderEnd(){
  const d=__workoutReorderDrag;
  if(d?.raf)cancelAnimationFrame(d.raf);
  document.querySelectorAll('.workout-reorder-bar').forEach(x=>x.classList.remove('dragging'));
  document.querySelectorAll('.workout-reorder-zone').forEach(x=>x.classList.remove('active'));
  document.removeEventListener('pointermove',workoutReorderPointerMove);
  document.removeEventListener('pointerup',workoutReorderPointerUp);
  document.removeEventListener('pointercancel',workoutReorderPointerCancel);
  if(d?.handle&&d.pointerId!=null){try{d.handle.releasePointerCapture(d.pointerId)}catch(_){}}
  __workoutReorderDrag=null;
}
function workoutReorderPointerMove(e){
  const d=__workoutReorderDrag;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();
  if(!d.active){
    if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)<5)return;
    d.active=true;d.row.classList.add('dragging');
  }
  if(d.raf)return;
  d.lastY=e.clientY;
  d.raf=requestAnimationFrame(()=>{
    d.raf=0;
    const zones=workoutReorderZones||[];
    let target=zones.length-1;
    const rows=workoutReorderRows||[];
    for(let i=0;i<rows.length;i++){
      if(i===d.index)continue;
      const r=rows[i].getBoundingClientRect();
      if(d.lastY<r.top+r.height/2){target=i;break;}
    }
    const z=zones[target];
    if(z!==d.zone){
      if(d.zone)d.zone.classList.remove('active');
      d.zone=z||null;
      if(d.zone)d.zone.classList.add('active');
    }
  });
}
async function workoutReorderPointerUp(e){
  const d=__workoutReorderDrag;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();
  if(!d.active){workoutReorderEnd();return;}
  const rows=workoutReorderRows||[];
  let target=rows.length;
  for(let i=0;i<rows.length;i++){
    if(i===d.index)continue;
    const r=rows[i].getBoundingClientRect();
    if(e.clientY<r.top+r.height/2){target=i;break;}
  }
  const from=d.index;
  workoutReorderEnd();
  if(from!==target&&from+1!==target)await workoutReorderCommit(from,target);
}
function workoutReorderPointerCancel(){workoutReorderEnd();}
async function workoutReorderCommit(from,to){
  if(window.__workoutExerciseReordering)return;
  window.__workoutExerciseReordering=true;
  try{
    const next=activeWorkout.exercises.slice();
    const [item]=next.splice(from,1);
    const at=Math.max(0,Math.min(from<to?to-1:to,next.length));
    next.splice(at,0,item);
    const saved=await db.rpc('reorder_my_routine_exercises_atomic',{p_day_id:String(activeWorkout.day.id),p_exercise_ids:next.map(x=>String(x.id))});
    if(saved.error)throw saved.error;
    const verify=await db.from('routine_exercises').select('id').eq('day_id',activeWorkout.day.id).order('exercise_order',{ascending:true});
    if(verify.error)throw verify.error;
    const ids=(verify.data||[]).map(x=>String(x.id));
    if(ids.join('|')!==next.map(x=>String(x.id)).join('|'))throw new Error('Orden de ejercicios no verificado');
    activeWorkout.exercises=next;
    // Stay in reorder mode so consecutive exercises can be moved without
    // pressing "Reordenar" again.
    activeWorkout.reordering=true;
    renderWorkoutDay();
    toast('Guardado automáticamente');
  }catch(err){console.error('exercise reorder:',err);toast('No se pudo guardar el orden');}
  finally{window.__workoutExerciseReordering=false;}
}
function workoutReorderOver(e){
  if(!__workoutReorderDrag)return;e.preventDefault();e.stopPropagation();
  document.querySelectorAll('.workout-reorder-zone').forEach(x=>x.classList.remove('active'));
  e.currentTarget.classList.add('active');
}
async function workoutReorderDrop(e,target){
  if(!__workoutReorderDrag)return;
  e.preventDefault();e.stopPropagation();
  const from=Number(__workoutReorderDrag.index),to=Number(target);
  workoutReorderEnd();
  if(!Number.isInteger(from)||!Number.isInteger(to)||from===to||from+1===to)return;
  if(window.__workoutExerciseReordering)return;
  window.__workoutExerciseReordering=true;
  try{
    const next=activeWorkout.exercises.slice();
    if(from<0||from>=next.length)throw new Error('Índice inválido');
    const [item]=next.splice(from,1);
    const at=Math.max(0,Math.min(from<to?to-1:to,next.length));
    next.splice(at,0,item);
    const saved=await db.rpc('reorder_my_routine_exercises_atomic',{p_day_id:String(activeWorkout.day.id),p_exercise_ids:next.map(x=>String(x.id))});
    if(saved.error)throw saved.error;
    const verify=await db.from('routine_exercises').select('id')
      .eq('day_id',activeWorkout.day.id).order('exercise_order',{ascending:true});
    if(verify.error)throw verify.error;
    const dbIds=(verify.data||[]).map(x=>String(x.id));
    if(dbIds.join('|')!==next.map(x=>String(x.id)).join('|'))
      throw new Error('Orden de ejercicios no verificado');
    activeWorkout.exercises=next;
    activeWorkout.reordering=true;
    renderWorkoutDay();
    toast('Orden de ejercicios guardado');
  }catch(err){console.error('exercise reorder:',err);toast('No se pudo guardar el orden');}
  finally{window.__workoutExerciseReordering=false;}
}

      if(bad?.error)throw bad.error;

function simpleLocalDateKey(date=new Date()){
  const d=date instanceof Date?date:new Date(date);
  if(Number.isNaN(d.getTime()))return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// SQL DATE values (YYYY-MM-DD) are calendar dates, not UTC instants.
// Parsing them with new Date('YYYY-MM-DD') shifts them to the previous
// calendar day in timezones west of UTC (including mainland Spain).
function simpleDateFromKey(value){
  const m=String(value??'').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m)return null;
  const year=Number(m[1]),month=Number(m[2]),day=Number(m[3]);
  if(month<1||month>12||day<1||day>31)return null;
  const d=new Date(year,month-1,day);
  // JS normalizes invalid calendar dates (e.g. 2026-02-31) instead of failing.
  // Reject those values so a malformed DB/local value can never appear as a
  // different valid date in the UI.
  if(d.getFullYear()!==year||d.getMonth()!==month-1||d.getDate()!==day)return null;
  return Number.isNaN(d.getTime())?null:d;
}
function simpleFormatDateKey(value,options){
  const d=simpleDateFromKey(value);
  return d?d.toLocaleDateString('es-ES',options):'';
}

async function saveWorkoutSession(){
  if(window.__savingWorkout)return;
  if(!user?.id)return toast('Debes iniciar sesión.');
  if(!workoutRoutine?.id||!activeWorkout?.day?.id)return toast('No hay un entrenamiento activo.');
  if(activeWorkout.locked)return toast('Este entrenamiento ya está guardado hoy.');

  const today=simpleLocalDateKey();
  const currentKey=`${user.id}|${workoutRoutine.id}|${activeWorkout.day.id}|${today}`;
  if(window.__lastSavedWorkoutKey===currentKey){
    activeWorkout.locked=true;
    renderWorkoutDay();
    return toast('Este entrenamiento ya está guardado hoy.');
  }

  window.__savingWorkout=true;
  try{
    // Fuente de verdad: Supabase. Sobrevive a recarga/cierre/otra pestaña.
    const existing=await db.from('workouts')
      .select('id')
      .eq('user_id',user.id)
      .eq('workout_date',today)
      .eq('data->>routine_id',String(workoutRoutine.id))
      .eq('data->>routine_day_id',String(activeWorkout.day.id))
      .limit(1);

    if(existing.error)throw existing.error;

    if((existing.data||[]).length){
      window.__lastSavedWorkoutKey=currentKey;

      // consistent with it. `completed_at` remains the precise instant.
      workout_date:today,
      completed_at:new Date().toISOString(),
      exercises:(activeWorkout.exercises||[]).map(e=>{
        const st=activeWorkout.sets[e.id]||[];
        return {
          exercise_id:e.id,
          name:e.name,
          target:e.target||'',

          rest_minutes:(e.rest_seconds||0)/60,
          notes:String(st.note??''),
          sets:st.map((set,i)=>({
            set:i+1,
            kg:set.kg??'',
            reps:set.reps??'',
            rir:set.rir??'',
            done:!!set.done
          }))
        };
      })

    const payload={
