<style>
:root{--bg:#0b0d10;--card:#15191e;--card2:#1b2026;--text:#f4f6f8;--muted:#9ba4ae;--line:#2a3139;--ok:#b9f6ca;--danger:#ff9a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:20px 15px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h1{margin:0;font-size:26px;letter-spacing:-.5px}.sub{color:var(--muted);font-size:12px;margin-top:4px}.actions,.tabs,.buttons{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 13px;border-radius:11px}.btn.primary{background:#fff;color:#111;border-color:#fff}.btn.danger{color:var(--danger)}.tabs{background:#111419;border:1px solid var(--line);padding:5px;border-radius:13px;margin-bottom:18px}.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px}.tabs button.active{background:#fff;color:#111}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.empty{text-align:center;color:var(--muted);padding:38px 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}label{display:block;color:var(--muted);font-size:11px;margin:0 0 5px}input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;outline:none}textarea{min-height:65px;resize:vertical}.routine{display:flex;justify-content:space-between;align-items:center;gap:12px}.routine h3{margin:0}.muted{color:var(--muted);font-size:12px}.badge{border:1px solid var(--line);padding:4px 8px;border-radius:99px;font-size:11px;color:var(--muted)}.day{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.dayhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.exercise{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.exercisehead{display:flex;justify-content:space-between;gap:8px}.exname{font-weight:700}.meta{color:var(--muted);font-size:11px;margin-top:3px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px}.modal.center{align-items:center}.modal.center .sheet{border-radius:20px}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.authbox{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:25px}.authbox h1{margin-bottom:5px}.authbox p{color:var(--muted);font-size:13px}.authbox input,.authbox button{margin-top:8px}.authbox button{width:100%}.msg{font-size:12px;min-height:18px;margin-top:8px}.error{color:var(--danger)}.ok{color:var(--ok)}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:11px;display:none;z-index:50;font-size:13px}@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}.routine{align-items:flex-start;flex-direction:column}header{align-items:flex-start}}

.setrow{display:grid;grid-template-columns:42px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 48px;gap:7px;align-items:center;margin:7px 0}
.setrow input{min-width:0;width:100%}
@media(max-width:650px){
  .setrow{grid-template-columns:34px repeat(3,minmax(0,1fr)) 42px;gap:5px}
  .setrow input{padding:9px 6px;font-size:14px}
  .tick{width:42px;height:38px}
  .rest-buttons{gap:5px}
  .rest-buttons .btn{min-width:44px;padding:9px 10px}
}
.tick{width:48px;height:38px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;font-size:18px}
.tick.done{background:var(--ok);color:#111;border-color:var(--ok)}
.rest-buttons{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px}.rest-buttons .btn{min-width:48px}
.history-session{padding:0;margin-bottom:12px;overflow:hidden}
.history-summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;cursor:pointer}
.history-summary::-webkit-details-marker{display:none}
.history-summary:hover{background:var(--card2)}
.history-title{font-size:19px}
.history-summary-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}.history-delete{padding:8px 14px}.history-chevron{font-size:22px;color:var(--muted);transition:transform .15s ease}
.history-session[open] .history-chevron{transform:rotate(180deg)}
.history-content{padding:0 20px 20px}
.history-exercise{margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}
.history-exercise-head{display:flex;justify-content:space-between;gap:10px}
.history-objective{color:var(--muted);font-size:13px}
.history-table{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.history-row{display:grid;grid-template-columns:70px 1fr 1fr 1fr;padding:9px 12px;border-top:1px solid var(--line)}
.history-row:first-child{border-top:0}
.history-label{font-size:11px;color:var(--muted);background:var(--card2)}
.history-notes{margin-top:9px;color:var(--muted);font-size:13px}
.history-notes span{color:var(--text);font-weight:600}
.history-actions{display:flex;justify-content:flex-end;margin-top:18px}
.history-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.history-select-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.history-select-count{color:var(--muted);font-size:12px}
.history-check{width:19px;height:19px;accent-color:#fff;cursor:pointer;flex:0 0 auto}
.history-summary-main{display:flex;align-items:center;gap:12px;min-width:0}
.history-summary-main>div:last-child{min-width:0}
.history-selected{border-color:#66717e;box-shadow:0 0 0 1px #66717e inset}
.previous-session{margin-top:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
.previous-session-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.previous-session-title{font-size:12px;color:var(--muted);letter-spacing:.2px}
.previous-session-date{font-size:11px;color:var(--muted)}
.previous-session-sets{display:flex;flex-wrap:wrap;gap:6px}
.previous-set{padding:6px 8px;border:1px solid var(--line);border-radius:9px;font-size:12px}
.previous-empty{font-size:12px;color:var(--muted)}

@media(max-width:650px){.history-summary{padding:15px}.history-summary-actions{gap:6px}.history-delete{padding:7px 10px}.history-title{font-size:17px}}

.rest-floating{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:99999;
  width:118px;
  padding:6px 8px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--card);
  box-shadow:0 14px 40px rgba(0,0,0,.45);
  text-align:center;
  cursor:grab;
  user-select:none;
  touch-action:none;
}
.rest-floating:active{cursor:grabbing}
.rest-drag-handle{font-size:9px;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.rest-time{font-size:25px;font-weight:800;line-height:1.15;margin:3px 0 8px}
.rest-finished{display:block;margin:10px 0}

.rest-header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rest-actions{display:flex;gap:3px}
.rest-mini{width:26px;height:26px;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;border-radius:7px;cursor:pointer}
.rest-mini:hover{background:var(--card2);color:var(--text)}
.rest-stop{font-size:12px;padding:6px 10px}
.rest-floating.rest-mini-mode{width:auto;min-width:64px;max-width:90px;padding:3px 6px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.rest-floating.rest-mini-mode .rest-time{font-size:14px;margin:0;font-weight:800}
.rest-floating.rest-mini-mode .rest-drag-handle{display:none}
.rest-floating.rest-mini-mode .rest-stop{display:none}
.rest-floating.rest-mini-mode .rest-header{gap:2px}
.rest-floating.rest-mini-mode .rest-actions{margin-left:0}
.share-code{font-size:30px;font-weight:800;letter-spacing:4px;text-align:center}

.role-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.role-option{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;cursor:pointer;font-weight:700;transition:.15s}
.role-option:has(input:checked){border-color:#fff;box-shadow:0 0 0 2px #fff}
.role-option input{margin:0;accent-color:#fff}

.client-progress-chart{margin:0 0 14px}
.progress-chart-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,220px);gap:10px;margin-bottom:12px}
.progress-chart-controls label{display:block;font-size:13px;color:var(--muted,#9aa3b2);margin-bottom:5px}
.progress-chart-controls select{width:100%;min-height:42px}
.progress-chart-wrap{width:100%;overflow:hidden;border:1px solid var(--border,#30343b);border-radius:14px;background:var(--card,#171a1f);padding:8px}
.progress-chart{display:block;width:100%;height:300px}
.progress-chart-empty{padding:24px;text-align:center;color:var(--muted,#9aa3b2)}
.progress-chart-summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.progress-chart-stat{padding:8px 11px;border:1px solid var(--border,#30343b);border-radius:10px;background:var(--card,#171a1f)}
.progress-chart-stat b{display:block;margin-top:2px}
@media(max-width:560px){
  .progress-chart-controls{grid-template-columns:1fr}
  .progress-chart{height:250px}
}

.progress-point-detail{margin-top:10px;display:none}
.progress-point-detail .point-date{font-weight:700}
.progress-point-detail .point-rir{font-weight:700}
.progress-summary-positive{color:#35d0b5}
.progress-summary-negative{color:#ff7b7b}
.progress-summary-neutral{color:inherit}

function simpleSafeAction(fn){
  if(typeof fn!=='function')return;
  try{
    const result=fn();
    if(result&&typeof result.catch==='function'){
      result.catch(e=>{console.error(e);toast(e?.message||'Ha ocurrido un error.');});
    }
  }catch(e){console.error(e);toast(e?.message||'Ha ocurrido un error.');}
}
function simpleSetBusy(el,busy,label){
  if(!el)return;
  if(busy){
    if(!el.dataset.originalText)el.dataset.originalText=el.textContent;
    el.disabled=true; el.setAttribute('aria-busy','true');
    if(label)el.textContent=label;

let selectedRole='client';

function selectRole(role){
  selectedRole = role === 'trainer' ? 'trainer' : 'client';
  document.querySelectorAll('input[name="simpleRole"]').forEach(input=>{

  });
}

function getPendingRole(){
  const metadataRole=user?.user_metadata?.simple_role;
  if(metadataRole==='trainer' || metadataRole==='client') return metadataRole;
  const saved=localStorage.getItem('simple_pending_role');
  return saved==='trainer' || saved==='client' ? saved : 'client';
}

async function ensureProfile(chosenRole){
  if(!user?.id) throw new Error('No hay una sesión activa.');

  // First try to read the profile.
  const p = await db.from('profiles')
    .select('id,name,role')
    .eq('id',user.id)
    .maybeSingle();

  if(p.error) throw p.error;
  if(p.data) return p.data;

  // A new account must have a role. Never invent one silently.
  const role = chosenRole || getPendingRole();
  if(role !== 'trainer' && role !== 'client'){
    throw new Error('No se ha podido recuperar el tipo de cuenta. Vuelve a crear la cuenta seleccionando Cliente o Entrenador.');
  }

  const name =
    user.user_metadata?.name ||
    user.user_metadata?.full_name ||
    user.email?.split('@')[0] ||
    'Usuario';

  const q = await db.from('profiles')
    .insert({id:user.id,name,role})
    .select('id,name,role')
    .single();

  if(q.error){
    // If another auth event created it milliseconds earlier, read it again.
    if(q.error.code === '23505'){
      const retry = await db.from('profiles')
        .select('id,name,role')
        .eq('id',user.id)
        .maybeSingle();
      if(retry.error) throw retry.error;
      if(retry.data) return retry.data;
    }
    throw q.error;
  }

  return q.data;
}

async function finishConfirmedSignup(){
  if(!user?.id) throw new Error('No hay una sesión activa.');

  const role = getPendingRole();
  const profile = await ensureProfile(role);

  // Once the profile exists, the pending local value is no longer needed.
  localStorage.removeItem('simple_pending_role');
  return profile;
}

async function authSubmit(){
  const email=$('email').value.trim();
  const password=$('password').value;
  const btn=$('authBtn');

  if(!email || !password){
    msg('Introduce correo y contraseña.');
    return;
  }
  if(password.length < 6){
    msg('La contraseña debe tener al menos 6 caracteres.');
    return;
  }

  btn.disabled=true;
  $('authSwitch').disabled=true;
  document.querySelectorAll('input[name="simpleRole"]').forEach(x=>x.disabled=true);
  btn.textContent='Conectando...';
  msg('Conectando...',true);

  const submittingMode=mode;
  const submittingRole=selectedRole;

  try{
    if(submittingMode==='signup'){
      if(submittingRole!=='trainer' && submittingRole!=='client'){
        msg('Selecciona Cliente o Entrenador.');
        return;
      }
      localStorage.setItem('simple_pending_role', submittingRole);
    }

    const r = submittingMode==='login'
      ? await db.auth.signInWithPassword({email,password})
      : await db.auth.signUp({
          email,
          password,
          options:{
            emailRedirectTo:APP_URL,
            data:{
              simple_role:submittingRole,
              name:email.split('@')[0]
            }
          }
        });

    if(r.error){
      console.error('Auth:',r.error);
      msg(r.error.message || 'No se pudo iniciar sesión.');
      return;
    }

    // Supabase normally returns a user without a session when email confirmation
    // is required. In that case we deliberately stop here and let the email link
    // create the authenticated session.
    if(submittingMode==='signup' && !r.data?.session){
      mode='login';
      $('authBtn').textContent='Iniciar sesión';
      $('authSwitch').textContent='Crear cuenta';
      msg('Cuenta creada. Confirma el correo y después inicia sesión con esa cuenta.',true);
      return;
    }

    if(!r.data?.user){
      msg('No se pudo obtener la cuenta.');
      return;
    }

    // Get the authenticated user from the server, not from stale local state.
    const userCheck=await db.auth.getUser();
    if(userCheck.error || !userCheck.data?.user){
      console.error('User check:',userCheck.error);
      msg('La sesión aún no está lista. Inténtalo de nuevo.');
      return;
    }
    user=userCheck.data.user;

    // IMPORTANT: after email confirmation, the first login can be the moment
    // where the profile is created. Therefore LOGIN also runs ensureProfile().
    try{
      profile=await ensureProfile(
        submittingMode==='signup' ? submittingRole : getPendingRole()
      );
    }catch(profileError){
      console.error('Profile bootstrap:',profileError);
      msg(
        profileError?.code==='42501'
          ? 'La cuenta funciona, pero Supabase bloquea la creación del perfil. Hay que revisar la política INSERT de profiles.'
          : (profileError?.message || 'No se pudo crear o encontrar el perfil.')
      );
      return;
    }

    localStorage.removeItem('simple_pending_role');
    await start(profile.role);
  }catch(e){
    console.error('Auth submit:',e);
    msg(e?.message || 'Error de conexión con Supabase.');
  }finally{
    if($('app').style.display==='none'){
      btn.disabled=false;
      $('authSwitch').disabled=false;
      document.querySelectorAll('input[name="simpleRole"]').forEach(x=>x.disabled=false);
      btn.textContent=mode==='login'?'Iniciar sesión':'Crear cuenta';
    }
  }
}

async function getProfileStable(){
  let lastError=null;
  for(let attempt=0; attempt<4; attempt++){
    const u=await db.auth.getUser();
    if(u.error){ lastError=u.error; }
    else if(u.data?.user){ user=u.data.user; }
    if(user?.id){
      const p=await db.from('profiles')
        .select('id,name,role')
        .eq('id',user.id)
        .maybeSingle();
      if(!p.error && p.data) return p.data;
      lastError=p.error || new Error('No se ha podido cargar el perfil. Cierra sesión y vuelve a iniciar sesión.');
    }
    await new Promise(resolve=>setTimeout(resolve,250*(attempt+1)));
  }
  throw lastError || new Error('No se pudo cargar el perfil.');
}

async function start(chosenRole=null){
  if(!user) return false;
  try{
    profile=await getProfileStable();

    if(chosenRole && profile.role!==chosenRole){
      const actualRole=profile.role;
      $('app').style.display='none';
      $('auth').style.display='flex';
      msg(
        `Esta cuenta está configurada como ${actualRole==='trainer'?'entrenador':'cliente'}. ` +
        `Selecciona el tipo correcto para iniciar sesión.`
      );

    }

    $('auth').style.display='none';

    $('mail').textContent=user.email||'';
    $('role').textContent=profile.role==='trainer'?'Entrenador':'Cliente';

  }catch(e){
    console.error('Start:',e);
    $('app').style.display='none';
    $('auth').style.display='flex';
    msg(e?.message || 'No se pudo cargar el perfil.');
    return false;
  }
}


async function bootstrapAuthSession(){
  try{
    const {data,error}=await db.auth.getSession();
    if(error) throw error;

    if(data?.session?.user){
      user=data.session.user;

      // This is the critical path after clicking "Confirm email".
      // The confirmation redirect may arrive without the original signup form
      // being present, so create the profile from user_metadata here.
      try{
        profile=await ensureProfile(getPendingRole());
        localStorage.removeItem('simple_pending_role');
        await start(profile.role);
        return true;
      }catch(profileError){
        console.error('Confirmation/profile bootstrap:',profileError);
        // Leave the user on the login screen with a useful message instead
        // of showing a generic "Perfil no encontrado".
        $('auth').style.display='block';
        $('app').style.display='none';
        msg(
          profileError?.code==='42501'
            ? 'Correo confirmado. Falta permitir la creación del perfil en Supabase.'
            : (profileError?.message || 'Correo confirmado, pero no se pudo preparar el perfil.')
        );
      }
    }
  }catch(e){
    console.error('bootstrapAuthSession:',e);
  }
  return false;
}

db.auth.onAuthStateChange(async (event, session)=>{
  if(event==='PASSWORD_RECOVERY'){
    if(session?.user) user=session.user;
    openPasswordReset();
    return;
  }
  if(!session?.user) return;
  if(event==='SIGNED_IN' || event==='INITIAL_SESSION'){
    const recoveryMarker=new URLSearchParams(window.location.search).get('reset')==='1';
    const recoveryHash=new URLSearchParams((window.location.hash||'').replace(/^#/,'')).get('type')==='recovery';
    if(recoveryMarker || recoveryHash){
      user=session.user;
      openPasswordReset();
      return;
    }
    try{
      user=session.user;
      profile=await finishConfirmedSignup();
      if($('auth') && $('auth').style.display!=='none' && !window.__simpleStarted){
        window.__simpleStarted=true;
        await start(null);
      }
    }catch(e){
      console.error('Auth state/profile setup:',e);
    }
  }
});

async function updateTrashIconState(){
  const buttons=[$('tTrash'),$('tTrashClient')].filter(Boolean);
  if(!buttons.length||!user)return;
  try{
    const r=await db.from('routines')
      .select('id', {count:'exact',head:true})
      .eq('owner_id',user.id)
      .not('deleted_at','is',null);
    const full=!r.error && (r.count||0)>0;
    buttons.forEach(b=>{
      b.classList.toggle('trash-full',full);
      b.title=full?'Papelera (con rutinas)':'Papelera (vacía)';
      b.setAttribute('aria-label',full?'Abrir papelera: hay rutinas eliminadas':'Abrir papelera: vacía');
    });
  }catch(e){
    console.warn('No se pudo actualizar el estado visual de la papelera:',e);
  }
}

async function logout(){await db.auth.signOut();location.reload()}
async function reload(){
  if(!user) throw new Error('No hay una sesión activa.');

  const r=await db.from('routines')
    .select('id,name,description,share_code,source_routine_id,created_at,deleted_at,routine_order')
     .eq('owner_id',user.id)
     .is('deleted_at',null)
     .order('routine_order',{ascending:true,nullsFirst:false});

  if(r.error){
    console.error('Carga de rutinas:',r.error);
    throw r.error;
  }

  routines=r.data||[];

  if(profile?.role==='client'){
    const a=await db.from('routine_assignments')
      .select('*')
      .eq('client_id',user.id)
      .is('client_deleted_at',null)
      .order('created_at',{ascending:false});

    if(a.error){
      console.error('Carga de asignaciones:',a.error);
      throw a.error;
    }

    assignments=a.data||[];
  }else{
    assignments=[];
    // Trainer: load exactly the assignments belonging to this trainer.
    // Keep the same query shape used by the known-working SIMPLE build.
    const mineIds=routines.map(r=>r.id);
    if(mineIds.length){
      const a=await db.from('routine_assignments')
        .select('id,client_id,trainer_id,trainer_routine_id,client_routine_id,created_at')
        .eq('trainer_id',user.id)
        .in('trainer_routine_id',mineIds)
        .order('created_at',{ascending:false});
      if(a.error){
        console.error('Carga de clientes:',a.error);
        throw a.error;
      }
      assignments=a.data||[];
    }else{
      assignments=[];
    }
  }}

async function renderTrash(){
  const box=$('trash');
  if(!box)return;
  box.innerHTML='<div class="card"><h2 style="margin:0 0 4px">🗑️ Papelera</h2><div class="muted">Rutinas eliminadas.</div></div><div class="card"><div class="muted">Cargando...</div></div>';
  try{
    const r=await db.from('routines').select('id,name,description,created_at,deleted_at')
      .eq('owner_id',user.id).not('deleted_at','is',null).order('deleted_at',{ascending:false});
    if(r.error)throw r.error;
    const rows=r.data||[];
    if(!rows.length){
      box.innerHTML='<div class="card"><h2 style="margin:0 0 4px">🗑️ Papelera</h2><div class="empty">La papelera está vacía.</div></div>';
      return;
    }
    box.innerHTML='<div class="card"><h2 style="margin:0 0 4px">🗑️ Papelera</h2><div class="muted">Restaura una rutina o elimínala definitivamente.</div></div>'+
      rows.map(r=>`<div class="card routine">
        <div><h3>${esc(r.name)}</h3><div class="muted">${esc(r.description||'Sin descripción')}</div>
        <div class="muted" style="margin-top:5px">Eliminada: ${new Date(r.deleted_at).toLocaleString('es-ES')}</div></div>
        <div class="buttons"><button class="btn" onclick="restoreRoutine('${r.id}')">↩ Restaurar</button>
        <button class="btn danger" onclick="permanentlyDeleteRoutine('${r.id}')">Eliminar definitivamente</button></div>
      </div>`).join('');
  }catch(e){
    console.error('renderTrash:',e);
    box.innerHTML='<div class="card"><div class="empty">No se pudo cargar la papelera.</div></div>';
  }
}
async function restoreRoutine(id){
  if(window.__routineTrashBusy)return;
  window.__routineTrashBusy=true;
  try{
    const r=await db.from('routines').update({deleted_at:null}).eq('id',id).eq('owner_id',user.id).not('deleted_at','is',null);
    if(r.error)throw r.error;
    await reload();renderMine();await renderTrash();updateTrashIconState();toast('Rutina restaurada');
  }catch(e){console.error(e);toast('No se pudo restaurar la rutina: '+(e.message||'revisa los permisos'))}
  finally{window.__routineTrashBusy=false}
}
async function permanentlyDeleteRoutine(id){
  if(window.__routineTrashBusy)return;
  if(!confirm('⚠️ Eliminar definitivamente esta rutina y todo su contenido?\\n\\nEsta acción no se puede deshacer.'))return;
  window.__routineTrashBusy=true;
  try{
    const r=await db.from('routines').delete().eq('id',id).eq('owner_id',user.id).not('deleted_at','is',null);
    if(r.error)throw r.error;
    await renderTrash();toast('Rutina eliminada definitivamente');
  }catch(e){console.error(e);toast('No se pudo eliminar definitivamente: '+(e.message||'revisa los permisos'))}
  finally{window.__routineTrashBusy=false}
}

async function renderClientTrash(){
  const box=$('trash');if(!box)return;
  box.innerHTML='<div class="card"><h2 style="margin:0 0 4px">🗑️ Papelera</h2><div class="muted">Rutinas que has quitado de tus rutinas.</div></div><div class="card"><div class="muted">Cargando...</div></div>';
  try{
    const key='simple_client_trash_'+user.id;
    let cached=[];try{cached=JSON.parse(localStorage.getItem(key)||'[]')}catch(_){}
    if(!Array.isArray(cached))cached=[];

    // The deleted assignment may be invisible to SELECT because of RLS.
    // Merge whatever the database exposes with our locally captured row.
    const q=await db.from('routine_assignments')
      .select('id,trainer_routine_id,created_at,client_deleted_at')
      .eq('client_id',user.id)
      .not('client_deleted_at','is',null)
      .order('client_deleted_at',{ascending:false});
    const rows=q.error?[]:(q.data||[]);
    const map=new Map();
    [...cached,...rows].forEach(x=>{if(x?.id)map.set(String(x.id),x)});
    const assignments=[...map.values()].filter(x=>x?.trainer_routine_id);

    let html='<div class="card"><h2 style="margin:0 0 4px">🗑️ Papelera</h2><div class="muted">Puedes restaurar las rutinas que hayas quitado por error.</div></div>';
    let shown=[];

    for(const a of assignments){
      let name=a.routine_name||'Rutina';
      let description=a.routine_description||'';
      let deletedByTrainer=false;
      try{
        const mk='simple_shared_routine_meta_'+user.id;
        const meta=JSON.parse(localStorage.getItem(mk)||'{}')?.[String(a.trainer_routine_id)]||{};
        if((!name||name==='Rutina')&&meta.name)name=meta.name;
        if(!description&&meta.description)description=meta.description;
      }catch(_){}

      // If visible, refresh the cached metadata from the source routine.
      const rr=await db.from('routines')
        .select('id,name,description,deleted_at')
        .eq('id',a.trainer_routine_id).maybeSingle();

      if(!rr.error && rr.data){
        name=rr.data.name||name;
        description=rr.data.description||description;
        deletedByTrainer=rr.data.deleted_at!=null;
      }

      const safe={...a,routine_name:name,routine_description:description};
      shown.push(safe);

      const action=deletedByTrainer
        ? '<div class="muted">Esta rutina ya no está disponible porque fue eliminada por su entrenador.</div>'
        : `<button class="btn" type="button" onclick="restoreClientRoutine('${a.id}')">↩ Restaurar</button>`;

      html+=`<div class="card routine"><div><h3>${esc(name)}</h3><div class="muted">${esc(description||'Sin descripción')}</div><div class="muted" style="margin-top:5px">Quitada: ${a.client_deleted_at?new Date(a.client_deleted_at).toLocaleString('es-ES'):'—'}</div></div><div class="buttons">${action}</div></div>`;
    }

    // IMPORTANT: never replace a good local trash row with [] just because
    // Supabase RLS hid it from the subsequent SELECT.
    localStorage.setItem(key,JSON.stringify(shown));
    if(!shown.length)html+='<div class="card"><div class="empty">La papelera está vacía.</div></div>';
    box.innerHTML=html;
  }catch(e){
    console.error('renderClientTrash:',e);
    box.innerHTML='<div class="card"><div class="empty">No se pudo cargar la papelera.</div></div>';
  }
}
async function restoreClientRoutine(assignmentId){
  if(window.__routineTrashBusy)return;
  window.__routineTrashBusy=true;
  try{
    const q=await db.from('routine_assignments')
      .update({client_deleted_at:null})
      .eq('id',assignmentId)
      .eq('client_id',user.id)
      .not('client_deleted_at','is',null);
    if(q.error)throw q.error;

    const key='simple_client_trash_'+user.id;
    let cached=[];try{cached=JSON.parse(localStorage.getItem(key)||'[]')}catch(_){}
    if(!Array.isArray(cached))cached=[];
    localStorage.setItem(key,JSON.stringify(cached.filter(x=>String(x.id)!==String(assignmentId))));

    await reload();

    await renderClientTrash();
    toast('Rutina restaurada');
  }catch(e){
    console.error('restoreClientRoutine:',e);
    toast('No se pudo restaurar la rutina: '+(e.message||'revisa los permisos'));
  }finally{window.__routineTrashBusy=false}
}

let clientProgressChartState={sessions:[],exerciseNames:[],metric:'weight'};

function getProgressExercises(sessions){
  const names=[];
  const seen=new Set();
  sessions.forEach(s=>{
    const ex=Array.isArray(s?.data?.exercises)?s.data.exercises:
      Array.isArray(s?.exercises)?s.exercises:[];
    ex.forEach(e=>{
      const name=String(e?.name||e?.exercise_name||'').trim();
      const key=name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
      if(name&&!seen.has(key)){seen.add(key);names.push(name);}
    });
  });
  return names.sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));
}

function getExercisePoints(sessions,exerciseName,metric){
  const ordered=[...sessions].sort((a,b)=>new Date(a.workout_date)-new Date(b.workout_date));
  return ordered.map((s,idx)=>{
    const exs=Array.isArray(s?.data?.exercises)?s.data.exercises:
      Array.isArray(s?.exercises)?s.exercises:[];
    const normalizeExerciseName=v=>String(v||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const targetExerciseName=normalizeExerciseName(exerciseName);
    const e=exs.find(x=>normalizeExerciseName(x?.name||x?.exercise_name)===targetExerciseName);
    if(!e)return null;
    const sets=Array.isArray(e?.sets)?e.sets:
      Array.isArray(e?.series)?e.series:[];
    const nums=sets.map((set,setIndex)=>{
      const kg=Number(set?.kg ?? set?.weight);
      const reps=Number(set?.reps ?? set?.repetitions);
      const rir=Number(set?.rir);
      const estimated1rm=(Number.isFinite(kg)&&Number.isFinite(reps)&&kg>0&&reps>0)
        ? 0.0333*kg*reps+kg : null;
      return {kg,reps,rir,estimated1rm,setIndex};
    });

    let value=null;
    if(metric==='weight'){
      const vals=nums.map(x=>x.kg).filter(Number.isFinite);
      value=vals.length?Math.max(...vals):null;
    }else if(metric==='reps'){
      const vals=nums.map(x=>x.reps).filter(Number.isFinite);
      value=vals.length?Math.max(...vals):null;
    }else if(metric==='1rm'){
      const valid=nums.filter(x=>Number.isFinite(x.estimated1rm));
      if(valid.length){
        const best=valid.reduce((a,b)=>b.estimated1rm>a.estimated1rm?b:a);
        value=best.estimated1rm;
      }
    }

    if(value===null)return null;

    // RIR shown in the tooltip: prefer the RIR of the set that generated the
    // plotted 1RM; otherwise show the average RIR recorded for the exercise.
    let pointRir=null;
    if(metric==='1rm'){
      const valid=nums.filter(x=>Number.isFinite(x.estimated1rm));
      const best=valid.length?valid.reduce((a,b)=>b.estimated1rm>a.estimated1rm?b:a):null;
      if(best && Number.isFinite(best.rir)) pointRir=best.rir;
    }
    if(pointRir===null){
      const rirs=nums.map(x=>x.rir).filter(Number.isFinite);
      pointRir=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;
    }

    return {
      date:new Date(s.workout_date),
      value,
      session:idx+1,
      rir:pointRir,
      bestKg:metric==='1rm' ? nums.filter(x=>Number.isFinite(x.estimated1rm)).reduce((a,b)=>!a||b.estimated1rm>a.estimated1rm?b:a,null)?.kg : null,
      bestReps:metric==='1rm' ? nums.filter(x=>Number.isFinite(x.estimated1rm)).reduce((a,b)=>!a||b.estimated1rm>a.estimated1rm?b:a,null)?.reps : null
    };
  }).filter(Boolean);
}


function progressMetricLabel(metric){
  return metric==='weight'?'Peso (kg)':metric==='reps'?'Repeticiones':metric==='1rm'?'1RM estimado (kg)':'RIR medio';
}

function formatProgressValue(value,metric){
  if(value===null||value===undefined||!Number.isFinite(Number(value)))return '—';
  if(metric==='reps')return `${Math.round(Number(value))} reps`;
  if(metric==='rir')return `RIR ${Number(value).toFixed(1)}`;
  return `${Number(value).toLocaleString('es-ES',{maximumFractionDigits:1})} kg`;
}

let __progressRenderToken=0;
function renderClientProgressChart(){
  const myToken=++__progressRenderToken;
  const root=$('clientProgressChart');
  const select=$('clientProgressExercise');
  const metricSelect=$('clientProgressMetric');
  if(!root||!select||!metricSelect)return;

  const exerciseName=String(select.value||'');
  const metric=metricSelect.value;
  clientProgressChartState.metric=metric;

  let sourceSessions=clientProgressChartState.filteredSessions||clientProgressChartState.sessions||[];
  let points=getExercisePoints(sourceSessions,exerciseName,metric);
  const pointDetail=$('clientProgressPointDetail');
  if(pointDetail){pointDetail.style.display='none';pointDetail.innerHTML='';}
  const oldTooltip=$('progressPointTooltip');
  if(oldTooltip){oldTooltip.style.display='none';oldTooltip.innerHTML='';}

  // Never let a huge/dirty history freeze the browser.
  if(points.length>120)points=points.slice(-120);

  const clean=points
    .filter(p=>p && p.date instanceof Date && !Number.isNaN(p.date.getTime()) &&
      Number.isFinite(p.value) && Math.abs(p.value)<1000000)
    .sort((a,b)=>a.date-b.date);

  if(myToken!==__progressRenderToken)return;

  if(!clean.length){
    root.innerHTML='<div class="progress-chart-empty">No hay datos suficientes para este ejercicio.</div>';
    $('clientProgressChartSummary').innerHTML='';
    return;
  }

  const W=860,H=300,L=64,R=20,T=28,B=52;
  const innerW=W-L-R, innerH=H-T-B;
  const values=clean.map(p=>p.value);
  let dataMin=Math.min(...values), dataMax=Math.max(...values);

  if(!Number.isFinite(dataMin)||!Number.isFinite(dataMax)){
    root.innerHTML='<div class="progress-chart-empty">No hay datos válidos para este ejercicio.</div>';
    $('clientProgressChartSummary').innerHTML='';
    return;
  }

  const range=dataMax-dataMin;
  const base=Math.max(Math.abs(dataMax),Math.abs(dataMin),1);
  const rawStep=range>0?range/4:base/10;

  function niceStep(step){
    if(!Number.isFinite(step)||step<=0)return 1;
    const power=Math.pow(10,Math.floor(Math.log10(step)));
    const n=step/power;
    const nice=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;
    return nice*power;
  }

  let step=niceStep(rawStep);
  if(metric==='reps')step=Math.max(step,1);
  if(metric==='rir')step=Math.max(step,.5);

  let axisMin=Math.floor(dataMin/step)*step;
  let axisMax=Math.ceil(dataMax/step)*step;
  if(axisMin===axisMax){
    axisMin=Math.max(0,axisMin-step*2);
    axisMax=axisMax+step*2;
  }else{
    axisMin=Math.max(0,axisMin-step);
    axisMax=axisMax+step;
  }

  let tickCount=Math.round((axisMax-axisMin)/step)+1;
  let guard=0;
  while(tickCount>7&&guard++<8){
    step=niceStep(step*1.5);
    axisMin=Math.max(0,Math.floor(dataMin/step)*step-step);
    axisMax=Math.ceil(dataMax/step)*step+step;
    tickCount=Math.round((axisMax-axisMin)/step)+1;
  }
  guard=0;
  while(tickCount<4&&guard++<8){
    step=niceStep(step/2);
    axisMin=Math.max(0,Math.floor(dataMin/step)*step-step);
    axisMax=Math.ceil(dataMax/step)*step+step;
    tickCount=Math.round((axisMax-axisMin)/step)+1;
  }

  const ticks=[];
  for(let v=axisMin,n=0;v<=axisMax+step*.001&&n<12;v+=step,n++){
    ticks.push(Number(v.toPrecision(12)));
  }
  const uniqueTicks=[...new Set(ticks)];
  if(uniqueTicks.length<2)uniqueTicks.push(axisMax);

  const x=i=>clean.length===1?L+innerW/2:L+(i/(clean.length-1))*innerW;
  const y=v=>T+((axisMax-v)/(axisMax-axisMin))*innerH;
  const fmt=v=>formatProgressValue(v,metric);

  const gridSvg=uniqueTicks.map(v=>`
    <line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="currentColor" opacity=".12"/>
    <text x="${L-9}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".65">${esc(fmt(v))}</text>
  `).join('');

  const poly=clean.length>1
    ? clean.map((p,i)=>`${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ')
    : '';

  const pointsSvg=clean.map((p,i)=>`
    <circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="5"
      fill="currentColor" opacity=".98"
      stroke="currentColor" stroke-width="1"
      data-progress-index="${i}"
      style="cursor:pointer"
      onclick="showProgressPoint(${i},this)"/>
  `).join('');

  const labels=clean.map((p,i)=>{
    const every=Math.max(1,Math.ceil(clean.length/6));
    if(i!==0&&i!==clean.length-1&&i%every!==0)return '';
    return `<text x="${x(i).toFixed(1)}" y="${H-20}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".65">${esc(p.date.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}))}</text>`;
  }).join('');

  root.innerHTML=`
    <div class="progress-svg-wrap">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(progressMetricLabel(metric))}">
        ${gridSvg}
        ${poly?`<polyline points="${poly}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`:''}
        ${pointsSvg}
        ${labels}
      </svg>
      <div id="progressPointTooltip" class="progress-point-tooltip" aria-live="polite"></div>
    </div>`;

  const first=clean[0],last=clean[clean.length-1];
  const delta=last.value-first.value;
  const pct=first.value!==0?(delta/Math.abs(first.value))*100:null;
  const isImprovement=delta>0;
  const trendClass=delta===0?'neutral':(isImprovement?'positive':'negative');
  const trendText=delta===0?'Sin cambio':(isImprovement?'Mejora':'Empeoramiento');    const bestPoint=clean.reduce((best,p)=>p.value>best.value?p:best,clean[0]);
    const deltaLabel=delta>0?`+${formatProgressValue(delta,metric)}`:formatProgressValue(delta,metric);
    $('clientProgressChartSummary').innerHTML=`
      <div class="progress-stat-card compact-progress-stat">
        <span class="muted">Primera sesión</span>
        <b>${formatProgressValue(first.value,metric)}</b>
        <small>${first.date.toLocaleDateString('es-ES')}</small>
      </div>
      <div class="progress-stat-card compact-progress-stat">
        <span class="muted">Última sesión</span>
        <b>${formatProgressValue(last.value,metric)}</b>
        <small>${last.date.toLocaleDateString('es-ES')}</small>
      </div>
      <div class="progress-stat-card compact-progress-stat">
        <span class="muted">Mejor marca</span>
        <b>${formatProgressValue(bestPoint.value,metric)}</b>
        <small>${bestPoint.date.toLocaleDateString('es-ES')}${bestPoint.rir!=null?` · RIR ${Number(bestPoint.rir).toFixed(1)}`:''}</small>
      </div>
      <div class="progress-stat-card compact-progress-stat ${trendClass}">
        <span class="muted">% respecto a la primera</span>
        <b>${pct!==null?(pct>0?'+':'')+pct.toFixed(1)+'%':'—'}</b>
        <small>${trendText} · ${deltaLabel}</small>
      </div>`;

  clientProgressChartState.points=clean;
}

function showProgressPoint(index,node){
  const p=clientProgressChartState.points?.[index];
  const wrap=$('clientProgressChart');
  const tooltip=$('progressPointTooltip');
  if(!p||!wrap||!tooltip)return;

  const value=formatProgressValue(p.value,clientProgressChartState.metric);
  const rir=p.rir!=null?`<span class="progress-tooltip-rir">RIR ${Number(p.rir).toFixed(1)}</span>`:'';
  tooltip.innerHTML=`
    <div class="progress-tooltip-date">${p.date.toLocaleDateString('es-ES')}</div>
    <div class="progress-tooltip-value">${esc(value)} ${rir}</div>`;

  const svg=wrap.querySelector('svg');
  if(!svg||!node)return;
  const vb=svg.viewBox.baseVal;
  const svgRect=svg.getBoundingClientRect();
  const wrapRect=wrap.getBoundingClientRect();
  const cx=Number(node.getAttribute('cx')), cy=Number(node.getAttribute('cy'));
  const px=svgRect.left+(cx/vb.width)*svgRect.width-wrapRect.left;
  const py=svgRect.top+(cy/vb.height)*svgRect.height-wrapRect.top;

  tooltip.style.display='block';
  tooltip.style.left=`${Math.max(8,Math.min(wrapRect.width-170,px))}px`;
  tooltip.style.top=`${Math.max(8,py-72)}px`;

  const detail=$('clientProgressPointDetail');
  if(detail){detail.style.display='none';detail.innerHTML='';}
}


function getProgressDays(sessions,orderedRoutineDays=[]){
  const map=new Map();
  const ordered=orderedRoutineDays||[];
  const byName=new Map(ordered.map(d=>[String(d.name||'').trim().toLowerCase(),String(d.id)]));

  (sessions||[]).forEach(s=>{
    const d=s?.data||{};
    const rawId=d.day_id??d.dayId??null;
    const rawName=String(d.day_name??d.dayName??d.day_title??s.variant??s.day??'Sesión').trim();
    const normalizedName=rawName.toLowerCase();
    const key=rawId!=null
      ? String(rawId)
      : (byName.get(normalizedName)||`name:${normalizedName}`);
    if(!map.has(key))map.set(key,{key,name:rawName,sessions:[]});
    map.get(key).sessions.push(s);
  });

  const order=new Map(ordered.map((d,i)=>[String(d.id),i]));
  return [...map.values()].sort((a,b)=>{
    const ai=order.has(String(a.key))?order.get(String(a.key)):999999;
    const bi=order.has(String(b.key))?order.get(String(b.key)):999999;
    if(ai!==bi)return ai-bi;
    const an=String(a.name||'').toLowerCase(),bn=String(b.name||'').toLowerCase();
    return an.localeCompare(bn,'es');
  });
}

function progressPeriodStart(period){
  const now=new Date();
  const d=new Date(now);
  if(period==='month'){
    d.setDate(1);d.setHours(0,0,0,0);
  }else if(period==='quarter'){
    d.setMonth(Math.floor(d.getMonth()/3)*3,1);d.setHours(0,0,0,0);
  }else if(period==='year'){
    d.setMonth(0,1);d.setHours(0,0,0,0);
  }else return null;
  return d;
}
function filterProgressSessions(sessions,period){
  const start=progressPeriodStart(period);
  if(!start)return sessions||[];
  return (sessions||[]).filter(s=>{
    const raw=s?.workout_date??s?.date??s?.created_at??s?.data?.workout_date??s?.data?.date??s?.data?.created_at;
    const d=new Date(raw);
    return !Number.isNaN(d.getTime())&&d>=start;
  });
}
function setupClientProgressChart(sessions){
  clientProgressChartState.sessions=Array.isArray(sessions)?sessions:[];
  const daySelect=$('clientProgressDay'), exerciseSelect=$('clientProgressExercise');
  const metric=$('clientProgressMetric'), periodSelect=$('clientProgressPeriod');
  if(!exerciseSelect||!metric)return;

  const allDays=getProgressDays(clientProgressChartState.sessions,clientProgressChartState.orderedRoutineDays||[]);
  clientProgressChartState.days=allDays;

  if(daySelect){
    daySelect.innerHTML=allDays.map(d=>`<option value="${esc(d.key)}">${esc(d.name)}</option>`).join('');
    daySelect.disabled=!allDays.length;
  }

  const rebuildExercises=()=>{
    const period=periodSelect?.value||'month';
    clientProgressChartState.period=period;
    const key=daySelect?.value??allDays[0]?.key;
    const day=allDays.find(d=>String(d.key)===String(key));
    const periodSessions=filterProgressSessions(day?.sessions||clientProgressChartState.sessions,period);
    clientProgressChartState.selectedDayKey=key;
    clientProgressChartState.filteredSessions=periodSessions;
    const names=getProgressExercises(periodSessions);
    exerciseSelect.innerHTML=names.slice(0,200).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
    exerciseSelect.disabled=!names.length;
    metric.disabled=!names.length;
    if(names.length)renderClientProgressChart();
    else{
      $('clientProgressChart').innerHTML='<div class="progress-chart-empty">No hay datos en este periodo para este día.</div>';
      $('clientProgressChartSummary').innerHTML='';
    }
  };
  const schedule=()=>{
    clearTimeout(window.__progressDebounce);
    window.__progressDebounce=setTimeout(renderClientProgressChart,80);
  };
  exerciseSelect.onchange=schedule;
  metric.onchange=schedule;
  if(daySelect)daySelect.onchange=rebuildExercises;
  if(periodSelect)periodSelect.onchange=rebuildExercises;
  rebuildExercises();
}

async function openRoutineProgress(routineId){
  if(!user?.id)return toast('Debes iniciar sesión.');
  const routine=routines.find(r=>String(r.id)===String(routineId));
  if(!routine)return toast('Rutina no encontrada.');
  const title=$('clientProgressTitle'), subtitle=$('clientProgressSubtitle'), body=$('clientProgressBody');

async function editClientAssignedRoutine(clientId,routineId,routineName){
  if(profile?.role!=='trainer')return toast('Solo el entrenador puede editar la rutina.');
  if(!user?.id||!clientId||!routineId)return toast('Rutina o cliente no encontrado.');
  try{
    const a=await db.from('routine_assignments')
      .select('id,trainer_routine_id')
      .eq('trainer_id',user.id)
      .eq('client_id',clientId)
      .eq('trainer_routine_id',routineId)
      .is('client_deleted_at',null)
      .maybeSingle();
    if(a.error)throw a.error;
    if(!a.data)return toast('Esta rutina ya no está asignada a este cliente.');

    const r=routines.find(x=>String(x.id)===String(routineId)) ||
      (await db.from('routines').select('id,name,description').eq('id',routineId).maybeSingle()).data;
    if(!r)return toast('No se encontró la rutina.');

    editDays=await days(routineId);
    window.__clientRoutineEdit={clientId,routineId,assignmentId:a.data.id,reorder:false,dayIndex:null};

    $('editor').innerHTML=`
      <div class="card" style="margin:0 0 12px">
        <div class="grid">
          <div><label>Nombre de la rutina</label><input id="en" value="${esc(r.name||routineName||'Rutina')}"></div>
          <div><label>Descripción</label><input id="ed" value="${esc(r.description||'')}"></div>
        </div>
      </div>
      <div id="clientRoutineEditor"></div>`;
    renderClientRoutineSessions();
    closeM('clientModal');
    openM('editModal');
  }catch(e){
    console.error('editClientAssignedRoutine:',e);
    toast('No se pudo abrir el editor de la rutina.');
  }
}

function renderClientRoutineSessions(){
  const box=$('clientRoutineEditor'); if(!box)return;
  const state=window.__clientRoutineEdit||{};
  if(state.dayIndex!=null)return renderClientRoutineDayEditor(state.dayIndex);

  box.innerHTML=`
    <div class="card" style="margin:0 0 12px">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
        <div>
          <h3 style="margin:0">Sesiones de entrenamiento</h3>
          <div class="muted">Selecciona una sesión para editar sus ejercicios.</div>
        </div>
        <div class="buttons">
          <button class="btn" onclick="toggleClientSessionReorder()">${state.reorder?'Listo':'↕ Reordenar sesiones'}</button>
          <button class="btn primary" onclick="addClientEditorDay()">+ Añadir sesión</button>
        </div>
      </div>
    </div>
    <div id="clientSessionList"></div>
    <div class="buttons" style="justify-content:flex-end;margin-top:12px">
      <button class="btn primary" onclick="saveClientRoutineEditor()">Guardar cambios</button>
    </div>`;

  const list=$('clientSessionList');
  if(!list)return;
  list.classList.toggle('session-reorder-active',!!state.reorder);
  if(!editDays.length){
    list.innerHTML='<div class="empty">No hay sesiones. Añade una sesión para empezar.</div>';
    return;
  }

  let h='';
  const gap=(target)=>state.reorder
    ? `<div class="day-order-gap" data-drop-index="${target}"
         ondragover="dragOverClientSessionGap(event)"
         ondrop="dropClientSessionGap(event,${target})"
         ondragenter="event.preventDefault()"
         aria-label="Soltar aquí"></div>`
    : '';

  h+=gap(0);
  editDays.forEach((d,i)=>{
    h+=`
      <div class="card routine-editor-day" data-day-index="${i}"
        style="margin:0;cursor:default">
        <div class="dayhead">
          <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">
            ${state.reorder?`<span class="drag-handle editor-drag-handle" draggable="true"
              ondragstart="dragDayStart(event,${i})"
              ondragend="dragEndItem()"
              onpointerdown="startEditorPointerDrag(event,'day',${i})"
              ondragend="clientSessionDragFinished()"
              title="Arrastrar sesión">☷</span>`:''}
            <div style="min-width:0">
              <b style="font-size:17px">${esc(d.name||'Sin nombre')}</b>
              <div class="muted">${d.exercises?.length||0} ejercicios</div>
            </div>

          <div class="buttons" style="justify-content:flex-end">
            <button class="btn" type="button" onclick="renameClientSession(${i})" title="Cambiar nombre">⋯</button>
            <button class="btn primary" type="button" onclick="openClientRoutineDayEditor(${i})">Editar sesión</button>
            <button class="btn danger" type="button" onclick="removeClientEditorDay(${i})">Eliminar</button>
          </div>
        </div>
      </div>`;
    h+=gap(i+1);
  });
  list.innerHTML=h;
}

function clientSessionDragFinished(){
  // Do not clear __dayDrag here. On Chromium the dragend event can fire before
  // the drop event reaches the insertion gap. dropDayAt() clears it after the
  // actual move, making consecutive moves reliable.
  document.querySelectorAll('#clientSessionList .routine-editor-day')
    .forEach(x=>x.classList.remove('dragging'));
  document.querySelectorAll('#clientSessionList .day-order-gap')
    .forEach(x=>x.classList.remove('active'));
}

function dragOverClientSessionGap(e){
  if(!__dayDrag)return;
  e.preventDefault();
  e.stopPropagation();
  if(e.dataTransfer)e.dataTransfer.dropEffect='move';
  document.querySelectorAll('#clientSessionList .day-order-gap')
    .forEach(g=>g.classList.remove('active'));
  e.currentTarget.classList.add('active');
}

function dropClientSessionGap(e,targetIndex){
  if(!__dayDrag)return;
  e.preventDefault();
  e.stopPropagation();
  dropDayAt(e,Number(targetIndex));
}

function renameClientSession(i){
  const d=editDays[i]; if(!d)return;
  const name=prompt('Nombre de la sesión:',d.name||'');
  if(name===null)return;
  const clean=name.trim();
  if(!clean)return toast('El nombre no puede estar vacío.');
  d.name=clean;
  renderClientRoutineSessions();
}

function toggleClientSessionReorder(){
  const state=window.__clientRoutineEdit||{};
  state.reorder=!state.reorder;
  window.__clientRoutineEdit=state;
  if(!state.reorder)dragEndItem();
  renderClientRoutineSessions();
  $('clientSessionList')?.classList.toggle('session-reorder-active',!!state.reorder);
}

function addClientEditorDay(){
  editDays.push({
    id:null,
    name:'Nueva sesión',
    day_order:editDays.length,
    exercises:[]
  });
  const state=window.__clientRoutineEdit||{};
  state.reorder=false; state.dayIndex=editDays.length-1;
  window.__clientRoutineEdit=state;
  renderClientRoutineDayEditor(state.dayIndex);
}

function removeClientEditorDay(i){
  if(!editDays[i])return;
  if(!confirm(`¿Eliminar la sesión "${editDays[i].name}" y todos sus ejercicios?`))return;
  editDays.splice(i,1);
  editDays=editDays.map((d,n)=>({...d,day_order:n}));
  renderClientRoutineSessions();
}

function openClientRoutineDayEditor(i){
  if(!editDays[i])return;
  const state=window.__clientRoutineEdit||{};
  state.dayIndex=i; state.reorder=false;
  window.__clientRoutineEdit=state;
  renderClientRoutineDayEditor(i);
}

              <div><label>Descanso (min)</label><input type="number" min="0" step="0.5" value="${(e.rest_seconds||0)/60}" onchange="editDays[${di}].exercises[${ei}].rest_seconds=(+this.value||0)*60"></div>

        </div>
      </div>`;
  });

  h+=`<button class="btn" type="button" onclick="addClientEditorExercise(${di})">+ Añadir ejercicio</button>`;
  box.innerHTML=h;

function toggleClientExerciseReorder(di){
  const state=window.__clientRoutineEdit||{};
  state.exerciseReorder=!state.exerciseReorder;
  state.dayIndex=di;
  window.__clientRoutineEdit=state;
  if(!state.exerciseReorder)dragEndItem();
  renderClientRoutineDayEditor(di);
}

function addClientEditorExercise(di){
  editDays[di].exercises.push({
    id:null,name:'Nuevo ejercicio',sets:2,target:'2x10-15',
    rir:'2',rest_seconds:120,notes:''
  });
  renderClientRoutineDayEditor(di);
}

function removeClientEditorExercise(di,ei){
  if(!editDays[di]?.exercises[ei])return;
  if(!confirm(`¿Eliminar "${editDays[di].exercises[ei].name}"?`))return;
  editDays[di].exercises.splice(ei,1);
  renderClientRoutineDayEditor(di);
}

function backToClientRoutineSessions(){
  const state=window.__clientRoutineEdit||{};
  state.dayIndex=null; state.exerciseReorder=false; state.reorder=false;
  window.__clientRoutineEdit=state;
  dragEndItem();
  renderClientRoutineSessions();
}

async function saveClientRoutineEditor(){
  if(!window.__clientRoutineEdit?.routineId)return;
  // saveEditor() is the single persistence path, so both trainer-owned
  // routines and client-assigned routines use identical database semantics.
  await saveEditor(window.__clientRoutineEdit.routineId);
  window.__clientRoutineEdit.dayIndex=null;
  window.__clientRoutineEdit.reorder=false;
  window.__clientRoutineEdit.exerciseReorder=false;
}

      p_client_id:String(clientId),

async function openClientProfile(clientId){
  if(!user?.id)return toast('Debes iniciar sesión.');
  const cid=String(clientId);

  // Always refresh this client's assignments directly from Supabase.
  const aq=await db.from('routine_assignments')
    .select('id,client_id,trainer_id,trainer_routine_id,client_routine_id,created_at,client_deleted_at')
    .eq('trainer_id',user.id)
    .eq('client_id',cid)
    .order('created_at',{ascending:false});

  if(aq.error){
    console.error('openClientProfile assignments:',aq.error);
    return toast('No se pudieron cargar las rutinas del cliente.');
  }

  const clientAssignments=aq.data||[];
  if(!clientAssignments.length)return toast('Este cliente ya no tiene rutinas asignadas.');

  const title=$('clientModalTitle'), subtitle=$('clientModalSubtitle'), body=$('clientModalBody');
  if(!title||!body)return;

  title.textContent='Cliente';
  subtitle.textContent='Cargando...';
  body.innerHTML='<div class="muted">Cargando información...</div>';
  openM('clientModal');

  try{
    // Profile name is useful, but a profile RLS failure must never hide routines.
    let name='Cliente';
    try{
      const rpc=await db.rpc('get_public_profile_names',{p_user_ids:[cid]});
      const row=(rpc.data||[]).find(x=>String(x.id)===cid);
      if(row?.name)name=String(row.name).trim()||name;
    }catch(_){}

    if(name==='Cliente'){
      try{
        const pr=await db.from('profiles').select('id,name').eq('id',cid).maybeSingle();
        if(!pr.error && pr.data?.name)name=String(pr.data.name).trim()||name;
      }catch(_){}
    }

    title.textContent=name;
    subtitle.textContent=`${clientAssignments.length} rutina${clientAssignments.length===1?'':'s'} asignada${clientAssignments.length===1?'':'s'}`;

    // Fetch the exact assigned trainer routines. Do not rely on the global
    // routine list, which may be filtered/ordered independently.
    const routineIds=[...new Set(clientAssignments.map(a=>a.trainer_routine_id).filter(Boolean).map(String))];
    const routineMap=new Map();

    if(routineIds.length){
      const rq=await db.from('routines')
        .select('id,name,description,share_code,source_routine_id,created_at,deleted_at')
        .in('id',routineIds);

      if(!rq.error){
        for(const r of (rq.data||[]))routineMap.set(String(r.id),r);
      }else{
        console.warn('openClientProfile routines:',rq.error);
      }
    }

    // Never discard an assignment merely because the routine-name query was
    // restricted by RLS. The assignment itself proves which routine was sent.
    const items=clientAssignments.map(a=>({
      assignment:a,
      routine:routineMap.get(String(a.trainer_routine_id)) || {
        id:a.trainer_routine_id,
        name:'Rutina asignada',
        description:''
      }
    }));

    body.innerHTML=`
      <div class="card" style="margin:0 0 12px">
        <div class="muted">Rutinas asignadas</div>
      </div>
      ${items.map(x=>`
        <div class="card" style="margin:8px 0">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
            <div>
              <b>${esc(x.routine.name||'Rutina asignada')}</b>
              <div class="muted">Asignada ${new Date(x.assignment.created_at).toLocaleDateString('es-ES')}</div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
              <button class="btn" onclick="openClientRoutineProgress('${cid}','${x.routine.id}','${esc(x.routine.name||'Rutina')}')">Ver progreso</button>
              <button class="btn primary" onclick="editClientAssignedRoutine('${cid}','${x.routine.id}','${esc(x.routine.name||'Rutina')}')">Editar rutina</button>
              <button class="btn danger" onclick="revokeFromClientProfile('${x.assignment.id}')">Revocar</button>
            </div>
          </div>
        </div>`).join('')}`;
  }catch(e){
    console.error('openClientProfile:',e);
    body.innerHTML='<div class="error">No se pudo cargar el perfil del cliente.</div>';
  }
}

async function revokeFromClientProfile(assignmentId){

  try{
    // IMPORTANT: do not depend on `routines` being loaded correctly.
    // The assignment table itself contains the trainer_id and client_id,
    // so this is the authoritative source for the trainer's client list.
    const q=await db.from('routine_assignments')
      .select('id,client_id,trainer_id,trainer_routine_id,client_routine_id,created_at,client_deleted_at')
      .eq('trainer_id',user.id)
      .order('created_at',{ascending:false});

    if(q.error)throw q.error;

    const activeAssignments=q.data||[];
    assignments=activeAssignments;

    const ids=[...new Set(
      activeAssignments.map(a=>a.client_id).filter(Boolean).map(String)
    )];

    if(!ids.length){
      box.innerHTML=`
        <div class="card">
          <h2 style="margin:0 0 4px">Mis clientes</h2>
          <div class="empty" style="margin-top:14px">Todavía no tienes clientes con rutinas asignadas.</div>
        </div>`;

    // Get routine names independently from the global routines array.
    const routineIds=[...new Set(
      activeAssignments.map(a=>a.trainer_routine_id).filter(Boolean).map(String)
    )];

    const routineMap=new Map();

      const rq=await db.from('routines')
        .select('id,name,description,deleted_at')
        .in('id',routineIds);

      if(!rq.error){
        for(const r of (rq.data||[]))routineMap.set(String(r.id),r);
      }else{
        console.warn('No se pudieron leer nombres de rutinas:',rq.error);
      }
    }

    // Names: try public RPC first, then profiles. Neither failure hides clients.
    const names=new Map();

    try{
      const rpc=await db.rpc('get_public_profile_names',{p_user_ids:ids});
      if(!rpc.error){
        for(const row of (rpc.data||[])){
          if(row?.id)names.set(String(row.id),row.name||'');

      console.warn('RPC nombres:',err);

    const missing=ids.filter(id=>!String(names.get(id)||'').trim());

      try{

          for(const row of (prof.data||[])){
            if(row?.id)names.set(String(row.id),row.name||'');
          }
        }
      }catch(err){
        console.warn('profiles:',err);
      }
    }

    const grouped=new Map();
    for(const a of activeAssignments){
      const cid=String(a.client_id);
      if(!grouped.has(cid))grouped.set(cid,[]);

      const routine=routineMap.get(String(a.trainer_routine_id)) ||
        (routines||[]).find(r=>String(r.id)===String(a.trainer_routine_id)) || {
          id:a.trainer_routine_id,
          name:'Rutina asignada',
          description:''
        };

      grouped.get(cid).push({assignment:a,routine});
    }

    box.innerHTML=`
      <div class="card">
        <h2 style="margin:0 0 4px">Mis clientes</h2>
        <div class="muted">${grouped.size} cliente${grouped.size===1?'':'s'} con rutinas asignadas.</div>
      </div>
      ${[...grouped.entries()].map(([cid,items])=>`
        <div class="card">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
            <div>
              <h3 style="margin:0">${esc((names.get(cid)||'').trim() || cid)}</h3>
              <div class="muted">${items.length} rutina${items.length===1?'':'s'} asignada${items.length===1?'':'s'}</div>
            </div>
            <button class="btn primary" onclick="openClientProfile('${cid}')">Ver cliente</button>
          </div>
          <div style="margin-top:12px">
            ${items.map(x=>`
              <div class="card" style="margin:8px 0;padding:12px">
                <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
                  <div>
                    <b>${esc(x.routine.name||'Rutina asignada')}</b>
                    <div class="muted">Asignada ${new Date(x.assignment.created_at).toLocaleDateString('es-ES')}</div>
                  </div>
                  <button class="btn danger" onclick="revokeClientRoutine('${x.assignment.id}')">Revocar</button>
                </div>
              </div>`).join('')}
          </div>
        </div>`).join('')}`;
  }catch(e){
    console.error('renderClients:',e);
    box.innerHTML=`<div class="card">
      <h2>Mis clientes</h2>
      <div class="error">Error cargando clientes: ${esc(e?.message||'Error desconocido')}</div>
    </div>`;
  }
}

// Captures clicks before drag/drop handlers can interfere.
document.addEventListener('click',function(e){

let __routinePointerDrag=null;

function routineDragCleanup(){
  const d=__routinePointerDrag;
  if(!d)return;
  d.placeholder?.remove();
  d.card?.classList.remove('routine-dragging');
  document.body.classList.remove('routine-pointer-dragging');
  if(d.handle&&d.pointerId!=null){try{d.handle.releasePointerCapture(d.pointerId)}catch(_){}}
  document.removeEventListener('pointermove',routinePointerMove);
  document.removeEventListener('pointerup',routinePointerUp);
  document.removeEventListener('pointercancel',routinePointerCancel);
  __routinePointerDrag=null;
}

function startRoutinePointerDrag(e,index){
  if(profile?.role!=='trainer'||__routinePointerDrag)return;
  if(e.pointerType!=='touch' && e.pointerType!=='pen')return;
  e.preventDefault();e.stopPropagation();

  const handle=e.currentTarget;
  const card=handle.closest('.routine-sortable');
  if(!card)return;

  const placeholder=document.createElement('div');
  placeholder.className='routine-drag-placeholder';
  placeholder.style.height=Math.max(70,card.getBoundingClientRect().height)+'px';
  card.parentNode.insertBefore(placeholder,card);

  __routinePointerDrag={
    index:Number(index),handle,card,placeholder,pointerId:e.pointerId,
    startX:e.clientX,startY:e.clientY,active:false,target:null
  };

  try{handle.setPointerCapture(e.pointerId)}catch(_){}
  document.addEventListener('pointermove',routinePointerMove,{passive:false});
  document.addEventListener('pointerup',routinePointerUp,{passive:false});
  document.addEventListener('pointercancel',routinePointerCancel,{passive:false});
}

function routinePointerMove(e){
  const d=__routinePointerDrag;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();

  if(!d.active){
    if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)<7)return;
    d.active=true;
    d.card.classList.add('routine-dragging');
    document.body.classList.add('routine-pointer-dragging');
  }

  const cards=[...document.querySelectorAll('#mine .routine-sortable')].filter(x=>x!==d.card);
  let before=null;
  for(const card of cards){
    const r=card.getBoundingClientRect();
    if(e.clientY<r.top+r.height/2){before=card;break}
  }

  if(before)before.parentNode.insertBefore(d.placeholder,before);
  else if(cards.length)cards[cards.length-1].parentNode.insertBefore(d.placeholder,cards[cards.length-1].nextSibling);

  d.target=before?Number(before.dataset.routineIndex):routines.length;
}

async function routinePointerUp(e){
  const d=__routinePointerDrag;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();

  const result={active:d.active,from:d.index,to:d.target==null?d.index:d.target};
  routineDragCleanup();
  if(!result.active||result.from===result.to||result.from+1===result.to)return;

  await reorderRoutine(result.from,result.to);
}

function routinePointerCancel(){routineDragCleanup()}

        `).join('')}

  });
  h += `<div class="day-order-zone day-order-zone-last"
        ondragover="dragOverDayZone(event)"
        ondrop="dropDayAt(event,${editDays.length})"></div>`;
  $('daysEditor').innerHTML=h||'<div class="empty">Añade un día.</div>';

function dropExerciseAt(e,targetDay,targetIndex){
  e.preventDefault(); e.stopPropagation();
  if(!__dragItem || __dragItem.type!=='exercise')return;

  const fromDay=__dragItem.di, fromIndex=__dragItem.ei;
  const source=editDays[fromDay]?.exercises;
  const target=editDays[targetDay]?.exercises;
  if(!source || !target)return;

  const [item]=source.splice(fromIndex,1);
  let at=targetIndex;
  if(fromDay===targetDay && fromIndex<at)at--;
  at=Math.max(0,Math.min(at,target.length));
  target.splice(at,0,item);

  editDays.forEach(d=>d.exercises.forEach((ex,i)=>ex.exercise_order=i));
  __dragItem=null;
  clearDropIndicators();
  if(window.__clientRoutineEdit?.dayIndex!=null){
    const affectedFrom=fromDay, affectedTo=targetDay;
    persistClientExerciseOrder(affectedFrom,affectedTo).catch(err=>{
      console.error('persistClientExerciseOrder:',err);
      toast('No se pudo guardar el orden de los ejercicios');
    });
    renderClientRoutineDayEditor(window.__clientRoutineEdit.dayIndex);
  }else if(window.__clientRoutineEdit) renderClientRoutineSessions();

}

function dropDayAt(e,targetIndex){
  if(!__dayDrag)return;
  e.preventDefault();e.stopPropagation();
  const from=Number(__dayDrag.index),to=Number(targetIndex);
  if(from===to||from+1===to){
    __dayDrag=null;
    if(window.__clientRoutineEdit?.reorder)renderClientRoutineSessions();
    else dragEndItem();
    return;
  }
  const next=editDays.slice();
  const [item]=next.splice(from,1);
  const at=from<to?to-1:to;
  next.splice(Math.max(0,Math.min(at,next.length)),0,item);
  editDays=next.map((d,i)=>({...d,day_order:i}));
  // Clear only the client-session drag state; preserve reorder mode.
  __dayDrag=null;
  document.querySelectorAll('#clientSessionList .routine-editor-day')
    .forEach(x=>x.classList.remove('dragging'));
  document.querySelectorAll('#clientSessionList .day-order-gap')
    .forEach(x=>x.classList.remove('active'));
  if(window.__clientRoutineEdit){
    renderClientRoutineSessions();
    persistClientSessionOrder();

}
async function persistClientSessionOrder(){
  const state=window.__clientRoutineEdit;
  if(!state?.routineId||profile?.role!=='trainer')return false;
  try{
    const results=await Promise.all(
      editDays.map((d,i)=>d.id
        ? db.from('routine_days').update({day_order:i}).eq('id',d.id).eq('routine_id',state.routineId).select('id,day_order')
        : Promise.resolve({data:[],error:null}))
    );
    const failed=results.find(x=>x?.error);
    if(failed)throw failed.error;
    const updated=results.flatMap(x=>x?.data||[]);
    const persistedIds=new Set(updated.map(x=>String(x.id)));
    const existingIds=editDays.filter(d=>d.id).map(d=>String(d.id));
    if(existingIds.some(id=>!persistedIds.has(id))){
      throw new Error('No se pudo verificar el guardado de una o más sesiones (posible RLS).');
    }
    const verify=await db.from('routine_days').select('id,day_order').eq('routine_id',state.routineId);
    if(verify.error)throw verify.error;
    const byId=new Map((verify.data||[]).map(x=>[String(x.id),Number(x.day_order)]));
    for(let i=0;i<editDays.length;i++){
      if(editDays[i].id && byId.get(String(editDays[i].id))!==i)
        throw new Error('El orden de sesiones no coincide con la base de datos.');
    }
    editDays=editDays.map((d,i)=>({...d,day_order:i}));
    toast('Orden de sesiones guardado automáticamente');
    return true;
  }catch(err){
    console.error('persistClientSessionOrder:',err);
    toast('No se pudo guardar el orden de las sesiones');
    return false;
  }
}

async function reorderRoutine(from,targetIndex){
  if(from<0 || from>=routines.length)return;

  const previous=routines.slice();
  const copy=routines.slice();
  const [item]=copy.splice(from,1);
  let at=targetIndex;
  if(from<at)at--;
  at=Math.max(0,Math.min(at,copy.length));

  if(at===from){renderMine();return;}

  copy.splice(at,0,item);
  routines=copy.map((r,i)=>({...r,routine_order:i}));
  renderMine();

  try{
    // Persist all rows together. This keeps positions contiguous (0..n-1).
    const results=await Promise.all(
      routines.map((r,i)=>db.from('routines')
        .update({routine_order:i})
        .eq('id',r.id)
        .eq('owner_id',user.id)
        .is('deleted_at',null))
    );
    const failed=results.find(x=>x.error);
    if(failed)throw failed.error;
    toast('Orden guardado');
  }catch(err){
    console.error('reorderRoutine:',err);
    routines=previous;
    renderMine();
    toast('No se pudo guardar el orden');
  }
}

async function saveEditor(id){
  if(window.__routineSaving)return;
  const name=$('en').value.trim();
  if(!name)return toast('Pon un nombre a la rutina');
  if(editDays.some(d=>!d.name.trim()))return toast('Pon nombre a todos los días');
  if(editDays.some(d=>d.exercises.some(e=>!e.name.trim())))return toast('Pon nombre a todos los ejercicios');
  window.__routineSaving=true;
  try{
    const u=await db.from('routines').update({name,description:$('ed').value.trim(),updated_at:new Date().toISOString()}).eq('id',id).eq('owner_id',user.id);
    if(u.error)throw u.error;
    for(let di=0;di<editDays.length;di++){
      const d=editDays[di];let did=d.id;
      if(did){
        const q=await db.from('routine_days').update({name:d.name.trim(),day_order:di}).eq('id',did).eq('routine_id',id);
        if(q.error)throw q.error;
      }else{
        const q=await db.from('routine_days').insert({routine_id:id,name:d.name.trim(),day_order:di}).select().single();
        if(q.error)throw q.error;did=q.data.id;d.id=did;
      }
      const old=await db.from('routine_exercises').select('id').eq('day_id',did);
      if(old.error)throw old.error;
      const keep=[];
      for(let ei=0;ei<d.exercises.length;ei++){
        const e=d.exercises[ei],payload={day_id:did,name:e.name.trim(),sets:Math.max(1,Number(e.sets)||1),target:e.target||'',rir:e.rir===''||e.rir==null?null:Number(e.rir),rest_seconds:Math.max(0,Number(e.rest_seconds)||0),exercise_order:ei,notes:e.notes||null};
        if(e.id){
          const q=await db.from('routine_exercises').update(payload).eq('id',e.id).eq('day_id',did);
          if(q.error)throw q.error;keep.push(e.id);
        }else{
          const q=await db.from('routine_exercises').insert(payload).select().single();
          if(q.error)throw q.error;e.id=q.data.id;keep.push(e.id);
        }
      }
      const stale=(old.data||[]).map(x=>x.id).filter(x=>!keep.includes(x));
      if(stale.length){
        const q=await db.from('routine_exercises').delete().in('id',stale).eq('day_id',did);
        if(q.error)throw q.error;
      }
    }
    const all=await db.from('routine_days').select('id').eq('routine_id',id);
    if(all.error)throw all.error;
    const keepD=editDays.map(d=>d.id).filter(Boolean);
    const staleD=(all.data||[]).map(x=>x.id).filter(x=>!keepD.includes(x));
    if(staleD.length){
      const ex=await db.from('routine_exercises').select('id').in('day_id',staleD);
      if(ex.error)throw ex.error;
      if(ex.data?.length){
        const q=await db.from('routine_exercises').delete().in('id',ex.data.map(x=>x.id));
        if(q.error)throw q.error;
      }
      const q=await db.from('routine_days').delete().in('id',staleD).eq('routine_id',id);
      if(q.error)throw q.error;
    }
    await reload();closeM('editModal');renderMine();toast('Rutina guardada');
  }catch(e){console.error('saveEditor:',e);toast('No se pudo guardar la rutina')}
  finally{window.__routineSaving=false}
}
async function delRoutine(id){
  if(window.__routineDeleting)return;
  if(!user?.id)return toast('Debes iniciar sesión.');
  if(!confirm('¿Mover esta rutina a la papelera?'))return;
  window.__routineDeleting=true;
  try{
    const stamp=new Date().toISOString();

    // Client: only soft-delete this client's assignment. Never touch routines.
    if(profile?.role==='client'){
      const a0=(assignments||[]).find(x=>String(x.trainer_routine_id)===String(id) && String(x.client_id)===String(user.id));
      if(!a0?.id){
        throw new Error('No se encontró la asignación de esta rutina. No se ha borrado nada.');
      }

      const a=await db.from('routine_assignments')
        .update({client_deleted_at:stamp})
        .eq('id',a0.id)
        .eq('client_id',user.id)
        .is('client_deleted_at',null);
      if(a.error)throw a.error;

      const key='simple_client_trash_'+user.id;
      let cached=[];try{cached=JSON.parse(localStorage.getItem(key)||'[]')}catch(_){}
      if(!Array.isArray(cached))cached=[];
      // Clients don't load trainer-owned routines into `routines`, so obtain
      // the real metadata before hiding the assignment. This prevents the
      // paper bin from showing the generic name "Rutina".
      let meta={};
      try{
        const mk='simple_shared_routine_meta_'+user.id;
        meta=JSON.parse(localStorage.getItem(mk)||'{}')?.[String(a0.trainer_routine_id)]||{};
      }catch(_){}
      const sourceRoutine=await db.from('routines')
        .select('id,name,description')
        .eq('id',a0.trainer_routine_id)
        .maybeSingle();
      if(sourceRoutine.error)throw sourceRoutine.error;

      const trashRow={
        id:a0.id,
        trainer_routine_id:a0.trainer_routine_id,
        created_at:a0.created_at||stamp,
        client_deleted_at:stamp,
        routine_name:sourceRoutine.data?.name||meta.name||'Rutina',
        routine_description:sourceRoutine.data?.description||meta.description||''
      };
      localStorage.setItem(key,JSON.stringify([
        trashRow,
        ...cached.filter(x=>String(x.id)!==String(trashRow.id))
      ]));

      await reload();
      renderShared();
      await renderClientTrash();
      toast('Rutina movida a la papelera');
      return;
    }

    // Trainer-owned routine: soft-delete the routine itself.
    const r=await db.from('routines').update({deleted_at:stamp})
      .eq('id',id).eq('owner_id',user.id).is('deleted_at',null)
      .select('id,deleted_at').single();
    if(r.error)throw r.error;
    if(!r.data?.deleted_at)throw new Error('La rutina no quedó marcada como eliminada.');
    await reload();
    renderMine();
    await renderTrash();
    toast('Rutina movida a la papelera');
  }catch(e){
    console.error('delRoutine:',e);
    toast('No se pudo mover la rutina a la papelera: '+(e.message||'revisa los permisos'));
  }finally{
    window.__routineDeleting=false;
  }
}
