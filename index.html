async function deleteWorkout(id){
  if(window.__deletingWorkout)return;
  const session=(window.workoutHistory||[]).find(x=>String(x.id)===String(id));
  if(!session)return toast('Sesión no encontrada.');

  const data=session.data||{};
  const name=data.routine_name||'esta sesión';
  const day=data.day_name||session.day||'';
  const date=session.workout_date?new Date(session.workout_date).toLocaleDateString('es-ES'):'';
  if(!confirm(`¿Eliminar ${name}${day?' · '+day:''}${date?' · '+date:''} del historial?`))return;

  window.__deletingWorkout=true;
  try{
    const r=await db.rpc('delete_my_workout',{p_workout_id:id});
    if(r.error)throw r.error;

    await loadHistory();
    if((window.workoutHistory||[]).some(x=>String(x.id)===String(id))){
      throw new Error('La sesión sigue en el historial después de borrarla.');
    }

    selectedWorkoutIds.delete(String(id));
    showHistory();
    toast('Sesión eliminada');
  }catch(e){
    console.error('deleteWorkout:',e);
    toast('No se pudo borrar la sesión: '+(e.message||'error'));
  }finally{
    window.__deletingWorkout=false;
  }
}


function getPreviousExerciseSession(exerciseId){
  const history=window.workoutHistory||[];
  const routineId=workoutRoutine?.id||null;
  const routineName=workoutRoutine?.name||'';

  const candidates=history.filter(s=>{
    const d=s.data||{};
    const sameRoutine=routineId
      ? String(d.routine_id||'')===String(routineId)
      : String(d.routine_name||'')===String(routineName);
    if(!sameRoutine)return false;
    return Array.isArray(d.exercises) &&
      d.exercises.some(e=>String(e.exercise_id||'')===String(exerciseId));
  }).sort((a,b)=>{
    const da=Date.parse(a.workout_date||a.data?.workout_date||0);
    const db=Date.parse(b.workout_date||b.data?.workout_date||0);
    return db-da;
  });

  const currentDate=Date.now();
  for(const session of candidates){
    const d=session.data||{};
    const sessionDate=Date.parse(session.workout_date||d.workout_date||0);
    // If this is the exact current workout record, skip it.
    if(workoutRoutine?.id && String(d.routine_id||'')===String(workoutRoutine.id) &&
       activeWorkout?.day?.id && String(d.routine_day_id||'')===String(activeWorkout.day.id) &&
       sessionDate>=currentDate-24*60*60*1000){
      continue;
    }
    const exercise=(d.exercises||[]).find(e=>String(e.exercise_id||'')===String(exerciseId));
    if(exercise)return {exercise,date:new Date(session.workout_date||d.workout_date||0)};
  }
  return null;
}

function workoutNotesKey(){
  return user?.id && workoutRoutine?.id && activeWorkout?.day?.id

async function startWorkoutDay(dayId){
  try{
    // Cargar el día y ejercicios es el flujo principal.
    const d=await db.from('routine_days')
      .select('id,name,day_order')
      .eq('id',dayId)
      .single();
    if(d.error)throw d.error;

    const x=await db.from('routine_exercises')
      .select('id,name,sets,target,rir,rest_seconds,exercise_order,notes')
      .eq('day_id',dayId)
      .order('exercise_order');
    if(x.error)throw x.error;

    activeWorkout={
      day:d.data,
      exercises:x.data||[],
      sets:{},
      locked:false,
      lockedSession:null,
      editing:false,
      reordering:false
    };

    // Observaciones persistentes DEL USUARIO, nunca escribiendo sobre
    // routine_exercises. La rutina del entrenador no se modifica.
    const notesKey=workoutNotesKey();
    let localNotes={};
    try{localNotes=JSON.parse(localStorage.getItem(notesKey)||'{}')||{};}catch(_){}

    for(const e of activeWorkout.exercises){
      const base=Array.from({length:e.sets||1},()=>({
        kg:'',reps:'',rir:'',done:false
      }));
      base.note=localNotes[e.id]!==undefined
        ? String(localNotes[e.id]??'')
        : String(e.notes??'');
      activeWorkout.sets[e.id]=base;
    }

    // El historial es auxiliar: si falla, la rutina sigue pudiendo abrirse.
    try{
      await loadHistory(workoutRoutine?.id);
    }catch(e){
      console.warn('Historial no disponible:',e);
      window.workoutHistory=[];
    }

    const today=new Date().toISOString().slice(0,10);
    const todaySession=(window.workoutHistory||[]).find(session=>{
      const data=session.data||{};
      return String(data.routine_id||'')===String(workoutRoutine.id) &&
        String(data.routine_day_id||'')===String(dayId) &&
        String(session.workout_date||'').slice(0,10)===today;
    });

    // Si existe sesión hoy, cargarla y bloquearla.
    if(todaySession){
      activeWorkout.locked=true;
      activeWorkout.lockedSession=todaySession;

      const savedExercises=Array.isArray(todaySession.data?.exercises)
        ? todaySession.data.exercises : [];

      for(const e of activeWorkout.exercises){
        const saved=savedExercises.find(se=>String(se.exercise_id||'')===String(e.id))
          || savedExercises.find(se=>
            String(se.name||'').trim().toLowerCase()===String(e.name||'').trim().toLowerCase()
          );
        if(!saved)continue;

        const base=Array.from({length:e.sets||1},(_,i)=>({
          kg:'',reps:'',rir:'',done:false,
          ...(saved.sets?.[i]||{})
        }));
        base.note=String(saved.notes ?? activeWorkout.sets[e.id]?.note ?? '');
        activeWorkout.sets[e.id]=base;
      }
    }

    // Solo recuperar borrador si todavía no está guardada la sesión.
    const recovered=!activeWorkout.locked && loadWorkoutDraft();

    $('trainTitle').textContent=d.data.name;
    $('trainSubtitle').textContent=activeWorkout.locked
      ? 'Sesión ya guardada hoy. Puedes consultarla, pero no volver a modificarla.'
      : recovered
        ? 'Sesión recuperada automáticamente. Tus datos se guardan mientras entrenas.'
        : 'Completa tus series y guarda tus datos.';

    renderWorkoutDay();

    if(activeWorkout.locked)toast('Esta sesión ya está guardada hoy');
    else if(recovered)toast('Sesión recuperada');
  }catch(e){
    console.error('startWorkoutDay:',e);
    toast('No se pudo cargar el entrenamiento');
  }
}

function workoutDraftKey(){
  return user?.id && workoutRoutine?.id && activeWorkout?.day?.id
    ? `simple_workout_draft_v2:${user.id}:${workoutRoutine.id}:${activeWorkout.day.id}`
    : null;
}

// Marca cuándo se completó por última vez este día de rutina.
// Sirve para impedir que un borrador viejo vuelva a rellenar KG/REPS/RIR
// cuando empieza el siguiente ciclo de entrenamiento.
function workoutCompletionKey(){
  return user?.id && workoutRoutine?.id && activeWorkout?.day?.id
    ? `simple_workout_completed_v1:${user.id}:${workoutRoutine.id}:${activeWorkout.day.id}`
    : null;
}
function markWorkoutCompleted(){
  const key=workoutCompletionKey();
  if(!key)return;
  try{
    localStorage.setItem(key,String(Date.now()));
  }catch(_){ }
}

function saveWorkoutDraft(){
  const key=workoutDraftKey();
  if(!key)return;
  try{
    localStorage.setItem(key,JSON.stringify({
      savedAt:Date.now(),
      routineId:workoutRoutine.id,
      dayId:activeWorkout.day.id,
      sets:Object.fromEntries(
        Object.entries(activeWorkout.sets||{}).map(([id,arr])=>[
          id,
          {
            rows:Array.isArray(arr)?arr.map(x=>({...x})):[],
            note:String(arr?.note??'')
          }
        ])
      )
    }));
  }catch(e){console.warn('No se pudo guardar el borrador:',e);}
}
function loadWorkoutDraft(){
  const key=workoutDraftKey();
  if(!key)return false;
  try{
    const raw=localStorage.getItem(key);
    if(!raw)return false;
    const draft=JSON.parse(raw);
    if(!draft?.sets)return false;

    // Un borrador solo puede recuperar una sesión que siga pendiente.
    // Si ya se completó ese día después de crear el borrador, se descarta.
    const completedKey=workoutCompletionKey();
    const completedAt=completedKey ? Number(localStorage.getItem(completedKey)||0) : 0;
    const draftSavedAt=Number(draft.savedAt||0);
    if(completedAt && (!draftSavedAt || draftSavedAt <= completedAt)){
      localStorage.removeItem(key);
      return false;
    }
    for(const e of activeWorkout.exercises){
      const base=Array.from({length:e.sets||1},()=>({kg:'',reps:'',rir:'',done:false}));
      const rawSaved=draft.sets?.[e.id];
      const savedRows=Array.isArray(rawSaved)
        ? rawSaved
        : (Array.isArray(rawSaved?.rows)?rawSaved.rows:null);
      activeWorkout.sets[e.id]=savedRows
        ? base.map((s,i)=>({...s,...(savedRows[i]||{})}))
        : base;

      const savedNote=Array.isArray(rawSaved)
        ? (Object.prototype.hasOwnProperty.call(rawSaved,'note') ? rawSaved.note : undefined)
        : rawSaved?.note;

      if(savedNote!==undefined){
        activeWorkout.sets[e.id].note=String(savedNote??'');
      }else{
        const noteKey=workoutNotesKey();
        try{
          const notes=noteKey ? JSON.parse(localStorage.getItem(noteKey)||'{}')||{} : {};
          if(Object.prototype.hasOwnProperty.call(notes,e.id)){
            activeWorkout.sets[e.id].note=String(notes[e.id]??'');
          }
        }catch(_){}
      }
    }
    return true;
  }catch(e){console.warn('No se pudo recuperar el borrador:',e);return false;}
}
function clearWorkoutDraft(){
  // KG, REPS y RIR pertenecen a la sesión actual.
  // El borrador solo existe mientras una sesión está sin guardar.
  const key=workoutDraftKey();
  if(key)try{localStorage.removeItem(key);}catch(_){}
}

function formatStipulatedRest(e){
  const preset=routinePresetForExercise(e?.name);
  if(preset?.restLabel)return preset.restLabel;
  const sec=Number(e?.rest_seconds)||0;
  if(!sec)return '-';
  const min=Math.floor(sec/60), rem=sec%60;
  return rem?`${min}:${String(rem).padStart(2,'0')}`:`${min}'`;
}

function summarizePreviousExercise(previous){
  if(!previous?.exercise)return null;
  const sets=Array.isArray(previous.exercise.sets)?previous.exercise.sets:[];
  const valid=sets.map(s=>({
    kg:Number.parseFloat(s.kg),
    reps:Number.parseFloat(s.reps),
    rir:s.rir===''||s.rir==null?null:Number.parseFloat(s.rir),
    done:!!s.done
  })).filter(s=>Number.isFinite(s.kg)&&Number.isFinite(s.reps));

  if(!valid.length)return null;
  const completed=valid.filter(s=>s.done);
  const pool=completed.length?completed:valid;
  const best=pool.slice().sort((a,b)=>{
    if(b.kg!==a.kg)return b.kg-a.kg;
    return b.reps-a.reps;
  })[0];
  const totalVolume=pool.reduce((sum,s)=>sum+(s.kg*s.reps),0);
  const rirVals=pool.map(s=>s.rir).filter(Number.isFinite);
  const avgRir=rirVals.length?rirVals.reduce((a,b)=>a+b,0)/rirVals.length:null;
  return {best,totalVolume,avgRir,sets:pool.length};
}

let workoutReorderRows=[];
let workoutReorderZones=[];
let __workoutReorderDrag=null;
function workoutReorderStart(e,index){
  if(!activeWorkout?.reordering)return;
  e.preventDefault();e.stopPropagation();
  const handle=e.currentTarget;
  const row=handle.closest('.workout-reorder-bar');
  if(!row)return;
  __workoutReorderDrag={
    index:Number(index),handle,row,startX:e.clientX,startY:e.clientY,
    active:false,pointerId:e.pointerId,zone:null,raf:0
  };
  try{handle.setPointerCapture(e.pointerId)}catch(_){}
  document.addEventListener('pointermove',workoutReorderPointerMove,{passive:false});
  document.addEventListener('pointerup',workoutReorderPointerUp,{passive:false});
  document.addEventListener('pointercancel',workoutReorderPointerCancel,{passive:false});
}
function workoutReorderEnd(){
  const d=__workoutReorderDrag;
  if(d?.raf)cancelAnimationFrame(d.raf);
  document.querySelectorAll('.workout-reorder-bar').forEach(x=>x.classList.remove('dragging'));
  document.querySelectorAll('.workout-reorder-zone').forEach(x=>x.classList.remove('active'));
  document.removeEventListener('pointermove',workoutReorderPointerMove);
  document.removeEventListener('pointerup',workoutReorderPointerUp);
  document.removeEventListener('pointercancel',workoutReorderPointerCancel);
  if(d?.handle&&d.pointerId!=null){try{d.handle.releasePointerCapture(d.pointerId)}catch(_){}}
  __workoutReorderDrag=null;
}
function workoutReorderPointerMove(e){
  const d=__workoutReorderDrag;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();
  if(!d.active){
    if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)<5)return;
    d.active=true;d.row.classList.add('dragging');
  }
  if(d.raf)return;
  d.lastY=e.clientY;
  d.raf=requestAnimationFrame(()=>{
    d.raf=0;
    const zones=workoutReorderZones||[];
    let target=zones.length-1;
    const rows=workoutReorderRows||[];
    for(let i=0;i<rows.length;i++){
      if(i===d.index)continue;
      const r=rows[i].getBoundingClientRect();
      if(d.lastY<r.top+r.height/2){target=i;break;}
    }
    const z=zones[target];
    if(z!==d.zone){
      if(d.zone)d.zone.classList.remove('active');
      d.zone=z||null;
      if(d.zone)d.zone.classList.add('active');
    }
  });
}
async function workoutReorderPointerUp(e){
  const d=__workoutReorderDrag;
  if(!d||e.pointerId!==d.pointerId)return;
  e.preventDefault();
  if(!d.active){workoutReorderEnd();return;}
  const rows=workoutReorderRows||[];
  let target=rows.length;
  for(let i=0;i<rows.length;i++){
    if(i===d.index)continue;
    const r=rows[i].getBoundingClientRect();
    if(e.clientY<r.top+r.height/2){target=i;break;}
  }
  const from=d.index;
  workoutReorderEnd();
  if(from!==target&&from+1!==target)await workoutReorderCommit(from,target);
}
function workoutReorderPointerCancel(){workoutReorderEnd();}
async function workoutReorderCommit(from,to){
  if(window.__workoutExerciseReordering)return;
  window.__workoutExerciseReordering=true;
  try{
    const next=activeWorkout.exercises.slice();
    const [item]=next.splice(from,1);
    const at=Math.max(0,Math.min(from<to?to-1:to,next.length));
    next.splice(at,0,item);
    for(let i=0;i<next.length;i++){
      const q=await db.from('routine_exercises').update({exercise_order:10000+i}).eq('id',next[i].id).eq('day_id',activeWorkout.day.id);
      if(q.error)throw q.error;
    }
    for(let i=0;i<next.length;i++){
      const q=await db.from('routine_exercises').update({exercise_order:i}).eq('id',next[i].id).eq('day_id',activeWorkout.day.id);
      if(q.error)throw q.error;
    }
    const verify=await db.from('routine_exercises').select('id').eq('day_id',activeWorkout.day.id).order('exercise_order',{ascending:true});
    if(verify.error)throw verify.error;
    const ids=(verify.data||[]).map(x=>String(x.id));
    if(ids.join('|')!==next.map(x=>String(x.id)).join('|'))throw new Error('Orden de ejercicios no verificado');
    activeWorkout.exercises=next;
    activeWorkout.reordering=false;
    renderWorkoutDay();
    toast('Guardado automáticamente');
  }catch(err){console.error('exercise reorder:',err);toast('No se pudo guardar el orden');}
  finally{window.__workoutExerciseReordering=false;}
}
function workoutReorderOver(e){
  if(!__workoutReorderDrag)return;e.preventDefault();e.stopPropagation();

    }
    const verify=await db.from('routine_exercises').select('id')

    if(verify.error)throw verify.error;
    const dbIds=(verify.data||[]).map(x=>String(x.id));

async function saveWorkoutSession(){
  if(window.__savingWorkout)return;
  if(!user?.id)return toast('Debes iniciar sesión.');
  if(!workoutRoutine?.id||!activeWorkout?.day?.id)return toast('No hay un entrenamiento activo.');
  if(activeWorkout.locked)return toast('Este entrenamiento ya está guardado hoy.');

  const today=new Date().toISOString().slice(0,10);
  const currentKey=`${user.id}|${workoutRoutine.id}|${activeWorkout.day.id}|${today}`;
  if(window.__lastSavedWorkoutKey===currentKey){
    activeWorkout.locked=true;
    renderWorkoutDay();
    return toast('Este entrenamiento ya está guardado hoy.');
  }

  window.__savingWorkout=true;
  try{
    // Fuente de verdad: Supabase. Sobrevive a recarga/cierre/otra pestaña.
    const existing=await db.from('workouts')
      .select('id')
      .eq('user_id',user.id)
      .eq('workout_date',today)
      .eq('data->>routine_id',String(workoutRoutine.id))
      .eq('data->>routine_day_id',String(activeWorkout.day.id))
      .limit(1);

    if(existing.error)throw existing.error;

    if((existing.data||[]).length){
      window.__lastSavedWorkoutKey=currentKey;
      activeWorkout.locked=true;
      renderWorkoutDay();
      return toast('Este entrenamiento ya está guardado hoy.');
    }

    const sessionData={
      routine_id:workoutRoutine.id,
      routine_day_id:activeWorkout.day.id,
      routine_name:workoutRoutine.name||'Entrenamiento',
      day_name:activeWorkout.day.name||'',
      workout_date:new Date().toISOString(),
      exercises:(activeWorkout.exercises||[]).map(e=>{
        const st=activeWorkout.sets[e.id]||[];
        return {
          exercise_id:e.id,
          name:e.name,
          target:e.target||'',
          planned_sets:e.sets||1,
          planned_rir:(e.rir!==null&&e.rir!==undefined&&e.rir!=='')?e.rir:null,
          rest_minutes:(e.rest_seconds||0)/60,
          notes:String(st.note??''),
          sets:st.map((set,i)=>({
            set:i+1,
            kg:set.kg??'',
            reps:set.reps??'',
            rir:set.rir??'',
            done:!!set.done
          }))
        };
      })
    };

    const payload={
      user_id:user.id,
      variant:activeWorkout.day.name||'',
      day:activeWorkout.day.name||'',
      workout_date:today,
      data:sessionData
    };

    const r=await db.from('workouts').insert(payload).select().single();
    if(r.error)throw r.error;

    // Persistimos las notas en localStorage del usuario y en la sesión guardada.
    // NO modificamos routine_exercises.
    const notes={};
    for(const e of (activeWorkout.exercises||[])){
      notes[e.id]=String(activeWorkout.sets[e.id]?.note??'');
    }
    const notesKey=workoutNotesKey();
    if(notesKey){
      try{localStorage.setItem(notesKey,JSON.stringify(notes));}catch(e){}
    }

    window.__lastSavedWorkoutKey=currentKey;
    // La sesión acaba de terminar: cualquier borrador anterior de este
    // mismo día queda invalidado y la próxima apertura empieza limpia.
    markWorkoutCompleted();
    clearWorkoutDraft();
    activeWorkout.locked=true;
    activeWorkout.lockedSession=r.data||null;

    toast('Sesión guardada correctamente');
    await loadHistory(workoutRoutine?.id);
    showHistory();
  }catch(e){
    console.error('saveWorkoutSession:',e);
    toast('No se pudo guardar la sesión: '+(e.message||'revisa la tabla workouts'));
  }finally{
    window.__savingWorkout=false;
  }
}


function shareHeaderOpen(){
  if(!routines.length)return toast('Primero crea una rutina');
  openShare(routines[0].id);
}

async function openShare(routineId){
  const r=routines.find(x=>x.id===routineId);
  if(!r)return toast('Rutina no encontrada.');

  $('shareTitle').textContent=`Compartir · ${r.name}`;
  $('shareForm').innerHTML=`
    <div class="grid">
      <div>
        <label>Límite de usos</label>
        <select id="shareUses">
          <option value="1">1 uso</option>
          <option value="5">5 usos</option>
          <option value="10">10 usos</option>
          <option value="0">Ilimitado</option>
        </select>
      </div>
      <div>
        <label>Caducidad</label>
        <select id="shareExpiry">
          <option value="0">Sin caducidad</option>
          <option value="1">24 horas</option>
          <option value="7">7 días</option>
          <option value="30">30 días</option>
        </select>
      </div>
    </div>
    <div class="buttons" style="justify-content:flex-end;margin-top:14px">
      <button class="btn primary" onclick="createShareCode('${routineId}')">Generar código</button>
    </div>
    <div id="shareResult" style="margin-top:14px"></div>`;
  openM('shareModal');
}

async function createShareCode(routineId){
  if(window.__shareBusy) return;
  window.__shareBusy = true;
  const btns=document.querySelectorAll('#shareModal button');
  btns.forEach(b=>b.disabled=true);
  try{
    if(!user?.id) return toast('Debes iniciar sesión.');
    if(!routineId) return toast('No se ha seleccionado una rutina.');

    const uses=Number($('shareUses')?.value ?? 1);
    const days=Number($('shareExpiry')?.value ?? 0);
    const expires=days ? new Date(Date.now()+days*86400000).toISOString() : null;

    if(!Number.isInteger(uses) || uses < 0)
      return toast('El límite de usos no es válido.');

    const r=await db.rpc('create_routine_share_code',{
      p_routine_id:routineId,
      p_max_uses:uses,
      p_expires_at:expires
    });

    if(r.error){
      console.error('create share code:',r.error);
      return toast(r.error.message || 'No se pudo generar el código.');
    }

    const row=Array.isArray(r.data) ? r.data[0] : r.data;
    const value=row?.code ?? row;
    if(!value) return toast('Supabase no devolvió ningún código.');

    const result=$('shareResult');
    if(result) result.innerHTML=`
      <div class="card" style="text-align:center">
        <div class="muted">Código de acceso</div>
        <div style="font-size:30px;font-weight:800;letter-spacing:4px;margin:8px 0">${esc(value)}</div>
        <div class="muted">Comparte este código con tu cliente.</div>
      </div>`;
  }catch(e){
    console.error('createShareCode unexpected error:',e);
    toast(e?.message || 'No se pudo generar el código.');
  }finally{
    window.__shareBusy=false;
    btns.forEach(b=>b.disabled=false);
  }
}


async function removeSharedRoutine(assignmentId, routineName){
  if(window.__removeSharedBusy)return;
  const ok=confirm(`¿Quieres mover "${routineName||'esta rutina'}" a la papelera?\n\nPodrás restaurarla después.`);
  if(!ok)return;
  window.__removeSharedBusy=true;
  try{
    const r=await db.from('routine_assignments')
      .update({client_deleted_at:new Date().toISOString()})
      .eq('id',assignmentId)
      .eq('client_id',user.id)
      .is('client_deleted_at',null);
    if(r.error)throw r.error;
    await reload(); await renderShared();
    toast('Rutina movida a la papelera');
  }catch(e){
    console.error('remove shared routine:',e);
    toast(e?.message||'No se pudo mover la rutina a la papelera.');
  }finally{window.__removeSharedBusy=false}
}



async function renderShared(){
  let h=`<div class="card">
    <h2 style="margin:0 0 4px">Rutinas compartidas</h2>
    <div class="muted">Rutinas que un entrenador te ha asignado.</div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <input id="redeemCode" placeholder="Código SIMPLE" style="flex:1;min-width:180px;text-transform:uppercase">
      <button class="btn primary" onclick="redeemShareCode()">Añadir rutina</button>
    </div>
  </div>`;

  for(const a of assignments){
    const r=await db.from('routines').select('id,name,description').eq('id',a.trainer_routine_id).maybeSingle();
    if(r.data)h+=`<div class="card routine">
      <div><h3>${esc(r.data.name)}</h3><div class="muted">${esc(r.data.description||'')}</div></div>
      <div class="buttons">
        <button class="btn primary" onclick="openSharedRoutine('${r.data.id}')">Abrir</button>
        <button class="btn danger" onclick='removeSharedRoutine(${JSON.stringify(a.id)},${JSON.stringify(r.data.name||'')})'>Eliminar</button>
      </div>
    </div>`;
  }
  $('shared').innerHTML=h;
}

async function openSharedRoutine(id){
  const r=await db.from('routines').select('id,name,description,share_code,source_routine_id,owner_id,created_at').eq('id',id).maybeSingle();
  if(r.error||!r.data)return toast('No se pudo abrir la rutina compartida.');
  const original=r.data;
  workoutRoutine=original;
  try{
    const d=await days(id);
    $('trainTitle').textContent=original.name;
    $('trainSubtitle').textContent='Rutina compartida por tu entrenador.';
    $('trainBody').innerHTML=d.length?`
      <div class="card">
        <h3 style="margin-top:0">Días de entrenamiento</h3>
        ${d.map(x=>`<button class="btn" style="width:100%;margin:6px 0;text-align:left" onclick="startWorkoutDay('${x.id}')">
          <b>${esc(x.name)}</b><span class="muted" style="float:right">${x.exercises.length} ejercicios</span>
        </button>`).join('')}
      </div>`:'<div class="empty">Esta rutina todavía no tiene días.</div>';
    openM('trainModal');
  }catch(e){console.error(e);toast('No se pudo abrir la rutina')}
}

async function redeemShareCode(){
  if(window.__redeemBusy) return;
  const input=$('redeemCode');
  const code=(input?.value||'').trim().toUpperCase();
  if(!code)return toast('Introduce un código.');

  const btn=input?.parentElement?.querySelector('button');
  window.__redeemBusy = true;
  if(btn) btn.disabled=true;
  try{
    const r=await db.rpc('redeem_routine_share_code',{p_code:code});
    if(r.error) throw r.error;
    if(input) input.value='';
    await reload();
    view('shared');
    toast('Rutina añadida correctamente');
  }catch(e){
    console.error('redeem code:',e);
    toast(e?.message||'Código no válido.');
  }finally{
    window.__redeemBusy=false;
    if(btn) btn.disabled=false;
  }
}

(async()=>{
  try{
    const s=await db.auth.getSession();

    if(s.error){
      console.error('Session error:',s.error);
      msg('No se pudo comprobar la sesión.');
      return;
    }

    const hashParams=new URLSearchParams((window.location.hash||'').replace(/^#/,' '));
    const isRecovery=new URLSearchParams(window.location.search).get('reset')==='1' || hashParams.get('type')==='recovery';
    if(isRecovery){
      if(s.data?.session?.user) user=s.data.session.user;
      openPasswordReset();
      return;
    }

    if(s.data?.session){
      // Tras confirmar el correo, Supabase vuelve a esta URL con una sesión.
      // En ese momento creamos el perfil si todavía no existe y usamos el
      // rol guardado en user_metadata.
      const u=await db.auth.getUser();
      if(u.data?.user){
        user=u.data.user;
        try{
          profile=await finishConfirmedSignup();
          if(!window.__simpleStarted) window.__simpleStarted=true;
          await start(null);
        }catch(e){
          console.error('Post-confirmation setup:',e);
          msg(e?.message || 'La cuenta está confirmada, pero no se pudo completar el perfil.');
        }
      }
    }
  }catch(e){
    console.error('Init error:',e);
    msg(e?.message || 'No se pudo conectar con Supabase.');
  }
})();

// Si llegamos a SIMPLE con parámetros de confirmación pero sin sesión,
// no mostramos una página en blanco: damos una instrucción clara.
if(/[?&](code|token_hash)=/.test(window.location.search) && !window.location.hash){
  setTimeout(()=>{
    if($('auth') && $('app').style.display==='none'){
      msg('La confirmación está procesándose. Si no entras automáticamente, vuelve a abrir SIMPLE e inicia sesión.');
    }
  },1200);
}

// Protección contra dobles clics en acciones sensibles.
document.addEventListener('click', function(e){
  const btn=e.target.closest('button');
  if(!btn || btn.dataset.keepEnabled==='true') return;
  if(!(btn.dataset.action || btn.type==='submit' || btn.classList.contains('primary'))) return;
  if(btn.dataset.robustClick==='1'){
    e.preventDefault();
    e.stopImmediatePropagation();
    return;
  }
  btn.dataset.robustClick='1';
  setTimeout(()=>btn.dataset.robustClick='0',900);
}, true);
</script>
